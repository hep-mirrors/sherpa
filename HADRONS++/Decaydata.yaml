                V1_0:            1.741       # absolute normalisation not measured; tuned so
#                             the generated width matches PDG
                rA:              -0.112      # A(0)/V1(0),  BESIII arXiv:2503.02196
                rV2:             -0.043      # V2(0)/V1(0), same fit (called r_V there)
                A_SHAPE:         2
                A_MPOLE:         2.5         # fixed in that fit
                V1_SHAPE:        2
                V1_MPOLE:        2.1         # fixed in that fit
                V2_SHAPE:        2
                V2_MPOLE:        2.1
                V0_SHAPE:        2           # SHAPE only - V0(0) from Eq.(V0constraint)
                V0_MPOLE:        2.317

      -10323,14,-13:
