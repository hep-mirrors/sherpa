                Fplus_NBLASCHKE: 1
                Fplus_mR0:       2.11220     # lowest 1^- c-qbar pole; auto-skipped if above t_+
                Fzero_SHAPE:     2           # 0^+ pole shape; f0(0)=f+(0) imposed by the current
                Fzero_MPOLE:     2.3170

