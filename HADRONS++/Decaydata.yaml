    ######################################################
    # Two pseudoscalars
    #
    # BR scheme (this and the Three pseudoscalars section below): every
    # 2PS channel here has BR: [0.0, 0.0] and every 3PS channel has
    # BR: [1/15, 1/15] = [0.06666667, 0.06666667] (15 = the number of
    # 3PS channels below), summing to 1 - NOT physical branching
    # ratios, this is for equal-statistics generation/testing across
    # all 3PS channels (including the ones flagged as producing
    # genuinely zero rate, e.g. KKK - those still get an equal BR
    # "slot", they just yield nothing when actually run). The two
    # purely-leptonic channels (16,-12,11 / 16,-14,13) are untouched
    # by this scheme (not pseudoscalar channels).
    #
    # FORM_FACTOR numbering (FormFactor_Base.H, ff_model enum):
    #   100 = KS         (Kuehn-Santamaria-style running-width BW sums)
    #   101 = GS         (Gounaris-Sakurai propagator variant of KS;
    #                      pi pi/K K only - falls back to 100 for
    #                      Kpi/Keta/Keta'/pi eta/pi eta')
    #   102 = KS_CLEO    (CLEO/TAUOLA-type Kpi/Keta/Keta' tune,
    #                      K*(892)+K*(1680); falls back to 100 for
    #                      pi pi/K K/pi eta/pi eta')
    #   200 = RChiPT     ("Level 1: bare RChiPT" for Kpi/Keta/Keta'
    #                      (Jamin-Pich-Portoles); 3-resonance chiral-
    #                      loop-unitarized form for pi pi/K K
    #                      (Guerrero-Pich-style))
    #   201 = RChL2012   (full Resonance Chiral Lagrangian currents,
    #                      pi pi/K K/Kpi only)
    #
    # Channels implemented: pi pi (pipi_plus), K Kbar (KK_plus, via
    # K_S/K_L), K pi (Kpi_plus, via K0/K_S/K_L and K^-pi^0), K eta
    # (Keta_plus), K eta' (Ketaprime_plus), pi eta (etapi_plus), pi
    # eta' (etaprimepi_plus, via EGSR16 second-class currents - KS
    # model only, no RChiPT/RChL2012 implementation exists for these
    # last two). K_S and K_L final states are recognised and carry an
    # additional 1/sqrt(2) projection factor relative to the bare K0
    # (m_isKSKL in FF_0_PP.C) - Gamma(K_S X)=Gamma(K_L X) is expected
    # and is a good cross-check once both are run.
    #
    # Residual mixing-weight parameters ("gamma"/"delta" resonance
    # mixing, i.e. the excited-resonance weight(s) on top of the
    # leading pole) can be overridden directly in this file, the same
    # way FORM_FACTOR/RUNNING_WIDTH already are - just add a matching
    # key inside the same J2 block. Every one is read as a
    # magnitude/phase[rad] pair and assembled into a genuine complex
    # number (mag*exp(i*phase)); omitting the "*Phase_*" key defaults
    # its phase to 0 (i.e. a plain real weight). Naming convention,
    # uniform across every channel and model:
    #   {gamma,delta}{Mag,Phase}_{channel}_{model}
    # where channel in {pipi, KK, Kpi, Keta, Ketaprime} and model in
    # {KS, GS, KSCLEO, RChiPT, RChL2012}. "gamma" is always the weight
    # of the first excited resonance (rho(1450) or K*(1410)/K*(1680)),
    # "delta" (where it exists) the second (rho(1700)) - Kpi/Keta/
    # Keta' channels only ever have one excited resonance, so no
    # "delta*" parameters exist for them. pi eta/pi eta' (KS only)
    # deliberately reuse the pipi_plus KS names (gammaMag_pipi_KS etc,
    # not their own) - EGSR16 states this is literally the SAME
    # normalized rho tower as pipi, not just a similar one.
    #
    # The illustrative overrides below reproduce the code's own
    # current defaults exactly (so adding them changes nothing
    # numerically) - edit the values, or delete the lines you don't
    # want to override.
    ######################################################

    ##### pi pi #####
      -211,111,16:
        BR: [0.0, 0.0] # [0.255, 0.255]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                # RChiPT pipi_plus (Guerrero-Pich-style, 3-resonance
                # chiral-loop-unitarized form) - defaults as fitted.
                # NOTE: this entry previously had FORM_FACTOR: 100
                # (KS) while still carrying these RChiPT-only
                # parameter names - since the KS branch reads
                # gammaMag_pipi_KS/deltaMag_pipi_KS instead, those
                # overrides were silently having no effect. Fixed back
                # to 200 here so the FORM_FACTOR and the parameters
                # actually match.
                gammaMag_pipi_RChiPT: -0.15
                gammaPhase_pipi_RChiPT: -0.36
                deltaMag_pipi_RChiPT: 0.12
                deltaPhase_pipi_RChiPT: -0.02
        PhaseSpace:
          - Dalitz_rho(770)+_12:
              Weight: 1.0
        IntResults: [5.372e-13, 2.151e-15, 5.134e-12]

    ##### K pi (three physical final states: K^-pi^0, K0bar pi^- via
    #####       K_S and K_L) #####
      -321,111,16:
