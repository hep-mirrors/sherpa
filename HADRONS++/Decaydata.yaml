                gammaMag_Kpi_KS: -0.135
                gammaPhase_Kpi_KS: 0.
        IntResults: [2.27265e-14, 2.27208e-17, 1.4063e-12]

    ##### K Kbar (two physical final states: K^- K_S, K^- K_L) #####
      -321,310,16:
        BR: [0.0, 0.0] # [0.0007, 0.0007]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                # K^- K_S: recognised as KK_plus (K_S/K_L now handled -
                # see the m_isKSKL fix). RChiPT KK_plus mixing:
                gammaMag_KK_RChiPT: -0.15
                gammaPhase_KK_RChiPT: -1.88
                deltaMag_KK_RChiPT: 0.
                deltaPhase_KK_RChiPT: 0.
        IntResults: [2.123e-15, 7.341e-18, 1.111e-14]

      -321,130,16:
        BR: [0.0, 0.0]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                # K^- K_L: recognised as KK_plus (K_S/K_L handled).
                # Deliberately given the SAME RChiPT model/parameters
                # as the K^- K_S entry above (rather than e.g. KS) so
                # the two can be directly compared as a Gamma(K_S X)=
                # Gamma(K_L X) consistency check.
                gammaMag_KK_RChiPT: -0.15
                gammaPhase_KK_RChiPT: -1.88
                deltaMag_KK_RChiPT: 0.
                deltaPhase_KK_RChiPT: 0.

    ##### K eta #####
      -321,221,16:
        BR: [0.0, 0.0]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # K^- eta: Keta_plus. No genuine original KS Keta
                # model exists (see the cross-check note) - this is a
                # KS-STYLE extension reusing the Kpi K*(892)+K*(1410)
                # tower, with its own beta_K* and an eta-eta' mixing
                # normalisation N_Keta (currently a placeholder = 1;
                # FIXME - supply the mixing angle you want used, e.g.
                # theta_P=-13.3+-0.5deg octet-singlet or
                # phi_P=41.4+-0.5deg quark-flavour, from the note's
                # Keta parameter table).
                gammaMag_Keta_KS: -0.135
                gammaPhase_Keta_KS: 0.
                N_Keta: 1.

    ##### K eta' #####
      -321,331,16:
        BR: [0.0, 0.0]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                # K^- eta': Ketaprime_plus. "Level 1: bare RChiPT"
                # (Jamin-Pich-Portoles): the note states the SAME
                # K*(892)+K*(1410) two-resonance vector current governs
                # Kpi, Keta AND Keta' (up to channel-specific
                # thresholds in the running widths, which stay
                # Kpi-dominated per the note - same p_GKst/p_GKstp as
                # the Kpi/Keta entries above, not separately rebuilt).
                # The "Combined 2014" fit quoted in the note is in fact
                # a JOINT Kpi-Keta fit, so these defaults are identical
                # to Kpi_plus's own RChiPT defaults - own parameter/
                # normalisation names per channel in case a dedicated
                # fit ever supersedes the joint one. This is the
                # smallest/least-established of these branching
                # fractions (PDG only quotes an upper limit, no
                # established spectrum - see the note's summary table).
                gammaMag_Ketaprime_RChiPT: -0.034
                gammaPhase_Ketaprime_RChiPT: 0.
                N_Ketaprime: 1.

    ##### pi eta #####
      -211,221,16:
        BR: [0.0, 0.0]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # pi^- eta: etapi_plus. EGSR16 (arXiv:1601.03989)
                # second-class current - normalized vector form factor
                # is IDENTICAL to pipi_plus's (same rho tower, deliberately
                # reusing its gammaMag_pipi_KS/deltaMag_pipi_KS names,
                # not separate ones), times the isospin-breaking mixing
                # eps_pieta below. Only ff_model::KS is implemented (no
                # RChiPT/RChL2012 for this channel) - other FORM_FACTOR
                # values fall back to this constant normalisation.
                eps_pieta: 0.017

    ##### pi eta' #####
      -211,331,16:
        BR: [0.0, 0.0]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # pi^- eta': etaprimepi_plus. Same EGSR16 second-class
                # current as pi^- eta above, smaller mixing factor.
                # Only ff_model::KS is implemented here either.
                eps_pietaprime: 0.004

    ######################################################
    # Three pseudoscalars
    #
    # FIXME/IMPORTANT: the three channels below were still using
    # FORM_FACTOR: 101, which meant "KS" under the OLD (pre-this-
    # session) numbering - but 101 is now GS under the renumbered
    # scheme, and FF_0_PPP_Base::operator() has NO case for GS at all
    # (that model only exists for the two-meson rho/K* towers). Left
    # as 101, these three channels would silently fall through to the
    # flat constant fallback instead of the KS 3pi physics they were
    # presumably meant to use - changed to 100 (the new KS number)
    # below to restore the original intent. FF_0_PPP.C has since had
    # the FF_0_PP.C-style refactor applied (merged Construct(),
    # diagnostic dumps, unified gamma/delta/alpha nomenclature reusing
    # the two-meson parameter names where the SAME resonance tower
    # appears again) plus the new CLEO 3pi/CLEO K1 Kpipi alternatives
    # (FORM_FACTOR=102) - see the per-channel comments below.
    #
    # Indices convention: for an N-daughter channel "H1,H2,...,HN,16",
    # momentum index 0 is always the tau itself, indices 1..N are the
    # daughters in the SAME order as listed in the channel key, and
    # index N+1 is always the neutrino (listed last). J2's own
    # "Indices: [...]" array does NOT need to mirror that listing
    # order - it just needs to route the right momentum index to
    # whatever slot FF_0_PPP_Base::FixMode() expects at m_pi[0]/[1]/[2]
    # for that channel's recognised mode (see FF_0_PPP.C's FixMode()
    # for the exact per-mode requirement); several entries below have
    # a permuted Indices array for exactly this reason, without needing
    # to change the channel key's own listing order at all.
    ######################################################

    ##### pi pi pi #####
      -211,111,111,16:
        BR: [0.0, 0.0] # [0.0917, 0.0917]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [4, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PPP
                Indices: [3, 2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
        PhaseSpace:
          - TwoResonances_a(1)(1260)+_2_rho(770)+_13:
              Weight: 0.25
          - TwoResonances_a(1)(1260)+_3_rho(770)+_12:
              Weight: 0.25
          - TwoResonances_a(1)(1260)+_2_rho(1450)+_13:
              Weight: 0.25
          - TwoResonances_a(1)(1260)+_3_rho(1450)+_12:
              Weight: 0.25
        AlwaysIntegrate: 1
        IntResults: [9.21791e-14, 3.5194e-17, 4.36085e-12]

      211,-211,-211,16:
        BR: [0.0, 0.0] # [0.0932, 0.0932]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [4, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PPP
                # FIX: pi^+(idx1) pi^-(idx2) pi^-(idx3) - KS90/FM95's
                # own convention needs q1,q2 to be the TWO IDENTICAL
                # bosons (both pi^-) and q3 the odd one out (pi^+),
                # exactly like the pi0 pi0 pi^- entry above. This
                # previously used Indices:[1,2,3] (direct order),
                # putting the ODD pion (pi^+) at m_pi[0] instead of
                # m_pi[2] - since F1/F2 use s13/reconstructed-s1 to
                # evaluate the rho propagator on whichever pair is
                # OPPOSITE-SIGN (resonant), swapping which pion is
                # "odd" silently evaluates the rho propagator on the
                # wrong (same-sign, never-resonant) pair instead -
                # this is exactly why the rho(770) peak was missing
                # from the pi- pi+ mass distribution. Fixed: pi^-(idx2)
                # and pi^-(idx3) now go to m_pi[0]/m_pi[1], pi^+(idx1)
                # to m_pi[2].
                Indices: [2, 3, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
        # FIX: this channel was missing the resonance-aware PhaseSpace
        # block that its pi0 pi0 pi^- sibling above already has. The
        # raw index layout is structurally identical here (odd particle
        # pi^+ at raw index 1, the two identical pi^-'s at raw indices
        # 2,3 - same pattern as pi^-(1)/pi^0(2)/pi^0(3) above), so the
        # SAME two importance-sampling channels apply verbatim (they
        # reference raw momentum indices, not particle species):
        # spectator=2/rho from(1,3), and spectator=3/rho from(1,2),
        # covering both Bose-symmetric pi^+pi^- pairings with equal
        # weight. Without this, the default/naive phase-space sampling
        # doesn't efficiently populate the narrow rho(770) region of
        # the Dalitz plot - the underlying amplitude has a genuine,
        # confirmed resonance there (see the per-event diagnostic
        # trace), but a finite MC sample built without this importance
        # sampling will under-populate that corner of phase space,
        # making the peak look statistically weak/diluted rather than
        # absent - likely the actual explanation for "the peak is
        # barely visible" even though the physics itself is correct.
        # Also adding the rho(1450) alternative alongside rho(770) for
        # each chain, per the general "distribute evenly over each
        # combination" principle - the amplitude genuinely has both
        # (gammaMag_3pi_KS=-0.145 weight on rho(1450)), so both are
        # worth importance-sampling. 2 chains x 2 inner resonances = 4
        # combinations, each weight 0.25 (the tiny rho-omega mixing
        # term, alphaMag_3pi_KS=0.00185, is left out - negligible).
        PhaseSpace:
          - TwoResonances_a(1)(1260)+_2_rho(770)+_13:
              Weight: 0.25
          - TwoResonances_a(1)(1260)+_3_rho(770)+_12:
              Weight: 0.25
          - TwoResonances_a(1)(1260)+_2_rho(1450)+_13:
              Weight: 0.25
          - TwoResonances_a(1)(1260)+_3_rho(1450)+_12:
              Weight: 0.25
        AlwaysIntegrate: 1
        IntResults: [9.02993e-14, 9.02826e-17, 1.79599e-11]

      -321,111,111,16:
        BR: [0.0, 0.0] # [0.00058, 0.00058]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [4, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PPP
                # pi0(idx2) pi0(idx3) K^-(idx1): FixMode's pi0_pi0_KM
                # wants (pi0,pi0,K) at m_pi[0..2] - K^- listed FIRST in
                # the channel key here, so the Indices array is
                # permuted (not the key itself) to route it last.
                Indices: [2, 3, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # pi0_pi0_KM: only ff_model::KS is implemented (FM95
                # Tab.I/II row 6, T_K1^(a)/T_K*^(1) - see
                # F1_0_PiPlusPiZeroPiZero::Construct_Pi0Pi0K()).
        # Now that TwoResonances is confirmed available, replacing the
        # earlier Dalitz-only fallback with the proper two-resonance
        # cascade: outer = K1(1400)[weight 1] + K1(1270)[weight
