    #         rebuilt). The "Combined 2014" fit quoted in the note is
    #         in fact a joint Kpi-Keta fit, so these defaults are
    #         identical to Kpi_plus's own RChiPT defaults - own
    #         parameter/normalisation names per channel in case a
    #         dedicated fit ever supersedes the joint one.
    #         gammaMag_Ketaprime_200/gammaPhase_Ketaprime_200.
    # No KS/KS_CLEO model exists for this channel in the source.
    # Reference: cross-check note's Keta'/Ketap-vector-relation
    # section.
    ######################################################
        IntResults: [5.3026e-16, 5.2983e-19, 5.464e-15]
      -321,331,16:
        BR: [0.0, 0.0]
        ME:
