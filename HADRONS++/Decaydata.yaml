                FORM_FACTOR: 100
                gammaMag_Kpi_100: -0.135
                gammaPhase_Kpi_100: 0.
        IntResults: [1.032e-14, 1.0318e-17, 8.5431e-13]

    ##### K Kbar (two physical final states: K^- K_S, K^- K_L) #####
    #
    # tau- -> nu_tau K- K_S and tau- -> nu_tau K- K_L (KK_plus via
    # K_S/K_L - both now handled, see the m_isKSKL fix). Deliberately
    # given the SAME FORM_FACTOR/parameters in both entries below (both
    # RChiPT/200) so the two can be directly compared as a Gamma(K_S X)
    # =Gamma(K_L X) consistency check.
    #
    # Available FORM_FACTOR options:
    #   100 = KS: gammaMag_KK_100/gammaPhase_KK_100 (rho(1450) weight),
    #         deltaMag_KK_100/deltaPhase_KK_100 (rho(1700) weight).
    #   101 = GS: Gounaris-Sakurai variant of the KS tower.
    #   200 = RChiPT: gammaMag_KK_200/gammaPhase_KK_200,
    #         deltaMag_KK_200/deltaPhase_KK_200 (mixing angle not
    #         independently verified against the original fit source -
    #         see FF_0_PP.C).
    #   201 = RChL2012.
    # Reference: FM95 (hep-ph/9503474) for KS/GS.
    ######################################################
      -321,310,16:
        BR: [0.0, 0.0] # [0.0007, 0.0007]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                gammaMag_KK_200: -0.15
                gammaPhase_KK_200: -1.88
                deltaMag_KK_200: 0.
                deltaPhase_KK_200: 0.
        IntResults: [1.2657e-15, 1.2628e-18, 1.2172e-14]

      -321,130,16:
        BR: [0.0, 0.0]
        ME:
