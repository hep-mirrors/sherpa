    #
    # Available FORM_FACTOR options:
    #   100 = KS only (no RChiPT/RChL2012 implementation exists for
    #         this channel) - other FORM_FACTOR values fall back to a
    #         flat constant normalisation. eps_pieta (isospin-breaking
    #         mixing weight) is this channel's own parameter, not
    #         shared with anything else.
    # Reference: EGSR16, arXiv:1601.03989.
    ######################################################
        IntResults: [2.7917e-17, 2.7832e-20, 2.0969e-16]
