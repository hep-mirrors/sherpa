                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                gammaMag_KK_200: -0.15
                gammaPhase_KK_200: -1.88
                deltaMag_KK_200: 0.
                deltaPhase_KK_200: 0.

    ##### K eta #####
    #
    # tau- -> nu_tau K- eta (Keta_plus). No genuine original KS Keta
    # model exists in the source literature (see the cross-check note)
    # - the KS entry here is a KS-STYLE EXTENSION reusing the Kpi
    # K*(892)+K*(1410) tower, with its own beta_K* and an eta-eta'
    # mixing normalisation N_Keta (currently a placeholder = 1 - FIXME:
    # supply the mixing angle you want used, e.g. theta_P=-13.3+-0.5deg
    # octet-singlet or phi_P=41.4+-0.5deg quark-flavour, from the
    # note's Keta parameter table).
    #
    # Available FORM_FACTOR options:
    #   100 = KS-style extension: gammaMag_Keta_100/gammaPhase_Keta_100.
    #   102 = KS_CLEO: CLEO/TAUOLA-type tune, K*(892)-0.038*K*(1680).
    #         gammaMag_Keta_102/gammaPhase_Keta_102.
    #   200 = RChiPT ("Level 1: bare RChiPT"): the SAME K*(892)+
    #         K*(1410) two-resonance form as Kpi governs Keta too (up
    #         to channel-specific running-width thresholds, which stay
    #         Kpi-dominated per the note - shares MKst/MKstp with the
    #         Kpi RChiPT entry above). gammaMag_Keta_200/
    #         gammaPhase_Keta_200.
    # Reference: cross-check note's Keta section (joint Kpi-Keta
    # "Combined 2014" fit for RChiPT).
    ######################################################
        IntResults: [1.2678e-15, 1.2657e-18, 1.2176e-14]
      -321,221,16:
        BR: [0.0, 0.0]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
