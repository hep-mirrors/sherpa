  Channels:

  ######################################################################
  # Reduced decay table: SEMILEPTONIC D^0 / D^+ / D_s^+ DECAYS ONLY.
  #
  # Generated from the full Decaydata.yaml by keeping exactly those
  # channels for which a hadronic current now exists in
  # METOOLS/HadronCurrents (VA_P_P, VA_P_S, VA_P_V, VA_P_A, VA_P_T)
  # and dropping everything else - all hadronic D decays, all other
  # hadron species except the daughters needed to terminate the chain.
  # BRANCHING RATIOS: the PDG values of the original file, RESCALED
  # by one common factor per D species so that the semileptonic
  # channels listed here sum to exactly 1.0 within each block. No
  # other channels remain in these three blocks, so nothing needed
  # setting to zero. The rescaling factors applied were
  #     D^0  : sum of PDG BRs = 0.122589 -> x 8.1574
  #     D^+  : sum of PDG BRs = 0.310590 -> x 3.2197
  #     D_s^+: sum of PDG BRs = 0.181000 -> x 5.5249
  # The quoted second entry (the error) is scaled by the same factor,
  # so every relative uncertainty is preserved. RELATIVE rates between
  # the semileptonic modes are therefore untouched and still the
  # measured ones - only the overall D normalisation has changed, so
  # that a D generated with this table decays semileptonically with
  # probability one and every implemented mode gets usable statistics.
  # To recover physical absolute rates, multiply back by the sums
  # above (i.e. by the total semileptonic branching fraction).
  #
  # The four non-resonant four-body modes of the original file
  # (D -> K pi l nu with no ME) are dropped: their resonant parts are
  # covered by the K*(892), K*_0(1430) and K*_2(1430) entries here.
  # Purely leptonic D+ -> mu nu / D_s+ -> mu nu are dropped as well.
  #
  ######################################################################
  # CURRENT ASSIGNMENT - note two corrections w.r.t. the original file
  ######################################################################
  # The original table routed
  #     K*_0(1430)  (10311/10321)  through VA_P_P   and
  #     K_1(1270)   (10313/10323)  through VA_P_V,
  # i.e. through currents built for the wrong J^P. A 0^+ state has
  # V^mu=0 in this convention and a 1^+ state has the vector and axial
  # roles interchanged relative to a 1^-, so neither was merely a
  # different parametrization of the right thing. They are moved to
  # VA_P_S and VA_P_A here.
  #
  ######################################################################
  # FORM-FACTOR SHAPE NUMBERING (ffq2_shape in FF_P_X.H)
  ######################################################################
  #    0 constant        1 taylor         2 simple_pole
  #    3 modified_pole   4 BK_plus        5 BK_zero
  #    6 BZ              7 rational       8 exponential
  #    9 multipole      10 ISGW2         11 BGL
  #   12 charm_series   13 BCL_plus      14 BCL_zero      15 SSE
  # Every invariant form factor of a channel selects its own shape via
  # <name>_SHAPE and carries its own <name>_* parameters, so there is
  # no way for two form factors to collide on one key.
  #
  ######################################################################
  # NORMALISATION CONVENTIONS
  ######################################################################
  # * Vcq is the CKM factor of Eq. M = (G_F/sqrt2) V_cq H.L. The values
  #   quoted below for F(0) are the CKM-UNDRESSED ones from the note's
  #   experimental tables, so V_cq must be applied here and is. If you
  #   ever substitute a CKM-dressed \hat f = |V_cq| f instead, set
  #   CKM_DRESSED: 1 and V_cq is then not applied twice.
  # * ISOSPIN: D+ -> pi^0 / rho^0 / omega need an explicit 1/sqrt(2)
  #   relative to the corresponding charged modes, because the quoted
  #   f_+^{pi^0}(0)=0.622 and the rho^0/omega r_V, r_2 are defined with
  #   that factor already divided out (which is why 0.622 agrees with
  #   the D^0 -> pi^- value 0.637 rather than being smaller by sqrt2).
  #   Leaving it out overestimates those three rates by a factor 2.
  # * K_S / K_L final states pick up a further 1/sqrt(2) automatically
  #   inside the current (same m_isKSKL logic as FF_0_PP.C); none of
  #   the channels below use them directly, D+ -> K0bar and Ds -> K0
  #   being written with the flavour eigenstate as in the original.
  # * A_0(0), V_0(0), A_0^T(0) are NEVER read from this file. They are
  #   recomputed event by event from Eq.(A0constraint)/(V0constraint)
  #   with the GENERATED sqrt(s_X), which is what keeps the 1/q^2
  #   structures exactly regular when the resonance mass runs. Only
  #   their q^2 SHAPE is configured here.
  #
  ######################################################################
  # BLASCHKE FACTORS
  ######################################################################
  # Fplus_mR0 is always set to the lowest 1^- c-qbar state (D_s*(2112)
  # for c->s, D*(2010) for c->d). FF_P_X drops it automatically when it
  # is NOT subthreshold, m_R^2 >= t_+ = (M+m)^2 - the note's own
  # criterion. That reproduces both prescriptions it states explicitly
  # (kept for D->K, dropped for D->pi) and extends them consistently:
  # for D_s -> K^0 the D* IS subthreshold, and keeping it brings the
  # charm-series endpoint value from 1.19 to 1.97, against 2.03 from
  # the same analysis' own modified-pole fit. Do not hand-disable it.
  #
  ######################################################################
  # WHAT IS NOT PINNED DOWN BY DATA
  ######################################################################
  # Flagged inline below, but in summary:
  #   - f_0(q^2) shape for every D->P mode. The fits determine f_+ only.
  #     A 0^+ pole is used here and the normalisation f0(0)=f+(0) is
  #     imposed by the current. This matters only for the muon modes.
  #   - A_1(0) for D->rho and D+->Kbar*0 (only r_V, r_2 are published).
  #     Harmless: the channel rate is set by the BR, so only the ratios
  #     and the shapes affect anything observable.
  #   - The whole D -> K*_0(1430) weak current: no measurement exists.
  #   - D -> K*_2(1430): rVT = r2T = 1 are BESIII model assumptions.
  #   - The absolute V_1(0) of D -> K_1(1270).
  #
  ######################################################################
  # THE TAU NEEDS A DECAY BLOCK
  ######################################################################
  # D_s+ -> tau+ nu is 5.39e-2, which after renormalisation is 30
  # percent of the D_s block - the largest single entry in it. There is
  # NO tau block in this file, so the tau will be left stable unless
  # one is supplied. Merge the 15 block from the tau Decaydata table
  # before generating, or that 30 percent produces a stable lepton.
  # D+ -> tau+ nu (9.9e-4) has the same issue at a smaller rate.
  #
  ######################################################################
  # WHY D_s -> phi IS STILL QUASI-TWO-BODY
  ######################################################################
  # The K Kbar final state would be the natural VA_P_PP partner of the
  # pi pi one - c -> s leaves (s sbar), so K Kbar is I=0 and
  # |0,0> = (K+K- + K0 K0bar)/sqrt2 gives the two charge modes equal
  # amplitudes. It is NOT done, for one concrete reason: phi -> K Kbar
  # is only 83 percent (K+K- 49.1, K0S K0L 34), the rest being rho pi
  # and eta gamma. Folding the phi into a two-body K Kbar current would
  # silently discard that 17 percent, which is a larger error than the
  # phi/f_0(980) interference it would buy - and that interference is
  # in any case only an upper limit, B(f_0(980) -> K+ K-) < 5.45e-4
  # against phi -> K+K- at 1.15e-2.
  # The same test is why omega and K_1(1270) stay quasi-two-body:
  # convert a resonance only when it decays essentially entirely into
  # the two-body channel being modelled. rho -> pi pi and
  # K*(892) -> K pi pass at ~100 percent; phi does not.
  #
  ######################################################################
  # NAMING: <in>_<out>
  ######################################################################
  # VA_0_PP is "nothing in, two pseudoscalars out"; VA_P_V is
  # "pseudoscalar in, vector out". The lepton pair of a semileptonic
  # decay has BOTH legs outgoing, so it is a 0 -> F Fbar current and is
  # tagged VA_0_FF here, not VA_F_F. VA_F_F remains a first-class tag
  # for the genuine F -> F case (tau -> nu_tau, b -> c), where one leg
  # is the decaying particle; it is the same class, and the topology is
  # now checked against the tag rather than assumed.
  #
  ######################################################################
  # THE LEGACY HADRONS++ Current_Library IS RETIRED
  ######################################################################
  # The tags below (VA_F_F, VA_P_P, VA_P_S, VA_P_V, VA_P_A, VA_P_T) are
  # now served exclusively by METOOLS/HadronCurrents. The old
  # HADRONS++/Current_Library defined VA_P_P, VA_P_V and VA_P_T under
  # the SAME names AND registered into the SAME getter,
  #   Getter<METOOLS::Current_Base, METOOLS::ME_Parameters>,
  # so the two could never coexist: the table resolved to whichever
  # registered first, every per-form-factor key in this file missed,
  # and the legacy current fell back to its ISGW default without
  # raising an error - the only symptom being
  #     "Initializing ISGW form factor for D --> K+b. The parameters
  #      have no defaults set for these ..."
  # in the log and a D -> K spectrum skewed towards low q^2.
  #
  # With the old directory commented out of the build there is exactly
  # one getter per tag and the failure mode is gone. If that directory
  # is ever re-enabled, both the DEFINE_CURRENT_GETTER lines in
  # VA_P_*.C and the Type: entries here must be suffixed again -
  # they are silent, not fatal, when they collide.
  ######################################################################

    421:
    #
    # =====================================================
    #  D^0 -> K^- l^+ nu   (VA_P_P, J^P = 0^-)
    #  f+(0)=0.7383, r1=-2.28 from the BESIII simultaneous
    #  four-mode fit, arXiv:2601.21196. CKM-undressed values.
    # =====================================================
