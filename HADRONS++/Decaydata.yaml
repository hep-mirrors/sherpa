                FORM_FACTOR: 100
                # pi^- K_L: Kpi_plus, KS (FM95) tune. Gamma(K_S pi^-)
                # should equal Gamma(K_L pi^-) - compare against the
                # 310,-211,16 entry above once both are run (that one
