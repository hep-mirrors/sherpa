    ######################################################
    # Three pseudoscalars
    #
    # Indices convention: for an N-daughter channel "H1,H2,...,HN,16",
    # momentum index 0 is always the tau itself, indices 1..N are the
    # daughters in the SAME order as listed in the channel key, and
    # index N+1 is always the neutrino (listed last). J2's own
    # "Indices: [...]" array does NOT need to mirror that listing
    # order - it just needs to route the right momentum index to
    # whatever slot FF_0_PPP_Base::FixMode() expects at m_pi[0]/[1]/[2]
    # for that channel's recognised mode; several entries below have a
    # permuted Indices array for exactly this reason, without needing
    # to change the channel key's own listing order at all.
    #
    # PhaseSpace note: every TwoResonances_... block below reflects
    # what the actual amplitude in that channel contains - see each
    # channel's own comment for the resonance-region breakdown. All
    # weights sum to 1 within each channel.
    ######################################################

    ##### pi pi pi #####
    #
    # tau- -> nu_tau pi- pi0 pi0 (a1 -> rho pi cascade)
    #
    # Available FORM_FACTOR options:
    #   100 = KS (KS90): a1(1260) -> rho(770)+gammaMag_pipi3*rho(1450).
