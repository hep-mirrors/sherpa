    ######################################################
    # Two pseudoscalars
    #
    # BR scheme (this and the Three pseudoscalars section below): every
    # 2PS channel here has BR: [0.0, 0.0] and every 3PS channel has
    # BR: [1/15, 1/15] = [0.06666667, 0.06666667] (15 = the number of
    # 3PS channels below), summing to 1 - NOT physical branching
    # ratios, this is for equal-statistics generation/testing across
    # all 3PS channels (including the ones flagged as producing
    # genuinely zero rate, e.g. KKK - those still get an equal BR
    # "slot", they just yield nothing when actually run). The two
    # purely-leptonic channels above are untouched by this scheme (not
    # pseudoscalar channels).
    #
    # FORM_FACTOR numbering (FormFactor_Base.H, ff_model enum), used
    # throughout this whole file, all sections:
    #   100 = KS         (Kuehn-Santamaria-style running-width BW sums)
    #   101 = GS         (Gounaris-Sakurai propagator variant of KS)
    #   102 = KS_CLEO    (CLEO/TAUOLA-type tune)
    #   103 = KS_f0      (KS-family + an added f0(500)/sigma admixture)
    #   104 = CLEO_f0    (CLEO-family + the same f0(500)/sigma addition)
    #   200 = RChiPT     (bare/chiral-loop-unitarized RChiPT form)
    #   201 = RChL2012   (full Resonance Chiral Lagrangian currents)
    # Each channel below only ever implements a SUBSET of these - see
    # the "Available FORM_FACTOR options" list in each channel's own
    # comment block for exactly which apply there and why.
    #
    # Parameter naming (reworked this session to remove the earlier
    # _KS/_RChiPT/_KSCLEO suffix scheme, which had become ambiguous/
    # unsafe in two distinct ways - see the git history / conversation
    # log for the full diagnosis):
    #   - Where a "gamma"/"delta" mixing weight is genuinely SHARED,
    #     unchanged, across every model that uses it (e.g. the K*(892)+
    #     K*(1410) admixture appearing identically in several 3-body
    #     channels), the name now carries NO model suffix at all -
    #     e.g. gammaMag_KpiK_vector, gammaMag_3pi. Safe: there is only
    #     ever one value, regardless of which FORM_FACTOR reads it.
    #   - Where a channel has genuinely DIFFERENT, independently-fitted
    #     values per model (e.g. Keta's own KS/KS_CLEO/RChiPT tunes are
    #     three distinct numbers, not one shared value), the name now
    #     ends in the exact numeric FORM_FACTOR it belongs to - e.g.
    #     gammaMag_Keta_100/_102/_200. This ties the parameter directly
    #     and unambiguously to the "FORM_FACTOR: <N>" line in the same
    #     block, rather than to a model-family label (KS/CLEO/...) that
    #     could drift out of sync as more variants get added.
    #   - A genuine BUG was found and fixed in the process:
    #     gammaMag_pipi_KS/gammaMag_Kpi_KS had been silently shared as
    #     the SAME override key between the unrelated 2-body pipi_plus/
    #     Kpi_plus channels (this section) and the 3-body Kpipi/3pi/
    #     EtaPiPi resonance-tower reuse (Three pseudoscalars section
    #     below) - for pipi specifically, with two DIFFERENT intended
    #     defaults (-0.167 vs -0.145) silently colliding under one
    #     name. Split into "pipi2"/"Kpi" (2-body) vs "pipi3" (3-body
    #     family) - see each section's own parameter list.
    #
    # Every parameter is read as a magnitude/phase[rad] pair and
    # assembled into a genuine complex number (mag*exp(i*phase));
    # omitting the "*Phase_*" key defaults its phase to 0 (a plain real
    # weight). The illustrative overrides below reproduce the code's
    # own current defaults exactly (so adding them changes nothing
    # numerically) - edit the values, or delete the lines you don't
    # want to override.
    ######################################################

    ##### pi pi #####
    #
    # tau- -> nu_tau pi- pi0 (pipi_plus)
    #
    # Available FORM_FACTOR options:
    #   100 = KS: gammaMag_pipi2_100/gammaPhase_pipi2_100 (rho(1450)
    #         weight), deltaMag_pipi2_100/deltaPhase_pipi2_100
    #         (rho(1700) weight). Also used, by design, by the pi eta/
    #         pi eta' entries further below (EGSR16: literally the same
    #         normalized rho tower, not just a similar one).
    #   101 = GS: Gounaris-Sakurai propagator variant of the same tower
    #         (no separate named parameters - shares the KS ones above).
    #   200 = RChiPT: Guerrero-Pich-style 3-resonance chiral-loop-
    #         unitarized form. gammaMag_pipi2_200/gammaPhase_pipi2_200,
    #         deltaMag_pipi2_200/deltaPhase_pipi2_200.
    #   201 = RChL2012: full Resonance Chiral Lagrangian current.
    # Reference: FM95 (hep-ph/9503474) for KS/GS; Guerrero-Pich for
    # RChiPT; RChL2012 as cited in FF_0_PP.C.
    ######################################################
      -211,111,16:
        BR: [0.0, 0.0] # [0.255, 0.255]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                gammaMag_pipi2_200: -0.15
                gammaPhase_pipi2_200: -0.36
                deltaMag_pipi2_200: 0.12
                deltaPhase_pipi2_200: -0.02
        PhaseSpace:
          - Dalitz_rho(770)+_12:
              Weight: 1.0
        IntResults: [5.7692e-13, 5.7494e-16, 5.8128e-12]

    ##### K pi (three physical final states: K^-pi^0, K0bar pi^- via
    #####       K_S and K_L) #####
    #
    # tau- -> nu_tau K- pi0 (Kpi_plus)
    #
    # Available FORM_FACTOR options:
    #   100 = KS (FM95): gammaMag_Kpi_100/gammaPhase_Kpi_100 (K*(1410)
    #         weight) - this value is genuinely, deliberately SHARED
    #         with every 3-body channel below that reuses the same
    #         K*(892)+K*(1410) tower (same name, no "2"/"3" split
    #         needed here, unlike pipi/Kpi's own accidental collision
    #         fixed above - the K* admixture really is the same number
    #         everywhere it appears).
    #   102 = KS_CLEO: CLEO/TAUOLA tune, K*(892)+K*(1680).
    #         gammaMag_Kpi_102/gammaPhase_Kpi_102 (2-body only).
    #   200 = RChiPT ("Level 1: bare RChiPT", Jamin-Pich-Portoles):
    #         gammaMag_Kpi_200/gammaPhase_Kpi_200 (2-body only). Masses
    #         default to the particle database unless overridden via
    #         MKst/MKstp (also shared with Keta/Ketaprime's own RChiPT
    #         branches by design - the note's "Combined 2014" fit is a
    #         joint Kpi-Keta fit).
    # K_S and K_L final states are recognised and carry an additional
    # 1/sqrt(2) projection factor relative to the bare K0 (m_isKSKL in
    # FF_0_PP.C) - Gamma(K_S X)=Gamma(K_L X) is expected and is a good
    # cross-check once both are run (see the K_S/K_L pair below, which
    # deliberately share the same FORM_FACTOR/parameters for exactly
    # this comparison).
    # Reference: FM95 (hep-ph/9503474) for KS/KS_CLEO; Jamin-Pich-
    # Portoles for RChiPT.
    ######################################################
      -321,111,16:
        BR: [0.0, 0.0] # [0.0045, 0.0045]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                gammaMag_Kpi_100: -0.135
                gammaPhase_Kpi_100: 0.
        IntResults: [1.0953e-14, 1.0953e-17, 9.2621e-13]

    #
    # tau- -> nu_tau K_S pi- (Kpi_plus via K_S) - see the K pi note above.
    #
    # tau- -> nu_tau K_S pi- and tau- -> nu_tau pi- K_L are the two CP
    # projections of the SINGLE decay tau- -> nu_tau K0bar pi-, each
    # exactly half of it, so they MUST carry the same model and the same
    # parameters and must predict the same width.
    #
    # They previously did not: this entry ran RChiPT/200 while the K_L
    # entry below ran KS/100, deliberately, to get a two-model
    # cross-check for free.  That does not belong here - this file
    # generates events, and the mismatch put a 41% asymmetry
    # (7.34e-15 vs 1.03e-14) between two halves of one decay into every
    # sample, which is not physics.  Both now run 100.  Comparing two
    # models on one channel is a job for a run card overriding
    # FORM_FACTOR, which leaves this file consistent.
    #
    # Why 100 and not 200: against PDG (0.42%, = half of K0 pi-),
    # 100 gives 1.084 x and 200 gives 0.771 x.  200 wins the shape
    # marginally (chi2/ndf 5.00 vs 5.76 at 150k) but 100 is the one
    # inside the 20% rate target, and it matches the K^- pi^0 and
    # pi- K_L entries so the whole Kpi family is now consistent.
    #
      310,-211,16:
        BR: [0.0, 0.0] # [0.0042, 0.0042]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                gammaMag_Kpi_100: -0.135
                gammaPhase_Kpi_100: 0.
        IntResults: [1.03186e-14, 1.03182e-17, 8.54277e-13]

    #
    # tau- -> nu_tau pi- K_L (Kpi_plus via K_L) - FORM_FACTOR 100
    # (KS/FM95), matching the K_S pi- entry above and the K^- pi^0 entry
    # (same model, same gammaMag_Kpi_100).  Gamma(K_S pi^-) and
    # Gamma(K_L pi^-) now agree to 0.07%, as they must - see the note on
    # the K_S entry above for why they were previously allowed to differ.
    #
      -211,130,16:
        BR: [0.0, 0.0] # [0.0042, 0.0042]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
