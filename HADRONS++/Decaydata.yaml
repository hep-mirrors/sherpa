    ##### pi eta #####
    #
    # tau- -> nu_tau pi- eta (etapi_plus). EGSR16 (arXiv:1601.03989)
    # second-class current - normalized vector form factor is
    # IDENTICAL to pipi_plus's own (same rho tower, deliberately
    # reusing its gammaMag_pipi2_100/deltaMag_pipi2_100 names, not
