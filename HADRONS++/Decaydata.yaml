                gammaPhase_Keta_100: 0.
                N_Keta: 1.

    ##### K eta' #####
    #
    # tau- -> nu_tau K- eta' (Ketaprime_plus). This is the smallest/
    # least-established of the two-pseudoscalar branching fractions
    # (PDG only quotes an upper limit, no established spectrum - see
    # the note's summary table).
    #
    # Available FORM_FACTOR options:
    #   200 = RChiPT ("Level 1: bare RChiPT"): the note states the same
    #         K*(892)+K*(1410) two-resonance vector current governs
    #         Kpi, Keta AND Keta' (shares p_GKst/p_GKstp, MKst/MKstp
