                FORM_FACTOR: 200
                # K^- K_L: recognised as KK_plus (K_S/K_L handled).
                # Deliberately given the SAME RChiPT model/parameters
                # as the K^- K_S entry above (rather than e.g. KS) so
                # the two can be directly compared as a Gamma(K_S X)=
                # Gamma(K_L X) consistency check.
                gammaMag_KK_RChiPT: -0.15
                gammaPhase_KK_RChiPT: -1.88
                deltaMag_KK_RChiPT: 0.
                deltaPhase_KK_RChiPT: 0.

    ##### K eta #####
      -321,221,16:
        BR: [0.0, 0.]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # K^- eta: Keta_plus. No genuine original KS Keta
                # model exists (see the cross-check note) - this is a
                # KS-STYLE extension reusing the Kpi K*(892)+K*(1410)
                # tower, with its own beta_K* and an eta-eta' mixing
                # normalisation N_Keta (currently a placeholder = 1;
                # FIXME - supply the mixing angle you want used, e.g.
                # theta_P=-13.3+-0.5deg octet-singlet or
                # phi_P=41.4+-0.5deg quark-flavour, from the note's
                # Keta parameter table).
                gammaMag_Keta_KS: -0.135
                gammaPhase_Keta_KS: 0.
                N_Keta: 1.

    ##### K eta' #####
      -321,331,16:
        BR: [0.0, 0.]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                # K^- eta': Ketaprime_plus. "Level 1: bare RChiPT"
                # (Jamin-Pich-Portoles): the note states the SAME
                # K*(892)+K*(1410) two-resonance vector current governs
                # Kpi, Keta AND Keta' (up to channel-specific
                # thresholds in the running widths, which stay
                # Kpi-dominated per the note - same p_GKst/p_GKstp as
                # the Kpi/Keta entries above, not separately rebuilt).
                # The "Combined 2014" fit quoted in the note is in fact
                # a JOINT Kpi-Keta fit, so these defaults are identical
                # to Kpi_plus's own RChiPT defaults - own parameter/
                # normalisation names per channel in case a dedicated
                # fit ever supersedes the joint one. This is the
                # smallest/least-established of these branching
                # fractions (PDG only quotes an upper limit, no
                # established spectrum - see the note's summary table).
                gammaMag_Ketaprime_RChiPT: -0.034
                gammaPhase_Ketaprime_RChiPT: 0.
                N_Ketaprime: 1.

    ##### pi eta #####
      -211,221,16:
        BR: [0.0, 0.]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # pi^- eta: etapi_plus. EGSR16 (arXiv:1601.03989)
                # second-class current - normalized vector form factor
                # is IDENTICAL to pipi_plus's (same rho tower, deliberately
                # reusing its gammaMag_pipi_KS/deltaMag_pipi_KS names,
                # not separate ones), times the isospin-breaking mixing
                # eps_pieta below. Only ff_model::KS is implemented (no
                # RChiPT/RChL2012 for this channel) - other FORM_FACTOR
                # values fall back to this constant normalisation.
                eps_pieta: 0.017

    ##### pi eta' #####
      -211,331,16:
        BR: [0.0, 0.]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # pi^- eta': etaprimepi_plus. Same EGSR16 second-class
                # current as pi^- eta above, smaller mixing factor.
                # Only ff_model::KS is implemented here either.
                eps_pietaprime: 0.004

    ######################################################
