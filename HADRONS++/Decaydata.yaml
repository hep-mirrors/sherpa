                Fzero_MPOLE:     2.3170

    #
    # =====================================================
    #  COHERENT K pi FINAL STATE   (VA_P_PP)
    #  S + P waves summed at the AMPLITUDE level. This single
    #  channel REPLACES the former quasi-two-body entries for
    #  K*(892), K*_0(1430) and K*_2(1430), all of which have
    #  been removed - keeping any would double count.
    #  The BR is the MEASURED two-body total, not a sum of
    #  components. That is the point: the PDG components
    #  overshoot the D0 -> K0bar pi- total by 5.4 percent,
    #  precisely because they are fitted coherently and would
    #  be added here incoherently.
    #
    #  CALIBRATION REQUIRED. AMP_S and PHASE_S set the S-wave
    #  strength and the S-P interference. They cannot be fixed
    #  from first principles here, because the two waves carry
    #  independent normalisations. Tune AMP_S until the
    #  generated S-wave fraction matches PDG2026:
    #    D+ -> K- pi+    : 2.28e-3 / 4.00e-2  = 5.7 percent
    #    D+ -> K0bar pi0 : 1.21e-3 / 1.89e-2  = 6.4 percent
    #    D0 -> K0bar pi- : 8.5e-4  / 1.447e-2 = 5.9 percent
    #    D0 -> K- pi0    : 4.09e-4 / 7.10e-3  = 5.8 percent
    #  Isospin makes these equal within errors, so ONE AMP_S
    #  should serve all four. Until it is calibrated the m_Kpi
    #  shape is right but the wave ratio is arbitrary.
    #
    #  D wave is OFF: PDG2026 gives only an upper limit,
    #  B(K*_2(1430)) x B(K- pi+) < 5e-4, under 1.3 percent of
    #  the total. Parameters are present; set USE_D: 1.
    # =====================================================
