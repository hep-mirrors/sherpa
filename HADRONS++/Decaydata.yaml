              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # K^- pi^0: Kpi_plus, KS (FM95) tune:
                gammaMag_Kpi_KS: -0.135
                gammaPhase_Kpi_KS: 0.
        IntResults: [1.13272e-14, 1.13236e-17, 7.01494e-13]

      310,-211,16:
        BR: [0.25, 0.] # [0.0042, 0.0042]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [2, 1]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 200
                # K_S pi^-: recognised as Kpi_plus (K_S/K_L handled).
                # "Level 1: bare RChiPT" (Jamin-Pich-Portoles) two-
                # resonance form - real gamma by default (phase 0),
                # masses default to the particle database unless
                # overridden here (see MKst_RChiPT/MKstp_RChiPT):
                gammaMag_Kpi_RChiPT: -0.034
                gammaPhase_Kpi_RChiPT: 0.
        IntResults: [2.27495e-14, 2.27443e-17, 1.40627e-12]

      -211,130,16:
        BR: [0., 0.] # [0.0042, 0.0042]
        ME:
          - Current_ME:
              J1:
                Type: VA_F_F
                Indices: [3, 0]
                v: 1.
                a: -1.
              J2:
                Type: VA_0_PiPi
                Indices: [1, 2]
                RUNNING_WIDTH: 1
                FORM_FACTOR: 100
                # pi^- K_L: Kpi_plus, KS (FM95) tune. Gamma(K_S pi^-)
                # should equal Gamma(K_L pi^-) - compare against the
                # 310,-211,16 entry above once both are run (that one
                # uses RChiPT rather than KS, so an exact numerical
                # match additionally requires setting FORM_FACTOR to
                # the same value in both, or comparing rates computed
                # under two independently-consistent models).
                gammaMag_Kpi_KS: -0.135
                gammaPhase_Kpi_KS: 0.
        IntResults: [2.27265e-14, 2.27208e-17, 1.4063e-12]

    ##### K Kbar (two physical final states: K^- K_S, K^- K_L) #####
      -321,310,16:
