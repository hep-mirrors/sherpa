model:
  form: decker_mirkes_sauer_was_chiral_resonance_three_meson
  structure:
    where: "eqs.(f1234),(videf), :535-558"
    provenance: printed-eq
    quote: 'J^{\mu}(q_{1},q_{2},q_{3})
            &=&   V_{1}^{\mu}\,F_{1}
                + V_{2}^{\mu}\,F_{2}
                +\,i\, V_{3}^{\mu}\,F_{3}
                + V_{4}^{\mu}\,F_{4} \>,'
    quote_vi: 'V_{1}^{\mu}&= (q_{1}-q_{3})_{\nu}\,T^{\mu\nu}  \>,\\[2mm]
               V_{2}^{\mu}&= (q_{2}-q_{3})_{\nu}\,T^{\mu\nu}  \>,\\[2mm]
               V_{3}^{\mu}&= \epsilon^{\mu\alpha\beta\gamma}q_{1\,\alpha}q_{2\,\beta}
                                                            q_{3\,\gamma} \>,'
    f4:
      provenance: printed-num
      where: (:565-570)
      quote: 'we set $F_4$ equal  to zero.'
      note: "F_4 is set to zero; the pseudoscalar contribution is dropped."
  form_factors:
    where: "eqs.(f1),(f2),(f3), :669-679"
    provenance: printed-eq
    quote: 'F^{(abc)}_{1}(Q^2,s_2,s_3)&=&{2\sqrt 2 A^{(abc)}\over 3f_\pi}
                                          G_{1}^{(abc)}(Q^2,s_2,s_3) \>,'
    quote_f3: 'F^{(abc)}_{3}(Q^2,s_1,s_2,s_3) &=& {A^{(abc)}\over 2\sqrt 2\pi^2f^3_\pi}
                                          G_3^{(abc)}(Q^2,s_1,s_2,s_3)\>,'
    normalisation:
      where: (:651-660)
      provenance: printed-eq
      quote: 'with the requirement $G^{(abc)}_{1,2,3}\rightarrow G^{(abc)}_{1,2,3,soft}= 1 $'
      note: >
        Every Breit-Wigner below is normalised to 1 at s = 0, and every G is a
        product/sum of them arranged so that G -> 1 in the chiral limit, except
        for G_{2,3}^(K- pi0 K0), G_2^(pi- Kbar0 pi0) and G_3^(pi0 pi0 K-),
        which the paper says vanish there.  This normalisation IS the coupling:
        there is no free overall strength per channel.

# ---------------------------------------------------------------------------
invariant_ordering:
  # This is the single convention most likely to be got wrong.  It is printed.
  definition:
    where: (:571-572)
    provenance: printed-eq
    quote: 'All form factors $F_i$ are in general functions of $Q^2$,
            $s_1=(q_2+q_3)^2, s_2=(q_1+q_3)^2$ and $s_3=(q_1+q_2)^2$.'
  meson_labelling:
    where: (:686-687)
    provenance: printed-eq
    quote: 'Note that by convenient ordering of the mesons, the two body resonances
            in $F_1$ ($F_2$) occur only in the variables $s_2,s_3$ ($s_1,s_3)$.'
    note: >
      The channel label "(abc)" in Tabs. I and II IS the momentum assignment:
      a = q_1, b = q_2, c = q_3.  Consequences worth stating explicitly, because
      they are the opposite of the naive guess in two cases:
        K^- pi^- pi^+ :  s_1 = m^2(pi^- pi^+)  [rho],  s_2 = m^2(K^- pi^+)  [K*]
        K^- pi^- K^+  :  s_1 = m^2(pi^- K^+)   [K*],   s_2 = m^2(K^- K^+)   [omega/phi]
        pi^- Kbar0 pi0:  s_1 = m^2(Kbar0 pi0)  [K*],   s_2 = m^2(pi^- pi^0) [rho],
                         s_3 = m^2(pi^- Kbar0) [K*]
      So for K^- pi^- pi^+ the RHO sits in s_1 and the K* in s_2, i.e. s_1 is
      the NON-strange pair.  Verified: with this assignment every G listed in
      Tab. I and Tab. II reduces to 1 (or to 0 where the paper says it must) at
      Q^2, s_i -> 0, and the closure below reproduces all eight channels.
  rest_frame:
    provenance: resolved
    where: "x_i definitions at :1305-1316"
    quote: 'x_{1}= V_{1}^{x}=q_{1}^{x}-q_{3}^{x},\,
            x_{2}= V_{2}^{x}=q_{2}^{x}-q_{3}^{x},\,
            x_{3}= V_{1}^{y}=q_{1}^{y}=-q_{2}^{y},\,
            x_{4}= V_{3}^{z}=\sqrt{Q^{2}}x_{3}q_{3}^{x},\,'
    resolution: >
      The paper defers the explicit x_i(s_1,s_2,s_3) to ref. [KueMi1] ((:1317-1318)
      reads "They can easily be expressed in terms of $s_1$, $s_2$ and $s_3$").
      The frame is nevertheless fully determined by the four definitions above:
      hadrons in the x-y plane of the hadronic rest frame with q_3 along +x
      (hence q_3^y = 0, hence x_3 = q_1^y = -q_2^y).  PROOF that this is the
      intended frame, not a guess: substituting q_3 = Q - q_1 - q_2 into
      V_3^mu = eps^{mu alpha beta gamma} q_1 q_2 q_3 gives
      V_3^z = sqrt(Q^2) (q_1 x q_2)_z = sqrt(Q^2) x_3 q_3^x identically, which
      is exactly the paper's printed x_4.  Closed form used here:
        E_i = (Q^2 + m_i^2 - s_i)/(2 sqrt(Q^2)),  p_i = sqrt(E_i^2 - m_i^2)
        q_1^x = (p_2^2 - p_1^2 - p_3^2)/(2 p_3),  q_2^x = -q_1^x - p_3,
        q_3^x = p_3,  x_3^2 = p_1^2 - (q_1^x)^2
      Only x_1, x_2, x_1 x_2, x_3^2 and x_4^2 enter W_A, W_B, so the residual
      sign freedom (+-x, +-y) is unobservable.

# ---------------------------------------------------------------------------
width_conventions:
  # Two conventions coexist in this paper and they are NOT interchangeable.
  energy_dependent:
    used_for: [rho, rho_prime, rho_double_prime, Kstar_892, Kstar_1410, Kstar_1680]
    denominator:
      where: (:317-319)
      provenance: printed-eq
      quote: '\mbox{BW}_{X}[s]\equiv {M^2_X\over [M^2_X-s-i\sqrt s \Gamma_X(s)]}\>,'
      note: "denominator carries i sqrt(s) Gamma(s), NOT i M Gamma(s).  BW(0) = 1."
    running:
      where: (:327-332)
      provenance: printed-eq
      quote: '\Gamma_X(s)&=& \Gamma_X {M^2_X\over s} \biggl({ p\over p_X}
              \biggr)^{2n+1}\,\>, \\[2mm]
               p&=&{1\over 2\sqrt s} \sqrt{(s-(M_1+M_2)^2)(s-(M_1-M_2)^2)}\>,\\[2mm]
              p_X&=& {1\over 2M_X}\sqrt{(M^2_X-(M_1+M_2)^2)(M^2_X-(M_1-M_2)^2)} \>,'
      note: >
        The mass factor is (M_X^2/s), NOT (M_X/sqrt(s)).  Both halves are
        recorded because the pair is what defines Gamma: a set carrying these
        Gamma_X under a (M/sqrt(s)) running width is invalid off the pole.
    power:
      where: (:335-336)
      provenance: printed-num
      quote: 'where $n$  is the power of $|p|$ in the matrix element,
              {\it i.e.} $n=1$ for the decay modes in this paper.'
      note: "n = 1 -> (p/p_X)^3 everywhere."
    daughter_masses:
      provenance: assumed
      value: "rho-family: M_1 = M_2 = m_pi;  K*-family: M_1 = m_K, M_2 = m_pi"
      note: >
        The paper never says which M_1, M_2 go into p and p_X.  ASSUMED to be the
        resonance's own dominant decay products.  This is forced for the rho in
        the K^0 K^- channel: m_rho = 0.773 < 2 m_K, so p_X would be imaginary if
        the channel's own masses were used.  Numerically irrelevant elsewhere:
        swapping charged/neutral daughter masses changes B(K* nu) by < 0.02%.
    applies_also_to_T2:
      where: (:1100)
      provenance: printed-num
      quote: 'We use energy dependent widths here.'
      note: "confirms T_rho^(2) and T_K*^(2) use the energy-dependent form, not the fixed one."
  fixed_width:
    used_for: [K1_1270, K1_1400, omega, phi]
    denominator:
      where: "eq.(bwc), :899-904"
      provenance: printed-eq
      quote: 'BW_{K_1}[s]\equiv
              \frac{-m^2_{K_1}+im_{K_1}\Gamma_{K_1}}{[s-m^2_{K_1}+im_{K_1}
              \Gamma_{K_1}]},'
      note: >
        Constant width.  Note the numerator is (-m^2 + i m Gamma), not m^2:
        it is written so that BW(0) = +1 exactly, INCLUDING the imaginary part.
        Replacing it by m^2/(m^2 - s - i m Gamma) is NOT the same function - it
        differs by the factor (m^2 - i m Gamma)/m^2, i.e. by 3.9 degrees of
        constant phase for the K_1(1400).  That phase is unobservable for a
        single pole but is NOT unobservable in T_K1^(a), which is a coherent sum
        of two such poles.
      preamble:
        where: (:895-896)
        provenance: printed-num
        quote: 'In case of the $K_1$ resonances we use  normalized Breit-Wigner propagators
                with constant  widths:'
    omega_phi_share_it:
      where: (:959-961)
      provenance: printed-num
      quote: 'We use Breit-Wigner propagators with fixed widths,
              of the same form as the one  used for the
              $K_1$ resonances in Eq.~(\ref{bwc}), with \cite{RPP94}'
  a1_width:
    used_for: [a1_1260]
    denominator:
      where: (:799-803)
      provenance: printed-eq
      quote: '\mbox{BW}_{A_1}(s) =
              \frac{m_{A_1}^2} {m_{A_1}^2 - s - i m_{A_1} \Gamma_{A_1} g(s) /
              g(m_{A_1})}\>,'
      note: >
        A THIRD convention: denominator i m_{A1} Gamma g(s)/g(m_A1), i.e. the
        mass-times-width form, not i sqrt(s) Gamma(s).  Do not apply the
        energy-dependent rule above to the A_1.
    running:
      provenance: unresolved
      where: (:814-815)
      quote: 'where the  function $g(s)$ has been calculated in
              \cite{KueSa}.'
      note: >
        UNRESOLVED.  The paper does not print g(s); it cites Kuehn-Santamaria,
        Z. Phys. C 48 (1990) 445.  Per the rule that a functional form absent
        from the source is unresolved whatever one thinks it obviously is, g(s)
        is NOT supplied here.  Consequence: the AXIAL part of the five K K pi
        channels cannot be evaluated from this file alone, and could not be
        closed against Tab. III column 2 (see closure.not_closed).  The K pi pi
        channels are unaffected - they use T_K1, which is fully specified.

# ---------------------------------------------------------------------------
parameters:

  # ---- T_rho^(1): the two-body VECTOR form factor in the axial current -----
  T_rho_1:
    role: "two-body rho resonance factor, used for the non-strange pair in F_1/F_2 and in the two-meson K^0 K^- current"
    form:
      where: "eq.(beta), :342-347"
      provenance: printed-eq
      quote: 'T_\rho^{(1)}(s) & = & \frac{1}{1 + \beta_\rho}
              \Big[ \mbox{BW}_\rho(s) + \beta_\rho\, \mbox{BW}_{\rho''}(s)
              \Big] \>,'
    provenance_of_values:
      where: (:362-364)
      provenance: printed-num
      quote: 'These are the values which have been determined from $e^+ e^- \to \pi^+
              \pi^-$ in \cite{KueSa} and have been used in \cite{Dec93} for the
              non-strange case.'
    values:
      beta_rho:       { value: -0.145, sigfigs: 3, provenance: printed-num, where: "eq.(eqnrho), :354" }
      m_rho:          { value: 0.773, unit: GeV, sigfigs: 3, provenance: printed-num, where: "eq.(eqnrho), :355" }
      Gamma_rho:      { value: 0.145, unit: GeV, sigfigs: 3, provenance: printed-num, where: "eq.(eqnrho), :355" }
      m_rho_prime:    { value: 1.370, unit: GeV, sigfigs: 4, provenance: printed-num, where: "eq.(eqnrho), :357" }
      Gamma_rho_prime: { value: 0.510, unit: GeV, sigfigs: 3, provenance: printed-num, where: "eq.(eqnrho), :357" }
    nature:
      rho:        physical_state
      rho_prime:  effective_fit_pole
      note: >
        m_rho' = 1.370, Gamma_rho' = 0.510 GeV is a Kuehn-Santamaria fit to
        e+e- -> pi+pi-, not a PDG rho(1450).  Gamma/m = 0.37 - it is an effective
        pole absorbing everything above the rho(770), and beta_rho = -0.145 is
        its weight in that same fit.  The paper says so directly ((:460-463)):
        "whereas the $\rho'$ mass and width parameters in Eq.~(\ref{eqnrho}) have
        been determined from a fit to the $Q^2$ distribution in $\tau\to
        2\pi\nu_\tau$ \cite{KueSa}."  NEVER substitute a database rho(1450), and
        never move beta_rho without moving m_rho', Gamma_rho' with it.

  # ---- T_K*^(1): the two-body strange VECTOR form factor -------------------
  T_Kstar_1:
    role: "two-body K* resonance factor; used for every strange pair in F_1, F_2, F_3, and for the two-meson K pi current"
    form:
      where: "eq.(betakst), :372-377"
      provenance: printed-eq
      quote: 'T_{K^\star}^{(1)}(s) & = &\frac{1}{1 + \beta_{K^\star}}
              \Big[ \mbox{BW}_{K^\star}(s) + \beta_{K^\star}\, \mbox{BW}_{{K^\star}''}(s)
              \Big]\>,'
    values:
      beta_Kstar:       { value: -0.135, error: 0.025, sigfigs: 3, provenance: printed-num,
                          where: (:450), determined_in_this_paper: true }
      m_Kstar:          { value: 0.892, unit: GeV, sigfigs: 3, provenance: printed-num, where: "eq.(ksdef), :385" }
      Gamma_Kstar:      { value: 0.050, unit: GeV, sigfigs: 2, provenance: printed-num, where: "eq.(ksdef), :386" }
      m_Kstar_prime:    { value: 1.412, unit: GeV, sigfigs: 4, provenance: printed-num, where: "eq.(ksdef), :388" }
      Gamma_Kstar_prime: { value: 0.227, unit: GeV, sigfigs: 3, provenance: printed-num, where: "eq.(ksdef), :389" }
    beta_determination:
      where: (:445-450)
      provenance: printed-num
      quote: 'Thus our results favour a negative value of $\beta_{K^\star}$,
              and we obtain
              $\beta_{K^\star}=-0.135\pm 0.025$ as a result of this analysis.'
      note: >
        beta_K* is the ONLY quantity this paper fits, and it is fitted to a
        single number: B(K* nu) = 1.36 +- 0.08%.  It is therefore 100%
        anti-correlated with the overall normalisation of the strange axial and
        vector currents - the paper says as much at (:1399-1409), where it notes
        the dominant effect is the factor 1/(1+beta_K*)^2 and that it "may well
        compensate the error being made by deriving the coupling constants using
        flavour symmetry".  Treat beta_K* as a normalisation knob, not as
        spectroscopy.
    nature:
      Kstar_892:   physical_state
      Kstar_1410:  physical_state
      note: >
        Both masses/widths are RPP94 values, not fitted here ((:457-459)
        "Note that we use here the values of \cite{RPP94} for the mass and widths
        parameters of").  Only the WEIGHT beta_K* is this paper's.  This is the
        one place in the file where substituting a modern database mass would be
        defensible - but it would change B(K* nu) and hence invalidate beta_K*,
        so it still may not be done piecemeal.

  # ---- T_rho^(2), T_K*^(2): the THREE-body vector resonance ---------------
  T_rho_2:
    role: "three-body (Q^2) vector resonance in the anomalous current, non-strange"
    form:
      where: (:1048-1058)
      provenance: printed-eq
      quote: 'T_\rho^{(2)} & = & \frac{1}{1 + \lambda + \mu}
              \Big[ \mbox{BW}_\rho(s) + \lambda \mbox{BW}_{\rho''}(s)
              + \mu \mbox{BW}_{\rho''''}(s)
              \Big] \>,'
    values:
      lambda:              { value: -0.25,  sigfigs: 2, provenance: printed-num, where: (:1065), printed_as: "6.5/-26" }
      mu:                  { value: -0.038, sigfigs: 2, provenance: printed-num, where: (:1067), printed_as: "1/-26" }
      m_rho:               { value: 0.773, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1075) }
      Gamma_rho:           { value: 0.145, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1075) }
      m_rho_prime:         { value: 1.500, unit: GeV, sigfigs: 4, provenance: printed-num, where: (:1077) }
      Gamma_rho_prime:     { value: 0.220, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1077) }
      m_rho_dprime:        { value: 1.750, unit: GeV, sigfigs: 4, provenance: printed-num, where: (:1079) }
      Gamma_rho_dprime:    { value: 0.120, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1079) }
    warning: >
      THE rho' HERE IS NOT THE rho' IN T_rho^(1).  1.500/0.220 here against
      1.370/0.510 there.  The paper is explicit that these come from different
      fits: (:1083-1084) reads "This is exactly the parameterization of \cite{Gom90}, which was used in
      \cite{Dec93}, written in a slightly different way."  Unifying them is the
      single most tempting and most destructive edit that can be made to this file.
    nature:
      rho_prime:  effective_fit_pole
      rho_dprime: effective_fit_pole
      evidence: >
        (:1104-1106) reads "The parameters $\lambda$ and $\mu$, as well as the $\rho'$
        and $\rho''$ parameters of $T_\rho^{(2)}$ have been obtained from a fit
        to data." - a fit to e+e- -> eta pi pi (DM2), i.e. a different hadronic
        environment.  lambda and mu are printed as the ratios 6.5/-26 and 1/-26,
        which is the tell of a fit residue, not a measured coupling.
  T_Kstar_2:
    role: "three-body (Q^2) vector resonance in the anomalous current, strange"
    form:
      where: (:1054-1057)
      provenance: printed-eq
      quote: 'T_{K^\star}^{(2)} & = &\frac{1}{1 + \lambda + \mu}
              \Big[ \mbox{BW}_{K^\star}(s) + \lambda \mbox{BW}_{{K^\star}''}(s)
              + \mu \mbox{BW}_{{K^\star}''''}(s)
              \Big]\>,'
    values:
      lambda:               { value: -0.25,  sigfigs: 2, provenance: printed-num, where: (:1065) }
      mu:                   { value: -0.038, sigfigs: 2, provenance: printed-num, where: (:1067) }
      m_Kstar:              { value: 0.892, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1089) }
      Gamma_Kstar:          { value: 0.050, unit: GeV, sigfigs: 2, provenance: printed-num, where: (:1090) }
      m_Kstar_prime:        { value: 1.412, unit: GeV, sigfigs: 4, provenance: printed-num, where: (:1092) }
      Gamma_Kstar_prime:    { value: 0.227, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1093) }
      m_Kstar_dprime:       { value: 1.714, unit: GeV, sigfigs: 4, provenance: printed-num, where: (:1095) }
      Gamma_Kstar_dprime:   { value: 0.323, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:1096) }
    nature:
      Kstar_892: physical_state
      Kstar_1410: physical_state
      Kstar_1680: physical_state
      lambda_mu: effective_fit_pole_weights_borrowed_from_the_rho_sector
      evidence: >
        (:1106-1108) reads "For the $K^\star$ in the anomalous channel,
        we use the same parameters $\lambda$ and $\mu$ as for the $\rho$ with
        ${K^\star}'$, ${K^\star}''$ parameters taken from \cite{RPP94}."
        So lambda, mu here are ASSUMED equal to the rho-sector fit values by
        SU(3), not measured.  The paper then says it does not much matter
        ((:1112-1115)): "It should be noted, however, that the numerical significance of these
        details is fairly small, because of the small vector channel
        contribution to the relevant decay modes".

  # ---- omega/phi mixing in the anomalous current --------------------------
  T_omega:
    role: "two-body isoscalar resonance for the K Kbar pair in the anomalous current"
    form:
      where: (:943-946)
      provenance: printed-eq
      quote: 'T_\omega(s) = \frac{1}{1 + \epsilon} [ \mbox{BW}_\omega(s) +
              \epsilon \mbox{BW}_\Phi(s) ]\>,'
    values:
      epsilon:      { value: 0.05,    sigfigs: 1, provenance: printed-num, where: (:953) }
      m_omega:      { value: 0.782,   unit: GeV, sigfigs: 3, provenance: printed-num, where: (:964) }
      Gamma_omega:  { value: 0.00843, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:964) }
      m_phi:        { value: 1.020,   unit: GeV, sigfigs: 4, provenance: printed-num, where: (:965) }
      Gamma_phi:    { value: 0.00443, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:965) }
    nature:
      omega: physical_state
      phi:   physical_state
      epsilon: external_input
    why_not_rho:
      where: (:929-935)
      provenance: printed-num
      quote: 'Due to $G$ parity conservation, the vector resonance $V$ in the decay chain
              $W^- \to \rho^-$, $\rho^- \to V \pi^-$, $V \to (K^- K^+, K^0 \overline{K^0})$
              must have $G = -1$. Thus only the $\omega$ and the $\Phi$ qualify.'
      note: >
        This is a CORRECTION to Decker-Mirkes-Sauer-Was, which had a rho here.
        If the consuming code inherited a rho in the K Kbar pair of the anomalous
        K K pi current, it inherited the bug this paper fixes.

  # ---- the strange axial three-body resonances ----------------------------
  T_K1:
    role: "three-body (Q^2) axial resonance for K pi pi; two distinct towers"
    form:
      where: (:870-876)
      provenance: printed-eq
      quote: 'T_{K_1}^{(a)}(s) & = & \frac{1}{1 + \xi}
              \Big[ \mbox{BW}_{K_1(1400)}(s) + \xi \mbox{BW}_{K_1(1270)} (s)
              \Big] \>,'
      quote_b: 'T_{K_1}^{(b)}(s) & = & \mbox{BW}_{K_1(1270)}(s) \>,'
      note: >
        (a) is the K* pi decay chain, (b) is the rho K chain; the paper's
        reasoning is at (:863-867) - "The $K_1(1400)$ decays exclusively into $K^\star \pi$, while the
        $K_1(1270)$ decays mainly into $K \rho$, with a smaller branching ratio
        into $K^\star \pi$."  T_K1^(b) has NO K_1(1400) at all and NO
        normalisation prefactor: BW(0) = 1 already.
    values:
      xi:               { value: 0.33,  sigfigs: 2, provenance: resolved,
                          where: "eq.(xidef), :884-886 for |xi|; sign at :1361-1363" }
      m_K1_1400:        { value: 1.402, unit: GeV, sigfigs: 4, provenance: printed-num, where: (:912) }
      Gamma_K1_1400:    { value: 0.174, unit: GeV, sigfigs: 3, provenance: printed-num, where: (:913) }
      m_K1_1270:        { value: 1.270, unit: GeV, sigfigs: 4, provenance: printed-num, where: (:914) }
      Gamma_K1_1270:    { value: 0.090, unit: GeV, sigfigs: 2, provenance: printed-num, where: (:915) }
    xi_resolution:
      magnitude:
        where: (:879-887)
        provenance: printed-num
        quote: 'Using the ratio $\Gamma(K_1(1270) \to K^\star \pi) /
                \Gamma(K_1(1400) \to K^\star \pi)$, we obtain after phase space
                correction:'
        note: "|xi| = 0.33."
      sign:
        provenance: resolved
        where: ":888-892 and Tab. IV, :1842-1865"
        quote: 'Thus $\xi$ is determined up to a sign ambiguity. We will consider both
                possibilities below and find that $\xi = -0.33$ leads to decay rates
                which strongly disagree with experimental data (see Sec.~\ref{numeric}).'
        evidence: >
          The paper resolves the sign against its own printed rates, and so does
          this extraction: Tab. IV (xi = -0.33) predicts B(K- pi- pi+) = 1.37%
          against 0.40 +- 0.09% measured, versus 0.77% for xi = +0.33.  Both
          signs were evaluated in the closure below and BOTH reproduce the
          paper's tables to ~2%, which is what makes the sign a genuine
          `resolved` rather than an `assumed`: it is fixed by data, not by us.
    nature:
      K1_1270: physical_state
      K1_1400: physical_state
      xi:      derived_branching_ratio_weight
      note: >
        Both K_1 masses/widths are RPP94.  xi is NOT a fit parameter either - it
        is a phase-space-corrected ratio of measured partial widths, with a sign
        chosen by comparing to rate data.  This is the one tower in the file
        where a database mass/width substitution would be conceptually
        defensible; it is still forbidden, because xi = 0.33 was computed from
        THESE widths.

  # ---- the non-strange axial three-body resonance -------------------------
  A1:
    role: "three-body (Q^2) axial resonance for K Kbar pi"
    values:
      m_A1:      { value: 1.251, unit: GeV, sigfigs: 4, provenance: printed-num, where: "eq.(a1), :807" }
      Gamma_A1:  { value: 0.475, unit: GeV, sigfigs: 3, provenance: printed-num, where: "eq.(a1), :809" }
      g_of_s:    { provenance: unresolved, where: (:814-815), see: "width_conventions.a1_width.running" }
    nature:
      a1: effective_fit_pole
      evidence: >
        Gamma_A1 = 0.475 GeV is a CHOICE made in this paper, not a measurement,
        and the paper chose it to move a branching ratio: (:815-816) reads
        "Note that we use a smaller $A_1$ width than used
        in \cite{Dec93,KueMi1,KueMi2} ($\Gamma_{A_1}=0.599$ GeV)." and
        (:833-836) reads "An $A_1$ width of 0.475 GeV predicts a branching fraction
        ${\cal B}(\tau^-\rightarrow \pi^-\pi^-\pi^+\nu_\tau)$ of 8.6 \%
        (compared to 6.3 \% for $\Gamma_{A_1}=599$ GeV),".
        A parameter whose two candidate values differ by 26% and move a
        branching ratio from 6.3% to 8.6% is a fit parameter.  The paper
        quantifies the consequence for THIS file at (:1419-1422): using 0.599
        instead "decreases the branching fractions for the  $K\pi K$ decay modes in Tab.~\ref{tab3}
        by about 15\%".  Never substitute a database a_1(1260) width here.
        (Note the typo "599 GeV" for "0.599 GeV" at :835 in the source.)

  # ---- the anomalous-current mixing parameter -----------------------------
  alpha:
    role: "relative strength of the strange and non-strange two-body resonances in the anomaly"
    value: { value: 0.7071067811865476, expression: "1/sqrt(2)", sigfigs: exact,
             provenance: printed-eq, where: (:1012-1014) }
    note: >
      In Decker-Mirkes-Sauer-Was alpha was a free parameter; here it is DERIVED.
      (:1010-1011) reads "the parameter $\alpha$ can be determined, with the result".
      alpha never appears explicitly in the final Tab. II - it has already been
      substituted into the coefficients, which is why the K- pi- K+ anomaly reads
      (sqrt2 - 1)[sqrt2 T_omega(s_2) + T_K*(s_1)] and not (T + alpha T)/(1+alpha).
      Checked: (sqrt2-1)(sqrt2 + 1) = 1, so G_3 -> 1 in the chiral limit, exactly
      as the normalisation requires.  Do not re-introduce alpha as a knob.

# ---------------------------------------------------------------------------
# Per-channel coefficients and form factors: Tab. I (axial) and Tab. II (vector).
# These are the isospin content of the paper and they do NOT flatten to one
# block.  Expressions are python, with T1K=T_Kstar_1, T1R=T_rho_1, T2K=T_Kstar_2,
# T2R=T_rho_2, TW=T_omega, K1a=T_K1^(a), K1b=T_K1^(b), A1=BW_A1, S2=sqrt(2).
channels:

  "K- pi- K+":
    where: "Tab. I :1683-1686, Tab. II :1754-1757"
    provenance: printed-eq
    cabibbo: cos
    q: [K-, pi-, K+]
    A_axial:  "-1/2"
    A_vector: "-1"
    G1: "A1(Q2) * T1R(s2)"
    G2: "A1(Q2) * T1K(s1)"
    G3: "T2R(Q2) * (S2-1) * (S2*TW(s2) + T1K(s1))"
    symmetry_factor: 1
    predicted: { gamma_over_gamma_e: 0.011, anomaly: 0.0045, B_percent: 0.20,
                 where: "Tab. III, :1826" }

  "K0 pi- K0bar":
    where: "Tab. I :1688-1691, Tab. II :1759-1762"
    provenance: printed-eq
    cabibbo: cos
    q: [K0, pi-, K0bar]
    A_axial:  "-1/2"
    A_vector: "+1"
    G1: "A1(Q2) * T1R(s2)"
    G2: "A1(Q2) * T1K(s1)"
    G3: "T2R(Q2) * (S2-1) * (S2*TW(s2) + T1K(s1))"
    symmetry_factor: 1
    predicted: { gamma_over_gamma_e: 0.011, anomaly: 0.0045, B_percent: 0.20,
                 where: "Tab. III, :1827" }
    note: >
      Not an observable final state; kept because the K_S/K_L modes are built
      from it via eq.(eqn1).  Its A_vector is +cos theta_c where K- pi- K+ has
      -cos theta_c; the G's are identical.  The paper's Tab. III lists this
      channel and K- pi- K+ as EXACTLY equal in every column, which is only true
      if the neutral and charged kaon masses are taken degenerate - see
      conventions.meson_masses.

  "K_S pi- K_S":
    where: "Tab. I :1693-1697, Tab. II :1764-1767"
    provenance: printed-eq
    cabibbo: cos
    q: [K_S, pi-, K_S]
    A_axial:  "-1/4"
    A_vector: "-1/2"
    G1: "A1(Q2) * T1K(s3)"
    G2: "-A1(Q2) * (T1K(s1) + T1K(s3))"
    G3: "T2R(Q2) * (S2-1) * (T1K(s1) - T1K(s3))"
    symmetry_factor: 0.5
    predicted: { gamma_over_gamma_e: 0.0027, anomaly: 0.0008, B_percent: 0.048,
                 where: "Tab. III, :1828" }
    sign_note: >
      Tab. I/II and the Sec. VI equations (:1190-1198, :1226-1234) differ by an
      OVERALL sign for this channel only: the equations carry +cos/4 and +cos/2
      where the tables carry -cos/4 and -cos/2.  Both the axial and the vector
      flip together, so it is a global phase of this channel's current and does
      not affect any rate or structure function.  Tab. I/II is taken as primary.

  "K_S pi- K_L":
    where: "Tab. I :1699-1704, Tab. II :1769-1773"
    provenance: printed-eq
    cabibbo: cos
    q: [K_S, pi-, K_L]
    A_axial:  "-1/4"
    A_vector: "+1/2"
    G1: "A1(Q2) * (2*T1R(s2) + T1K(s3))"
    G2: "A1(Q2) * (T1K(s1) - T1K(s3))"
    G3: "T2R(Q2) * (S2-1) * (2*S2*TW(s2) + T1K(s1) + T1K(s3))"
    symmetry_factor: 1
    predicted: { gamma_over_gamma_e: 0.0058, anomaly: 0.0029, B_percent: 0.10,
                 where: "Tab. III, :1829" }

  "K- pi0 K0":
    where: "Tab. I :1706-1711, Tab. II :1775-1778"
    provenance: printed-eq
    cabibbo: cos
    q: [K-, pi0, K0]
    A_axial:  "3/(2*sqrt(2))"
    A_vector: "-1/sqrt(2)"
    G1: "A1(Q2) * (2./3*T1R(s2) + 1./3*T1K(s3))"
    G2: "(1./3)*A1(Q2) * (T1K(s1) - T1K(s3))"
    G3: "T2R(Q2) * (S2-1) * (T1K(s3) - T1K(s1))"
    symmetry_factor: 1
    predicted: { gamma_over_gamma_e: 0.0090, anomaly: 0.0032, B_percent: 0.16,
                 where: "Tab. III, :1830" }
    note: >
      Both G_2 and G_3 vanish at s_1 = s_3 and in the chiral limit.  This whole
      channel's K* content is NEW in this paper: (:722-723) reads
      "which differs from $G_2^{(K^- \pi^0 K^0)} = 0$ in Tab.~\ref{tab1} of \cite{Dec93}."
      and (:1034-1036) reads "These contributions were not taken into account in the
      parameterization used in \cite{Dec93}."

  "pi0 pi0 K-":
    where: "Tab. I :1715-1718, Tab. II :1780-1783"
    provenance: printed-eq
    cabibbo: sin
    q: [pi0, pi0, K-]
    A_axial:  "1/4"
    A_vector: "+1"
    G1: "K1a(Q2) * T1K(s2)"
    G2: "K1a(Q2) * T1K(s1)"
    G3: "(1./4)*T2K(Q2) * (T1K(s1) - T1K(s2))"
    symmetry_factor: 0.5
    predicted: { gamma_over_gamma_e: 0.0080, anomaly: 0.0007, B_percent: 0.14,
                 where: "Tab. III, :1832" }

  "K- pi- pi+":
    where: "Tab. I :1720-1723, Tab. II :1785-1788"
    provenance: printed-eq
    cabibbo: sin
    q: [K-, pi-, pi+]
    A_axial:  "-1/2"
    A_vector: "+1"
    G1: "K1a(Q2) * T1K(s2)"
    G2: "K1b(Q2) * T1R(s1)"
    G3: "(1./2)*T2K(Q2) * (T1R(s1) + T1K(s2))"
    symmetry_factor: 1
    predicted: { gamma_over_gamma_e: 0.043, anomaly: 0.0043, B_percent: 0.77,
                 where: "Tab. III, :1833" }
    note: >
      This is the channel that most needs the ordering convention: the rho sits
      in s_1 = m^2(pi- pi+) and the K* in s_2 = m^2(K- pi+).  It is also the only
      channel in which the two axial form factors use DIFFERENT three-body
      towers: G_1 uses T_K1^(a) (the K* pi chain) and G_2 uses T_K1^(b)
      (the rho K chain, pure K_1(1270), no K_1(1400)).

  "pi- K0bar pi0":
    where: "Tab. I :1725-1732, Tab. II :1790-1794"
    provenance: printed-eq
    cabibbo: sin
    q: [pi-, K0bar, pi0]
    A_axial:  "3/(2*sqrt(2))"
    A_vector: "sqrt(2)"
    G1: "(2./3)*K1b(Q2)*T1R(s2) + (1./3)*K1a(Q2)*T1K(s3)"
    G2: "(1./3)*K1a(Q2) * (T1K(s1) - T1K(s3))"
    G3: "(1./4)*T2K(Q2) * (2*T1R(s2) + T1K(s1) + T1K(s3))"
    symmetry_factor: 1
    predicted: { gamma_over_gamma_e: 0.054, anomaly: 0.0058, B_percent: 0.96,
                 where: "Tab. III, :1834" }
    note: >
      G_1 mixes the two K_1 towers within a single form factor: 2/3 of the rho K
      chain and 1/3 of the K* pi chain.  G_2 vanishes in the chiral limit.

