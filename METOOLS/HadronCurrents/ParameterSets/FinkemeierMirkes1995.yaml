two_meson:
  note: >
    Not part of the model-100 three-meson current, but recorded because
    beta_K* - which the three-meson channels all depend on - is fixed here, and
    because these are the only absolute predictions in the paper that can be
    closed without the unresolved g(s).
  current:
    where: "eq.(had2h), :251-261"
    provenance: printed-eq
    quote: '<  K^-(q_1) \pi^0(q_2) | V^\mu | 0 >
            &=& \frac{1}{\sqrt{2}} <  \overline{K^0}(q_1) \pi^-(q_2)| V^\mu |0>\>,'
    quote2: '< K^0(q_1) K^-(q_2) | V^\mu | 0 >
             & = & T_\rho^{(1)} (q_1 - q_2)_\nu \,T^{\mu\nu} \>,'
  predicted:
    B_Kstar_nu:
      where: "eq.(eqnkst), :421-438"
      provenance: printed-num
      values: { "beta=0": 1.00, "beta=-0.11": 1.28, "beta=-0.135": 1.36, "beta=-0.157": 1.44 }
      unit: percent
    B_K0Kminus:
      where: (:476-478)
      provenance: printed-num
      quote: '{\cal B}(K^0 K^- \nu_\tau) = 0.11 \%\>,'
  tauola_discrepancy:
    where: (:294-308)
    provenance: printed-num
    quote: 'Note that our results for the hadronic matrix elements for $K^- \pi^0$ and
            $\bar{K^0} \pi^-$ in Eq.~(\ref{had2h}) differ from the results in
            the Tauola Monte Carlo \cite{tauola}
            by an overall factor.'
    note: >
      Recorded as the paper's own claim, NOT used.  The paper asserts Tauola is
      off by 2/sqrt(3) and that this nearly cancels against Tauola's missing
      K*(1410).  Nothing from Tauola enters this file.

# ---------------------------------------------------------------------------
rate_formula:
  # Needed to reproduce the paper's tables; recorded because the closure depends
  # on it and because of the Cabibbo double-count trap below.
  where: "eq.(rate), :1279-1302"
  provenance: printed-eq
  quote: '\Gamma(\tau\rightarrow 3h)=
                     \frac{G^{2}}{12m_\tau}
          \bigl(^{\cos\theta_{c}}_{\sin\theta_{c}}\bigr)^2
          \frac{1}{(4\pi)^5}
          \int \frac{dQ^{2}}{Q^4} ds_1 ds_2 \,(m_\tau^{2}-Q^{2})^{2}\,
                    \left( 1+\frac{2Q^2}{m_\tau^2}\right)\,
                     \,\,(W_{A}+W_{B})'
  structure_functions:
    quote: 'W_{A}  &=&   \hspace{3mm}(x_{1}^{2}+x_{3}^{2})\,|F_{1}|^{2}
                       +(x_{2}^{2}+x_{3}^{2})\,|F_{2}|^{2}
                       +2(x_{1}x_{2}-x_{3}^{2})\,\mbox{Re}\left(F_{1}F^{\ast}_{2}\right)'
    quote_b: 'W_{B}  &=& \hspace{3mm} x_{4}^{2}|F_{3}|^{2}'
  no_interference:
    quote: 'Eq.~(\ref{rate}) shows that there is no interference
            between the axial vector contributions ($F_1, F_2$) and the
            vector current contribution  ($F_3$) in the total decay
            width.'
  normalisation_to_gamma_e:
    where: (:1267-1272)
    provenance: printed-num
    quote: 'To calculate the branching ratios, we use the theoretical prediction
            for $\Gamma_e/ \Gamma_{\mbox{tot}}=17.8 \%$ based on the experimental
            values for the tau mass
            $m_\tau = 1.7771 \, \mbox{GeV}$ and lifetime
            $\tau_{\tau} = 291.6 \, \mbox{fs}$ \protect\cite{taulifetime}, rather
            than using the experimental branching ratio.'

# ---------------------------------------------------------------------------
conventions:
  cabibbo_counted_once:
    provenance: resolved
    where: "eq.(rate) :1283 carries (cos/sin theta_c)^2; Tab. I/II A^(abc) at :1683-1794 ALSO carry cos/sin theta_c"
    resolution: >
      The Cabibbo factor appears TWICE in the paper's own notation - once
      explicitly in eq.(rate) and once inside every A^(abc) of Tabs. I and II -
      and it must be applied ONCE.  Resolved against the printed numbers, not
      assumed: applying it twice would suppress every Cabibbo-suppressed
      channel by a further sin^2(theta_c) ~ 0.05, i.e. by a factor 20.  With it
      applied once, the anomaly column of Tab. III reproduces to 2% across all
      eight channels and across Tabs. IV, V and VI; with it applied twice, the
      three K pi pi channels come out 20x too small.  Not a close call.
      Practically: use A^(abc) exactly as printed in Tabs. I/II (theta_c
      included) and DROP the prefactor in eq.(rate).
  cabibbo_value:
    provenance: resolved
    value: { sin2_theta_c: 0.050, cos2_theta_c: 0.950 }
    resolution: >
      The paper never prints theta_c.  sin^2 = 0.05 is what simultaneously
      reproduces B(K* nu) = 1.00/1.28/1.36/1.44% for beta_K* = 0/-0.11/-0.135/-0.157
      (to -0.8/+0.5/+1.0/+1.2%) and the whole Cabibbo-suppressed three-meson block to
      2%; cos^2 = 0.95 reproduces B(K^0 K^-) = 0.11%.  Equivalent to
      sin theta_c = 0.2236, i.e. |V_us| = 0.224 - slightly above the RPP94 0.2205,
      which is within the 2% scatter of the closure and cannot be pinned harder
      from 2-significant-figure tables.
  f_pi:
    provenance: resolved
    value: { value: 0.0933, unit: GeV, sigfigs: 3 }
    resolution: >
      f_pi is not printed anywhere in the paper, yet the absolute rate depends on
      it as f_pi^-2 (axial) and f_pi^-6 (anomaly).  Resolved by requiring the
      axial and anomalous residuals to agree: with f_pi = 0.0933 GeV the
      Cabibbo-suppressed axial closure sits at 1.020 x paper and the
      Cabibbo-suppressed anomaly at 1.018 x paper.  Since the two scale as
      f_pi^-2 and f_pi^-6, their RATIO fixes f_pi independently of theta_c and of
      Gamma_e: (1+delta)^4 = 1.018/1.020 gives f_pi = 0.0933 GeV to 0.05%
      (0.35% once the tables' rounding is folded in).  So the convention is
      f_pi = 93.3 MeV, i.e. the f_pi ~ 93 MeV normalisation, NOT 130 MeV.
  identical_particles:
    provenance: resolved
    value: "extra factor 1/2 in the rate for pi0 pi0 K-, K_S pi- K_S and K_L pi- K_L"
    resolution: >
      Eq.(rate) integrates s_1 and s_2 over the full Dalitz plot and the paper
      says nothing about identical particles.  Resolved against the printed
      numbers: without the 1/2, the anomaly column comes out 2.09x the paper's
      0.0007 for pi0 pi0 K- and 1.81x its 0.0008 for K_S pi- K_S, while every
      non-identical channel sits at 0.99-1.02.  With the 1/2 they join the rest.
      A clean factor-of-two signal in exactly the two channels with a repeated
      meson, and in no others.
  meson_masses:
    provenance: resolved
    value: "isospin-degenerate: all kaons at the charged-kaon mass, all pions at the charged-pion mass"
    resolution: >
      The paper says it uses "the physical masses and decay widths of the mesons
      in the propagators and in the phase space" ((:1387-1389)) but its Tab. III
      lists K- pi- K+ and K^0 pi- Kbar^0 as EXACTLY equal in every column of
      every table.  With m_K0 = 0.4977 and m_K+ = 0.4937 those two rates differ
      by 9% (computed here), so the paper cannot have used both.  Taking all
      kaons at one mass makes them equal, and brings the K_S/K_L channels from
      0.90x to 0.99x the paper's values.  The pion degeneracy is a weaker
      inference: it moves the pi0 pi0 K- anomaly from 1.047x to 1.010x and
      pi- Kbar0 pi0 from 1.037x to 1.021x, so it is preferred but not decisive.
      Whichever is used, the spread stays inside 4%.
  gamma_e:
    provenance: assumed
    value: "Gamma_e = G_F^2 m_tau^5 / (192 pi^3), with G_F = 1.16639e-5 GeV^-2, m_tau = 1.7771 GeV"
    note: >
      The paper prints m_tau and Gamma_e/Gamma_tot = 17.8% but not the expression
      for Gamma_e.  Using instead Gamma_e = 0.178 hbar/291.6fs from the paper's own
      lifetime raises every Gamma/Gamma_e by 0.8% and makes the closure slightly
      worse, so the tree-level expression is the one assumed.  This is a pure
      overall normalisation and is degenerate with theta_c and f_pi.

correlations:
  printed: false
  note: >
    The paper prints NO correlation matrix - there is no simultaneous fit to
    correlate.  What it does print, and what matters more here, is a set of
    explicit sensitivities, which are the honest substitute:
      - beta_K* = -0.135 -> -0.11 moves every three-meson rate down 3-4%
        (Tab. V); beta_K* -> 0 moves them down 19-23% (Tab. VI).
      - Gamma_A1 = 0.475 -> 0.599 GeV decreases the K pi K modes by about 15%
        ((:1419-1422)) and moves R from 0.48 to 0.42 ((:1446-1447)).
      - xi = +0.33 -> -0.33 roughly DOUBLES the K pi pi rates (Tab. IV).
    beta_K*, Gamma_A1 and the overall SU(3) coupling normalisation are strongly
    degenerate by construction; the paper says so at (:1407-1409) -
    "The main effect of choosing a different $\beta_{K^\star}$ is to
    change the normalization, which may well compensate the error being made
    by deriving the coupling constants using flavour symmetry."
    It also states the size of that theory error at (:1391-1393):
    "The approximation made may
    lead to an error of about $10$--$30 \%$ on the matrix
    element level."

# ---------------------------------------------------------------------------
closure:
  against: >
    The paper's own printed predictions, rebuilt from this file alone:
      (i)   B(K* nu) at four values of beta_K*, eq.(eqnkst) :421-438;
      (ii)  B(K^0 K^- nu) = 0.11%, :477;
      (iii) the anomaly column (column 3) of Tabs. III, V and VI for all eight
            three-meson channels - 24 numbers, none of which needs the A_1;
      (iv)  the TOTAL column (column 2) of Tabs. III, IV, V and VI for the three
            K pi pi channels - 12 numbers, which need T_K1 but not the A_1.
    Integration: Gauss-Legendre in Q^2 and in (s_1, s_2) over the exact Dalitz
    boundary s_2^{+-} = m_1^2 + m_3^2 + 2 E_1* E_3* +- 2 p_1* p_3* evaluated in
    the (23) rest frame; x_i built from the frame construction in
    invariant_ordering.rest_frame.  The integrator was validated BEFORE any
    conclusion was drawn from it by reproducing B(tau -> pi- pi0 nu) = 23.7%
    from T_rho^(1) with the same two-body kernel, and by checking that every G
    in Tabs. I and II tends to 1 (or to 0) in the chiral limit.
  result: >
    Rebuilt from THIS FILE alone (parameters, channel expression strings and the
    resolved conventions, including isospin-degenerate charged meson masses).
    (i)   B(K* nu) [%], calc vs paper, sin^2 theta_c = 0.05:
            beta = 0      : 0.992 vs 1.00   (-0.8%)
            beta = -0.11  : 1.287 vs 1.28   (+0.5%)
            beta = -0.135 : 1.373 vs 1.36   (+1.0%)   <- the value taken
            beta = -0.157 : 1.458 vs 1.44   (+1.2%)
    (ii)  B(K^0 K^-) = 0.110% vs 0.11% - exact to the printed digits.
    (iii) anomaly column, calc/paper:
            Tab. III: K-pi-K+ 0.988, K0pi-K0bar 0.988, KSpi-KS 0.986, KSpi-KL 0.989,
                      K-pi0K0 0.986, pi0pi0K- 1.010, K-pi-pi+ 1.018, pi-K0barpi0 1.021
            Tab. V:   1.002, 1.002, 1.064, 1.007, 0.993, 0.953, 1.020, 1.017
            Tab. VI:  0.989, 0.989, 0.981, 0.993, 0.981, 1.049, 0.998, 1.019
          (Tab. IV anomaly is identical to Tab. III by construction and is too.)
          The only entries outside 2.1% (1.064, 0.953, 1.049) are against
          ONE-significant-figure numbers (0.0007, 0.0007, 0.0005), i.e. +-7-10%.
    (iv)  total column, calc/paper, for (pi0 pi0 K-, K- pi- pi+, pi- Kbar0 pi0):
            Tab. III (xi=+0.33, beta=-0.135): 1.022, 1.020, 1.018
            Tab. IV  (xi=-0.33, beta=-0.135): 0.995, 1.012, 1.014
            Tab. V   (xi=+0.33, beta=-0.11 ): 1.014, 1.022, 1.020
            Tab. VI  (xi=+0.33, beta= 0    ): 1.010, 1.005, 1.024
    44 comparisons in all.  Every one against a 2-3 significant-figure entry is
    within 2.4%; the three outliers are all against 1-significant-figure entries
    and are inside that entry's own rounding.  The beta_K* ladder
    (0 / -0.11 / -0.135 / -0.157), the xi sign flip (a factor ~2 in the rates),
    the Cabibbo-allowed vs suppressed split, and the relative size of all eight
    channels are all reproduced - the SHAPE of the model is confirmed, not one
    number.
  residual_explained: >
    The residual is a COHERENT scale, not scatter, and it is fully accounted for
    by three normalisation constants the paper never prints:
      1. theta_c.  Not printed.  It enters as sin^2 or cos^2 and is the only
         thing separating the +2% of the Cabibbo-suppressed block from the -1.3%
         of the Cabibbo-allowed anomaly block.  Fixing sin^2 = 0.05 exactly makes
         the suppressed block +2%; fixing it at 0.049 makes it exact and leaves
         the allowed block at -1.2%.  No single theta_c removes both, which
         means ~1% of genuine numerical difference remains - the size of one
         unit in the last printed digit of a 2-significant-figure table.
      2. f_pi.  Not printed.  Pinned to 0.0933 GeV by the ratio of the axial and
         anomalous residuals (see conventions.f_pi), so it is no longer free -
         but only to 0.35%, which is 2% of rate in the anomaly (f_pi^-6).
      3. Gamma_e.  The paper gives Gamma_e/Gamma_tot but not Gamma_e; the
         tree-level and lifetime-derived values differ by 0.8%.
    Rounding is the other half: EVERY number in Tabs. III-VI is printed to one
    or two significant figures.  0.0045 means [0.00445, 0.00455], i.e. +-1.1%;
    0.0007 means +-7%.  Against that granularity a coherent 2% cannot be
    resolved into a defect.
    Nothing was tuned.  beta_K*, xi, lambda, mu, epsilon, alpha and every mass
    and width below are exactly as printed; the three constants above are inputs
    the paper omits, and they were fixed once, globally, and then held.
  not_closed: >
    The TOTAL column of the five K Kbar pi channels (0.011, 0.011, 0.0027,
    0.0058, 0.0090 in Tab. III) could NOT be closed, because their axial part
    needs BW_A1, and BW_A1 needs g(s), which this paper does not print
    (see width_conventions.a1_width.running).  Their ANOMALY parts closed to 1.4%
    (above), so the failure is isolated to the A_1 line shape.
    Internal consistency check that survives without g(s): the paper's own
    columns give an axial fraction (0.011 - 0.0045)/0.011 = 59% for K- pi- K+,
    matching its prose at (:1343-1344) - "In fact, our predictions for the axial-vector contribution is
    about 60\%." - so the missing piece is a line shape, not a coefficient.
    Also not closed: R = Gamma(K_S pi- K_S)/Gamma(K_S pi- K_L) = 0.48 (:1440),
    same reason.  From the rounded Tab. III entries, 0.0027/0.0058 = 0.466.

