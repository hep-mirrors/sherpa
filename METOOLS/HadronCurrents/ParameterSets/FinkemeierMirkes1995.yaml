# One file is one fit is one citation.  Apply this set whole or not at all.
#
# This paper is a MODEL, not a fit to a spectrum: almost every number below is
# either taken from RPP94, inherited from a named earlier fit (Kuehn-Santamaria
# for T_rho^(1); Gomez-Cadenas et al. for T_rho^(2)), or fixed inside this paper
# from a branching ratio.  The couplings are NOT free: they are fixed by the
# chiral limit and by isospin/SU(3) Clebsch-Gordans, and the paper's whole point
# is that they are correlated ACROSS channels.  Substituting a mass or a weight
# from the particle database therefore breaks not one channel but the isospin
# relations between all of them.
#
# In particular: rho' appears TWICE below with DIFFERENT parameters
# (1.370/0.510 in T_rho^(1), 1.500/0.220 in T_rho^(2)).  That is deliberate and
# is the paper's own text.  Do not unify them.

source:
  paper:    "M. Finkemeier and E. Mirkes, Tau Decays into Kaons, MAD/PH/882, LNF-95/015(P) (March 1995); Z. Phys. C 72 (1996) 619"
  arxiv:    "hep-ph/9503474"
  main_tex: "9503474.tex"
  note: >
    Extracted from the arXiv LaTeX source only (arxiv.org/e-print/hep-ph/9503474
    -> single gzipped .tex, 1951 lines, no \input).  Every `where:` below is a
    line number in that file; the line number, not the equation number, is the
    authoritative locator, because this is a REVTeX source in which most of the
    displayed equations carry no \label and are numbered only by counting.
    No other paper, and no implementation, was consulted.

variant:
  taken: >
    Table III (:1802-1838) - the paper's own "preferred parameter choices",
    i.e. beta_K* = -0.135 in T_K*^(1) and xi = +0.33 in T_K1^(a).
  rejected:
    - >
      Table IV (:1842-1865), xi = -0.33.  Rejected because the paper rejects it:
      (:1361-1363) reads "The choice $\xi=+0.33$ is clearly preferred by the experimental data
      and we therefore believe that this is the physical choice."
    - >
      Table V (:1869-1898), beta_K* = -0.11.  A legitimate alternative the paper
      describes (:1373-1374) as "also consistent
      with the $\tau\rightarrow K^\star \nu_\tau$ decay rate"; it is 3-4% below
      Table III everywhere.  Not taken because -0.135 is the paper's central
      determination.
    - >
      Table VI (:1902-1931), beta_K* = 0 (the Decker-Mirkes-Sauer-Was choice, and
      what Tauola did).  This one needs care: the paper says at (:1377-1380)
      "Use of $\beta_{K^\star} = 0$ as in \cite{Dec93} leads to the results in Tab.~\ref{tab6},
      which overall agree better with the experimental results than those
      obtained with $\beta_{K^\star}=-0.135$."  So the variant that best matches
      experiment is NOT the variant the paper adopts.  We follow the paper's own
      determination (beta_K* = -0.135 +- 0.025, fixed from B(K* nu) = 1.36 +- 0.08%)
      rather than its remark about post-hoc agreement, because -0.135 is the value
      that all of Table III, the isospin relations and the quoted 60% axial
      fraction in K-pi-K+ were computed with.  Switching to 0 is a one-line change
      (beta_K*), but it must be done whole: use Table VI as the closure target then.
  purpose: >
    Closed-form generator model: the three-meson hadronic currents for
    tau -> K pi pi and tau -> K K pi in Sherpa METOOLS/HadronCurrents, at
    form-factor model number 100.  Every component below is an evaluable
    function of (Q^2, s_1, s_2, s_3) with ONE exception, flagged as unresolved:
    the A_1 running-width function g(s), which this paper does not print.

# ---------------------------------------------------------------------------
applies_to:

  # --- Cabibbo-suppressed, K pi pi:  parameterised directly in Tabs. I and II
  - channel: "-321,211,-211,16"
    model: 10
    paper_channel: "K^- pi^- pi^+"
    q1q2q3: "q1=K^-, q2=pi^-, q3=pi^+"
    provenance: printed-eq
    where: "Tab. I row 7, :1720-1723 and Tab. II row 7, :1785-1788"

  - channel: "-321,111,111,16"
    model: 10
    paper_channel: "pi^0 pi^0 K^-"
    q1q2q3: "q1=pi^0, q2=pi^0, q3=K^-"
    provenance: printed-eq
    where: "Tab. I row 6, :1715-1718 and Tab. II row 6, :1780-1783"
    note: "identical-particle factor 1/2 required in the rate; see conventions.identical_particles"

  - channel: "310,-211,111,16"
    model: 10
    paper_channel: "pi^- Kbar^0 pi^0"
    q1q2q3: "q1=pi^-, q2=K_S, q3=pi^0"
    provenance: inferred
    amplitude_factor: "-1/sqrt(2)"
    where: "Tab. I row 8 :1725-1732 / Tab. II row 8 :1790-1794, projected with eq.(klsdef) :1128-1137"
    note: >
      The paper parameterises pi^- Kbar^0 pi^0, not pi^- K_S pi^0.  Only Kbar^0
      is produced (|Delta S| = 1), so <pi^- K_S pi^0| = -(1/sqrt2)<pi^- Kbar^0 pi^0|
      and Gamma(pi^- K_S pi^0) = (1/2) Gamma(pi^- Kbar^0 pi^0), i.e. B = 0.48%.
      This 1/sqrt(2) is INFERRED from eq.(klsdef); the paper states the K_S/K_L
      projection only for the two-neutral-kaon modes.  The overall sign is
      unobservable here.

  - channel: "-211,130,111,16"
    model: 10
    paper_channel: "pi^- Kbar^0 pi^0"
    q1q2q3: "q1=pi^-, q2=K_L, q3=pi^0"
    provenance: inferred
    amplitude_factor: "+1/sqrt(2)"
    where: "Tab. I row 8 :1725-1732 / Tab. II row 8 :1790-1794, projected with eq.(klsdef) :1128-1137"
    note: "as above; Gamma(pi^- K_L pi^0) = (1/2) Gamma(pi^- Kbar^0 pi^0), B = 0.48%."

  # --- Cabibbo-allowed, K K pi
  - channel: "321,-321,-211,16"
    model: 10
    paper_channel: "K^- pi^- K^+"
    q1q2q3: "q1=K^-, q2=pi^-, q3=K^+"
    provenance: printed-eq
    where: "Tab. I row 1, :1683-1686 and Tab. II row 1, :1754-1757"

  - channel: "-321,310,111,16"
    model: 10
    paper_channel: "K^- pi^0 K^0"
    q1q2q3: "q1=K^-, q2=pi^0, q3=K_S"
    provenance: inferred
    amplitude_factor: "+1/sqrt(2)"
    where: "Tab. I row 5 :1706-1711 / Tab. II row 5 :1775-1778, projected with eq.(klsdef) :1128-1137"
    note: >
      Only K^0 is produced (Delta S = 0 alongside the K^-), so
      <K^- pi^0 K_S| = (1/sqrt2)<K^- pi^0 K^0| and likewise for K_L, giving
      Gamma = (1/2) Gamma(K^- pi^0 K^0), i.e. B = 0.080% each.  INFERRED from
      eq.(klsdef); the paper does not perform this projection itself.

  - channel: "-321,130,111,16"
    model: 10
    paper_channel: "K^- pi^0 K^0"
    q1q2q3: "q1=K^-, q2=pi^0, q3=K_L"
    provenance: inferred
    amplitude_factor: "+1/sqrt(2)"
    where: "Tab. I row 5 :1706-1711 / Tab. II row 5 :1775-1778, projected with eq.(klsdef) :1128-1137"
    note: "as above; B = 0.080%."

  - channel: "310,-211,130,16"
    model: 10
    paper_channel: "K_S pi^- K_L"
    q1q2q3: "q1=K_S, q2=pi^-, q3=K_L"
    provenance: printed-eq
    where: "Tab. I row 4, :1699-1704 and Tab. II row 4, :1769-1773"
    note: >
      q1 = K_S and q3 = K_L is NOT a free relabelling: G_1 and G_2 are not
      symmetric under 1<->3.  The assignment is fixed by the paper writing, at
      (:1163), "<K_S(q_1) \pi^-(q_2) K_L(q_3) | J^\mu | 0 >".

  - channel: "310,310,-211,16"
    model: 10
    paper_channel: "K_S pi^- K_S"
    q1q2q3: "q1=K_S, q2=pi^-, q3=K_S"
    provenance: printed-eq
    where: "Tab. I row 3, :1693-1697 and Tab. II row 3, :1764-1767"
    note: "identical-particle factor 1/2 required in the rate."

  - channel: "-211,130,130,16"
    model: 10
    paper_channel: "K_L pi^- K_L"
    q1q2q3: "q1=K_L, q2=pi^-, q3=K_L"
    provenance: printed-eq
    amplitude_factor: "-1 relative to K_S pi^- K_S"
    where: "eq.(eqn1), :1154-1157"
    note: >
      The paper prints, at (:1155-1156),
      "<K_L(q_1) \pi^-(q_2) K_L(q_3) | J^\mu | 0 >
       = -  <K_S(q_1) \pi^-(q_2) K_S(q_3) | J^\mu | 0 >",
      so the current is the K_S pi^- K_S current with an overall sign and the
      rate is identical.  The identical-particle factor 1/2 applies here too.

applies_to_note: >
  Every channel requested was included, but four of the ten (K_S pi^- pi^0,
  pi^- K_L pi^0, K^- K_S pi^0, K^- K_L pi^0) are NOT parameterised by the paper
  in that form: the paper gives pi^- Kbar^0 pi^0 and K^- pi^0 K^0 in the strong
  eigenbasis and only performs the K_S/K_L projection for the TWO-neutral-kaon
  modes.  Their 1/sqrt(2) is a one-line consequence of eq.(klsdef), which the
  paper does print, but it is inferred, not quoted.
  The paper also parameterises K^0 pi^- Kbar^0 (Tab. I/II row 2), which has no
  Sherpa final-state key because it is not an observable final state; it is
  retained below only because the K_S/K_L modes are built from it.
  The paper further treats the TWO-meson modes K^- pi^0, Kbar^0 pi^-, K^0 K^-
  (Sec. II).  Those are a different current (model number not requested here)
  and are recorded under `two_meson` because they are what fixes beta_K*.

