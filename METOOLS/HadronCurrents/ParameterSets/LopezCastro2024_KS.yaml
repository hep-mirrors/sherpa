model:
  form: kuehn_santamaria_three_pole_normalised_sum
  n_poles: 3
  normalisation: "F(0) = 1 exactly: BW^KS(0) = 1, the omega/phi terms vanish like s, and the sum is divided by the COMPLEX 1 + c_rho' + c_rho''"
  equations:
    em_form_factor:
      where: "eq.(eq:KSGS), main.tex:156-161"
      provenance: printed-eq
      fidelity: verbatim
      quote: '&\quad+c_{\rho^\prime}\,BW_{\rho^\prime}(s,m_{\rho^\prime},\Gamma_{\rho^\prime})+c_{\rho^{\prime\prime}}\,BW_{\rho^{\prime\prime}}(s,m_{\rho^{\prime\prime}},\Gamma_{\rho^{\prime\prime}})\bigg]/(1+c_{\rho^\prime}+c_{\rho^{\prime\prime}}),'
      first_line_main_tex_159: '\bigg[BW_{\rho}(s,m_\rho,\Gamma_\rho)\bigg(1+\delta_{\rho\omega}\frac{s}{m_{\omega}^2}\,BW_{\omega}^{NR}(s,m_\omega,\Gamma_\omega)+\delta_{\rho\phi}\frac{s}{m_{\phi}^2}\,BW_{\phi}^{NR}(s,m_\phi,\Gamma_\phi)\bigg)\\[1ex]'
      note: "Lines 157-158 contain a commented-out alternative prefactor.  The live equation divides by (1+c_rho'+c_rho'')."
    nr_breit_wigner:
      where: "main.tex:167"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'BW^{NR}_V(s,m_V,\Gamma_V)=\frac{m_V^2}{m_V^2-s-im_V\Gamma_V} \, ,'
    lineshape:
      where: "main.tex:184"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'BW^{KS}(s,m,\Gamma)=\frac{m^2}{m^2-s-im\Gamma(s,m,\Gamma)}.'
    width:
      where: "main.tex:178"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'm\Gamma(s,m,\Gamma)=\Gamma\,\frac{s}{m}\left(\frac{\beta_{\pi\pi}(s)}{\beta_{\pi\pi}(m^2)}\right)^3\theta(s-4m_\pi^2),'
      note: "Printed in the GS paragraph.  It applies to KS by main.tex:215, 'the energy-dependence of the GS, KS and GP widths is the same'."
    beta:
      where: "main.tex:180"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'where $\beta_{\pi\pi}(s)=\sqrt{1-4m_\pi^2/s}$.'
    beta_unequal:
      where: "main.tex:111"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'where $s\beta_{PP''}(s)=\sqrt{[s-(m_P-m_{P''})^2][s-(m_P+m_{P''})^2]}$.'

  width_convention:
    denominator:
      where: "main.tex:184"
      quote: 'm^2-s-im\Gamma(s,m,\Gamma)'
      provenance: printed-eq
    running:
      where: "main.tex:178"
      quote: 'm\Gamma(s,m,\Gamma)=\Gamma\,\frac{s}{m}\left(\frac{\beta_{\pi\pi}(s)}{\beta_{\pi\pi}(m^2)}\right)^3'
      provenance: printed-eq
    summary: >
      Im part of the denominator is Gamma*(s/m)*(beta(s)/beta(m^2))^3.
      Equivalently the denominator is m*Gamma(s) with Gamma(s) = Gamma*(s/m^2)*(beta/beta0)^3.
      The same convention applies to rho', rho'' (one width function for every
      isovector pole).
       [Corrected on review, 2026-09-22: an earlier note called this the OPPOSITE of Belle 0805.3773. It is not - the two are the SAME imaginary part. Belle writes sqrt(s)*Gamma(s) with Gamma(s)=Gamma*(M^2/s)*(k/k0)^3; with k=(sqrt(s)/2)*beta that equals Gamma*(s/M)*(beta/beta0)^3, which is this paper's m*Gamma(s). Verified numerically to 5 figures at m=0.4-1.4 GeV. Both papers DO differ from METOOLS' V_PP registry width, which gives Gamma*M*(k/k0)^3: 0.52x at 0.4 GeV, 1.30x at 1.0 GeV, 1.81x at 1.4 GeV. Compare full denominators, never one half.]
    on_shell: "Gamma = Gamma(m^2,m,Gamma) (main.tex:180)"

  weak_form_factor:
    statement:
      where: "main.tex:163"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'A similar expression holds for the weak form factor $f_+(s)$, with charged rho mesons parameters replacing the neutral ones and vanishing $\delta_{\rho\omega/\rho\phi}$ mixing parameters.'
    definitions:
      where: "main.tex:150-153"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'In the limit of exact isospin symmetry, $f_+(s)=F_V(s)$, $f_-(s)=0$ and, in particular, $f_+(0)=F_V(0)=1$'
    excited_resonances:
      where: "main.tex:597 (footnote)"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'We neglect IB in the masses and widths of the excited isovector resonances, to which data are not yet sensitive.'
    recipe: >
      f_+(s) = [BW^KS(s, m_rho+, Gamma_rho+)
                + c_rho' BW^KS(s, m_rho', Gamma_rho')
                + c_rho'' BW^KS(s, m_rho'', Gamma_rho'')] / (1 + c_rho' + c_rho'')
      with delta_rhoomega = delta_rhophi = 0, and
        m_rho+     = m_rho + Delta M_rho            (Delta M_rho = +1.0 MeV, fixed input)
        Gamma_rho+ = Gamma_rho - 1.8 MeV            (radiative, fixed input)
        rho(770) running width in f_+ :  Gamma * (s/m_rho+) * (beta_{pi+pi0}(s) / beta_{pi+pi-}(m_rho+^2))^3
      and rho', rho'' unchanged from the fitted values.
    ib_inputs:
      where: "main.tex:418"
      provenance: printed-num
      fidelity: verbatim
      quote: '$\Delta\Gamma_\rho=\Gamma_{\rho^0}-\Gamma_{\rho^\pm}=(1.8\pm 0.2) \text{ MeV}$ due to radiative corrections, $\Delta\Gamma_\rho=-1.07 \text{ MeV}$ due to $\Delta m_\pi$ in phase-space, $\Delta M_\rho=m_{\rho^\pm}-m_{\rho^0}=(1.0\pm0.9)\text{ MeV}$'
      used_for_all_models:
        where: "main.tex:620-621"
        quote: 'we use the same input for $\Delta\Gamma_\rho$ and $\Delta M_\rho$, as previously done'
      not_fitted:
        where: "main.tex:621 (footnote)"
        provenance: printed-num
        fidelity: verbatim
        quote: 'Our attempts of fitting also this information from the data yielded only upper bounds for $(\Delta M_{\rho}, \Delta\Gamma_\rho)$, consistent with our inputs.'
    pion_mass_in_weak_width:
      value: "beta_{pi+pi0}(s)^3 in the numerator of the rho(770) running width, with the normalisation beta_{pi+pi-}(m_rho^2)^3 KEPT"
      provenance: resolved
      where: "main.tex:111 (beta_PP'), :418 (-1.07 MeV); resolved against Tab. tab:IB_BR_CMD3 row 5 (main.tex:980)"
      evidence: >
        The paper never prints the weak width with beta_{pi+pi0}.  Two readings
        were tested.  (a) beta_{pi+pi0} replacing beta_{pi+pi-} in numerator AND
        normalisation gives Delta B row = +0.002e-2.  (b) numerator only gives
        -0.214e-2.  The printed KS value is -0.22e-2.  Reading (b) also gives an
        on-shell shift Gamma_rho+ - Gamma_rho0 = +1.068 MeV.  The paper prints
        this as "Delta Gamma_rho = -1.07 MeV due to Delta m_pi in phase-space"
        with Delta Gamma = Gamma_rho0 - Gamma_rho+, so the two agree to 3
        significant figures.  Reading (b) is therefore resolved.  Under it the
        -1.07 MeV is NOT applied as a separate shift, because it IS this effect.
    radiative_width_shift_applied_to:
      value: "the fitted constant Gamma_rho entering the rho(770) width of f_+"
      provenance: resolved
      evidence: "Gamma_rho -> Gamma_rho - 1.8 MeV reproduces the `pi pi gamma, electromagnetic decays` row: +0.372e-2 computed vs +0.38e-2 printed (main.tex:996)"
    neutral_or_charged_fitted_parameters: >
      The fitted m_rho, Gamma_rho are the NEUTRAL (e+e-) parameters (main.tex:163,
      "charged rho mesons parameters replacing the neutral ones").  Belle enters
      the same chi2 through f_+ built by the recipe above (chi2 eq.,
      main.tex:592-595).

  constants_not_printed:
    provenance: assumed
    values:
      m_pi_charged: 0.13957039
      m_pi_neutral: 0.1349768
      m_omega: 0.78266
      Gamma_omega: 0.00868
      m_phi: 1.019461
      Gamma_phi: 0.004249
    unit: GeV
    note: "PDG values.  The paper names these symbols but never gives numbers.  They do not enter f_+ except m_pi (the mixing is off in the weak form factor)."

