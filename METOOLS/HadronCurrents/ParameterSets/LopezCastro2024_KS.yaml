# One file is one fit is one citation.  Apply this set whole or not at all.
# Never substitute a mass, width or weight from a database or from another
# column / another parametrisation of the same paper.  The KS, GS and GP files
# from this paper share a source block and NOTHING else.

source:
  paper: "G. Lopez Castro, A. Miranda, P. Roig, Isospin breaking corrections in 2pi production in tau decays and e+e- annihilation: consequences for the muon g-2 and CVC tests"
  arxiv: "2411.07696"
  main_tex: "main.tex"
  note: >
    Extracted from the arXiv LaTeX source only (gzip -> tar -> main.tex, 1253
    lines, no \input; bib.bib alongside).  Line numbers refer to main.tex.
    Equation numbers are not used as locators; the line number is authoritative.
  siblings: []
  not_emitted: >
    The paper also fits GS, GP and dispersive forms. None is kept: GS and GP
    were extracted but could not pass closure from this paper alone (GS f(s),
    d and GP's chiral-loop functions are delegated to other papers), and were
    removed 2026-09-22; the dispersive fit is unresolved (no equation for the
    weak form factor f_+ is printed).

variant:
  taken: "Table tab:KS_Fit (main.tex:679-709), last column `Global fit 2` = BABAR12 + KLOEc + CMD3 + Belle tau (337+85+209+62 points)"
  rejected:
    - "BABAR12+Belle, KLOE12+Belle, KLOEc+Belle, CMD3+Belle (single e+e- experiment + Belle) columns"
    - "Global fit 1 (KLOE12 instead of KLOEc)"
  purpose: "closed-form weak form factor f_+(s) for tau- -> pi- pi0 nu_tau in Sherpa"
  why: >
    EVERY column of this table contains the Belle tau data, so "includes tau
    data" does not select a column.  The last column is the one the paper
    itself uses for all its downstream results, main.tex:599: "Using the
    results in the last column of the quoted tables for these models, we update
    the numbers in Table \ref{tab:IB_BR} for
    $\Delta\mathcal{B}^\mathrm{CVC}_{\pi\pi}$ and
    $\Delta a_\mu^{\mathrm{HVP,\,LO}}$."  The closure test below reproduces
    those downstream numbers from this column, which confirms the
    identification.  CAVEAT for a tau generator: in this column the tau part of
    the chi2 is 318.8 for 62 Belle points.  The best tau description in this
    table is BABAR12+Belle (chi2_tau = 122.7), but that column is not what the
    paper quotes.  Switching column is a physics decision for a human.  It must
    be a whole-column switch, never a per-parameter one.
  dagger_notation:
    where: "main.tex:438"
    provenance: printed-eq
    fidelity: verbatim
    quote: 'The $\dagger$ symbol means that a parameter was fixed in a given fit (the choice of fixed parameters differentiates the four fits shown), a notation that we will use throughout.'
    in_this_column: "No parameter carries a dagger in Global fit 2.  All 14 are fitted.  (The KLOE12/KLOEc/CMD3+Belle columns fix m_rho''=1730 MeV and Gamma_rho''=260 MeV with a dagger, and the three columns without CMD-3 fix |delta_rhophi| = 0 with a dagger.)"

applies_to:
  - channel: "-211,111,16"
    model: 10
applies_to_note: >
  The paper fits Belle tau- -> pi- pi0 nu_tau (62 points, full spectrum)
  simultaneously with e+e- -> pi+ pi- data.  This file carries the WEAK form
  factor f_+(s) built as the paper prescribes (see model.weak_form_factor).
  The electromagnetic F_V(s) of the same fit is recorded only to define it.
  Using it for e+e- channels is not claimed here.

