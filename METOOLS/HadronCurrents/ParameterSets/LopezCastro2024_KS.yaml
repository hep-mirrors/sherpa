  printed: false
  where_looked: "all tables (main.tex:364-1100) and text; no correlation or covariance matrix is printed for any fit"

closure:
  against: >
    The paper prints NO tabulated form factor or spectrum (all curves are
    figures).  The printed model outputs it DOES give are the row-by-row IB
    decompositions of Delta B_pipi^CVC (Tab. tab:IB_BR_CMD3, main.tex:968-1012,
    KS column) and Delta a_mu (Tab. tab:IB_amu_CMD3, main.tex:1052-1100).
    main.tex:354 says these are computed from the FITS, not the binned data, and
    main.tex:599 says from the last column.  Each row is
    B_e * int_{4m_pi^2}^{m_tau^2} ds sigma0(s) N(s) (1/R_IB^row - 1)  (eq. ibtpbr,
    main.tex:139-141), with sigma0 = (pi alpha^2/3s) beta^3_{pi+pi-} |F_V|^2 and
    R_IB^row = |F_V/f_+|^2 restricted to one IB source.  Rebuilt from THIS FILE
    alone plus PDG B_e = 0.1782, m_tau, alpha, pion masses (V_ud = 0.97367
    printed, main.tex:356).  Absolute, no rescaling.
  result: >
    Delta B^CVC rows (units 1e-2), computed vs printed:
      m_pi+- - m_pi0 on sigma   +0.196 vs +0.20  (model-independent weight check)
      m_pi+- - m_pi0 on Gamma   -0.214 vs -0.22
      m_rho+- - m_rho0          +0.088 vs +0.09
      rho-omega interference    -0.093 vs -0.09
      rho-phi interference      +0.000 vs -0.00
      pi pi gamma / em decays   +0.372 vs +0.38
    Ratios to the model-independent row (free of B_e, alpha and overall
    normalisation): -1.091 vs -1.10, 0.449 vs 0.45, -0.472 vs -0.45, 1.893 vs
    1.90.  On-shell weak-width shift from Delta m_pi: +1.068 MeV vs printed
    1.07 MeV.
    Delta a_mu rows (units 1e-10, with G_EM(s) = 1 because G_EM is not printed):
    sigma -7.23 vs -7.52, Gamma +3.88 vs +4.13, pipigamma -6.33 vs -6.49,
    rho-omega +4.08 vs +4.03, rho-phi +0.029 vs +0.03, Delta m_rho +0.034 vs
    -0.01.  a_mu^HVP,LO[pipi] from this fit: 503.8e-10 (paper quotes 517.0e-10
    from tau data, main.tex:1150).
    Discrete scans: complex prefactor 1+c'+c'' vs moduli gives 0.196 vs 0.057 on
    the sigma row (decisive).  Weak-width pion-mass reading numerator-only vs
    both gives -0.214 vs +0.002 (decisive).  s/m vs m^2/s running width gives
    0.196 vs 0.190 (not decisive; the printed form is kept).
  residual_explained: >
    The Delta B rows are low by a UNIFORM 2.1% (ratios 0.974-0.982; rho-omega
    1.03 lies inside its 1-digit rounding).  The ratios BETWEEN rows are right
    to <1%.  Per Step 3b, a uniform offset with correct ratios is a fault in the
    common weight B_e*sigma0*N, not in the form factor.  The weight contains
    three things this paper does not print: B_e (PDG, not quoted), the FSR(s)
    factor of Drees-Hikasa that dresses the fitted e+e- cross section (~+1% at
    the rho), and the paper's exact PDG constants.  The printed rows also carry
    2.5-5.6% rounding (two decimals on 0.09-0.38).  The Delta a_mu rows are low
    by a further ~2% (ratios 0.94-0.98).  That is expected: their weight also
    contains G_EM(s) (Miranda-Roig 2020, not printed), set to 1 here, and
    G_EM > 1 at low s where the kernel K(s) is large.  The one sign mismatch,
    Delta a_mu Delta m_rho (+0.034 vs -0.01), is a near-total cancellation
    between two regions of size ~4.  The paper quotes it as
    -0.01(+0.08/-0.00), so the gap is inside the printed uncertainty.  It sits
    at low s, which is exactly where G_EM = 1 is least accurate.  Nothing was
    tuned.
  status: accepted

