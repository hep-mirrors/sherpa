effective_poles:
  which: ["rho_1450.*", "c_rho1450.*", "rho_1700.*", "c_rho1700.*"]
  why: >
    The rho' and rho'' parameters swing far beyond their errors between data
    sets in the same table.  Gamma_rho' runs 447-717 MeV and Gamma_rho'' runs
    442-721 MeV (main.tex:697, :701).  Re c_rho' changes sign between Global fit
    1 and Global fit 2 (:698).  In this column Gamma_rho'' = 650 MeV at
    m = 1868 MeV, and KS and GS fitted to identical data put rho' 100 MeV apart
    (1547.5 vs 1443.7 MeV).  These are fit poles absorbing the region above the
    rho, not particles.  Never substitute database values.  rho(770): M and
    Gamma are well determined (0.1-0.2 MeV errors) but model-dependent.  KS and
    GS on the same data differ by 1.4 MeV in M and 1.2 MeV in Gamma, so they are
    not substitutable either.

