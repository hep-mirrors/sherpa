  chi2_per_dof: 5.0
  n_points: "337+85+209+62 = 693"
  n_free_params: 14
  p_value_caption:
    where: "main.tex:707"
    provenance: printed-num
    fidelity: verbatim
    quote: 'Fit results for the KS model using the $e^+e^-$ data sets and Belle $\tau$ decay measurements. \textcolor{black}{All two-sided p-values are smaller than $10^{-4}$.}'
  verdict: >
    POOR FIT, recorded as such.  chi2/dof = 5.0 and p < 1e-4.  Every KS column
    has p < 1e-4, including BABAR12+Belle (chi2/dof 1.3).  The tau part alone is
