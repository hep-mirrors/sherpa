closure:
  against: >
    Table VI of the paper (:1859-1928), the pion form factor squared
    |F_pi^-(s)|^2 in 62 bins of width 0.05 GeV^2 from s = 0.088 to
    3.125 GeV^2, with separate statistical and systematic errors.  Table VI is
    derived bin-by-bin from the measured Table V spectrum through Eq.(7)
    (caption, :1861-1869), and the fit of Eq.(11) was made to that same
    spectrum with NO free normalisation in this variant, so the comparison is
    ABSOLUTE - the model was evaluated from this file alone and not rescaled by
    anything.  Model evaluated at the bin centres, which is the paper's own
    convention for f(s_i; alpha) in Eq.(17) (:2036-2044) and for its numerical
    integration (:2820-2822, "The integration in Eq.~({\ref{eq:amu}) is carried
    out numerically by taking the sum of the integrand evaluated at the center
    of each bin.").
  result: >
    Where the paper is most precise, the agreement is sub-percent and absolute.
    The six best-measured bins (total relative error 0.7-1.0%) give
    model/table = 1.0049 (bin 11, s = 0.575, the rho peak, |F|^2 = 40.996 +-
    0.122 +- 0.269), 1.0035 (bin 12, s = 0.625), 0.9897 (bin 14), 0.9978
    (bin 10), 0.9709 (bin 13), 0.9965 (bin 7).  Mean model/table over the rho
    peak region 0.5 < s < 0.7 GeV^2 is 0.9943; over 0.4 < s < 1.0 it is 0.9891.
    Summed over all 62 bins with DIAGONAL stat (+) syst errors the chi2 is 90.7;
    the paper quotes 80/52 using the full covariance matrix it does not publish.
    Evaluating the model bin-averaged over each 0.05 GeV^2 bin instead of at the
    bin centre gives chi2_diag = 82.0, i.e. the bin-width effect is real but
    smaller than the residual below.  Above s ~ 1.6 GeV^2 the mean ratio falls
    to 0.939 (1.6 < s < 2.3) - see `residual_explained`.
  residual_explained: >
    Two causes, both of which the paper itself identifies, and neither of which
    was tuned away.

    (1) Below s ~ 1.6 GeV^2 the residual is a smooth, coherent 1-3% deficit with
    isolated bins up to 3 diagonal sigma (worst: bin 13, s = 0.675, ratio
    0.9709, pull -3.0, with its immediate neighbours at +0.35% and -1.03%).  The
    fit used a covariance matrix we do not have.  The paper states it at
    :2033-2035: "Since the unfolded mass spectrum has bin-by-bin correlations,
    the off-diagonal components of the covariance matrix $X$ are included in the
    $\chi^{2}$ evaluation:".  SVD unfolding (:1614-1619) leaves strong
    neighbour-to-neighbour anticorrelations, so a coherent few-percent offset
    and an isolated 3-sigma bin flanked by good ones are both cheap in their
    chi2 and expensive in a diagonal one.  This cannot be reproduced from
    published numbers: only the diagonal errors are printed.

    (2) Above s ~ 1.6 GeV^2 the residual is dominated by the rounding of
    |beta| to two significant figures.  |beta| = 0.15 has a half-digit of 0.005,
    i.e. 3.3% relative, and the sensitivity of |F|^2 to it grows away from the
    rho: a +0.005 shift alone moves |F|^2 by +0.9% at s = 0.575, +2.9% at
    s = 1.375, +7.4% at s = 1.975 and +12.9% at s = 2.175.  The observed
    deficits in that region are 6-12%, i.e. entirely inside the rounding floor.
    Quantified by scanning |beta| across its printed rounding interval with
    everything else held at the published values: |beta| = 0.145 gives
    chi2_diag = 241.2 and a mean ratio of 0.819 over 1.9 < s < 2.3, |beta| =
    0.150 gives 90.7 and 0.913, |beta| = 0.155 gives 52.5 and 1.016.  The
    printed value sits inside that interval and NOTHING IN THIS FILE HAS BEEN
    MOVED: 0.15 is what Table VII prints and 0.15 is what is recorded.  This is
    precisely what `sigfigs` is here for, and it is aggravated by the
    correlations - |beta| correlates at 0.52 with |gamma| and at 0.49 with
    phi_gamma - so the rounding errors do not average out.

    Quadrature sum of all ten half-digit rounding shifts: 0.89% at s = 0.575,
    1.49% at 0.875, 2.97% at 1.375, 7.67% at 1.975, 13.2% at 2.175.  Every
    observed residual is inside this band.

    Above s ~ 2.3 GeV^2 the paper's own errors reach 30-100% per bin
    (Table VI bins 47-62), so the ratios there test nothing; they are reported
    for completeness only.
  not_closed: >
    The paper's chi2 = 80/52 itself is NOT reproduced and cannot be, because the
    covariance matrix X is not published.  The value obtained here with diagonal
    stat (+) syst errors, 90.7 (bin-centre) or 82.0 (bin-averaged), is of a
    similar size, but that similarity is a coincidence of scale and is not
    claimed as agreement.
  scan_performed: >
    Discrete conventions scanned against Table VI rather than chosen by taste:
    numerator width constant vs running (90.7 vs 248.7), phase sign exp(+i phi)
    vs exp(-i phi) (90.7 vs 23012), prefactor complex 1+beta+gamma vs
    1+|beta|+|gamma| (90.7 vs 30757), k(s) unequal- vs equal-mass (90.7 vs
    94.5), m_pi in h and d charged/neutral/average (90.7 / 96.6 / 93.6), and the
    rejected all-free column with and without its |F(0)|^2 = 1.02 (89.3 vs
    212.2).  The first three are decisive and are recorded as `resolved`; the
    last two are not, and are recorded as `printed-eq` (k) and `assumed` (m_pi).

