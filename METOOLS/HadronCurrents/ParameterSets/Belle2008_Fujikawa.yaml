  # only unforgeable checks on the extraction.
  chi2_over_ndf_fixed:
    value: "80/52"
    provenance: printed-num
    where: "Tab. VII, :2227 and text :2163-2164"
    quote: 'The value of the $\chi^{2}$ per degree of freedom (NDF) is 80/52 for the fixed and 65/51 for the floated cases.'
    note: >
      NDF 52 = 62 bins of Table VI/Table V minus 10 free parameters, which
      confirms that all 62 bins were fitted.  This chi2 is NOT reproducible
      from published numbers: it uses the full covariance matrix X of the
      unfolded spectrum, which the paper does not print.
