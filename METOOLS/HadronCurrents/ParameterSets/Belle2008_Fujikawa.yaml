effective_poles:
  which: ["rho_1450.*", "rho_1700.*", "beta.*", "gamma.*"]
  why: >
    These are fitted effective poles absorbing the structure above the ground
    state, not particles, and the tell is the paper's own error bars.
    Gamma_rho' = 434 +- 16 +- 60 MeV carries a 60 MeV systematic; the positive
    systematic on |gamma| (+0.065) is nearly twice its central value (0.037);
    Gamma_rho'' = 164 +- 21 +89/-26 MeV has a positive systematic of 89 MeV;
    phi_gamma = 24 +- 9 +118/-28 degrees is effectively unconstrained by the
    systematics.  The paper also says the two interfere and trade against each
    other (:2319-2322): "For the  $\rho^{\prime}(1450)$, a slightly higher mass
    value than in the previous measurement is obtained. It is found that this
    value is sensitive to the value of the resonance parameters for the
    $\rho''(1700)$ since they both interfere."
    Consequence: a particle-database mass or width may NEVER be substituted for
    any of these.  rho(770) is a physical state (M and Gamma are determined to
    0.5 and 1.7 MeV total), but it too was fitted jointly with the rest and
    correlates at 0.58 with |F(0)|^2 and 0.39 with Gamma_rho, so it is not
    separable either: the set is applied whole.

assertions:
