# One file is one fit is one citation.  Apply this set whole or not at all.
# Never substitute a mass, a width or a weight from a database or another
# paper: every number below was fitted simultaneously under the conventions
# recorded in `model`, and the correlations are large (see `correlations`).

source:
  paper:    "M. Fujikawa et al. [Belle Collaboration], High-Statistics Study of the tau- -> pi- pi0 nu_tau Decay, Phys. Rev. D 78, 072006 (2008)"
  arxiv:    "0805.3773"
  main_tex: "tau2pi_Jounal_v8.3-pre.tex"
  note: >
    Extracted from the arXiv LaTeX source only.  All line numbers below refer
    to tau2pi_Jounal_v8.3-pre.tex as retrieved from arxiv.org/e-print/0805.3773
    (3667 lines, single .tex, no \input).  Displayed-equation numbers were
    obtained by counting numbered environments from the top of the file;
    the line number is the authoritative locator.

variant:
  taken:    "Table VII, second column - the fit with |F_pi(0)|^2 fixed to unity (:2193-2233, column headed `(fixed $|F(0)|^2$)` at :2211)"
  rejected: "Table VII, third column - the fit with all parameters allowed to float, |F_pi(0)|^2 = 1.02 +- 0.01 +- 0.04.  This is the fit the paper's own Figs. 10, 11(a) and 11(b) are drawn with."
  purpose:  "closed-form hadronic current for tau- -> pi- pi0 nu_tau in Sherpa METOOLS/HadronCurrents; F(0) = 1 is imposed by the consuming code."
  why: >
    The consumer imposes F(0) = 1 through the 1/(1 + beta + gamma) prefactor of
    Eq.(11), which is exactly the constraint under which the second column was
    fitted.  The third column floats |F_pi(0)|^2 to 1.02 and so carries a 2%
    overall normalisation that lives OUTSIDE the prefactor and that we have no
    parameter to hold: taking the third column's ten resonance parameters
    without its |F_pi(0)|^2 = 1.02 would be exactly the mix-and-match this file
    exists to prevent.  Verified numerically in `closure`: the third column
    reproduces Table VI only once multiplied by 1.02 (chi2_diag 89.3), and is
    1.7% low at the rho peak without it (chi2_diag 212.2), while the second
    column reproduces Table VI absolutely, with no rescaling (chi2_diag 90.7).
    The paper does not designate either fit as "best".  What it says is
    (:2169-2171) "The fit quality for the fixed case is slightly worse than that
    for the floated one." and (:2172-2175) "The curves shown in
    Figs.~\ref{unfold_pipi0}, \ref{Fpi} and \ref{Fpirho}(a) and \ref{Fpirho}(b),
    correspond to the case when the parameter $|F_{\pi}(0)|^{2}$ is floated, but
    the differences between the floated and the fixed cases are small."  Both
    variants are closed-form; neither has a binned component.  The choice here
    is driven solely by the F(0) = 1 constraint of the generator.

applies_to:
  - { channel: "-211,111,16", model: 101 }
# Model changed 2026-09-22 from 105 to 101 (Gounaris-Sakurai): model numbers
# now mean the functional form and this file carries the fit, so the retired
# FORM_FACTOR = 105 is exactly 101 with this set selected locally.

applies_to_note: >
  The paper fits this channel and no other.  It relates the same form factor
  to e+e- -> pi+ pi- through CVC (Eqs.(5)-(6)), but the e+e- form factor
  differs by isospin-violating corrections the paper enumerates and does NOT
  absorb into these parameters (appendix items (i)-(vii), :3040-3175), and in
  particular by rho-omega interference, which is a separate amplitude
  (:3139-3144) and is NOT part of this fit.  Using this set for an e+e-
  channel is a physics decision for a human, not an extraction.

model:
  form: gounaris_sakurai_coherent_sum
  n_poles: 3
  normalisation: "F(0) = 1, enforced by the 1/(1 + beta + gamma) prefactor of Eq.(11) together with BW^GS_i(0) = 1"
  rho_omega: "absent by construction - the paper states the omega(782) contribution is subtracted at the analysis level"
  rho_omega_evidence:
    where: ":3116-3119"
    provenance: printed-num
    fidelity: verbatim
    quote: 'Since in our data this intermediate $\omega(782)$ contribution is already subtracted at  the analysis level, we use the $s$-dependent correction factor provided by Flores-Tlalpa, which does not include the $\omega$ contribution.'

  equations:
    amplitude:
      where: "eq.(11), :1971-1975"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'F_{\pi}(s) = \frac{1}{1 + \beta +\gamma } (BW_{\rho} + \beta \cdot  BW_{\rho^{\prime}} +\gamma \cdot BW_{\rho^{\prime\prime}})\,,'
      note: >
        beta and gamma are complex; the paper says so at :1976-1978 -
        "where the parameters $\beta$ and $\gamma$ (denoting the relative
        magnitude of the two resonances) are in general complex."
        The prefactor uses the COMPLEX sum 1 + beta + gamma, as printed.
    lineshape:
      where: "eq.(12), :1982-1985"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'BW_{i}^{GS} = \frac {M_{i}^2  + d \cdot M_{i}\Gamma_{i}(s) } {(M_{i}^{2} - s) + f(s) - i \sqrt{s} \Gamma_{i}(s)}\,,'
      note: >
        See `model.numerator_width` below: the numerator as printed carries
        Gamma_i(s), but the value that reproduces Table VI is the CONSTANT
        Gamma_i.  That is a resolved convention, not a transcription.
    width:
      where: "eq.(13), :1988-1990"
      provenance: printed-eq
      fidelity: verbatim
      quote: '\Gamma_{i}(s) = \Gamma_{i}  \left( \frac{M_{i}^{2}}{s}\right) \left( \frac{k(s)}{k(M_{i}^2)}\right)^{3}\,.'
    momentum:
      where: ":1993-1994"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'Here, $ k(s)  =  \frac{1}{2} \sqrt{s} \beta_{-}(s)$ is the pion momentum in the $\pi^{-}\pi^{0}$ rest frame.'
    beta_minus:
      where: ":657-664"
      provenance: printed-eq
      fidelity: verbatim
      quote: '$\beta_{-}(s) =\lambda^{1/2}(1, m_{\pi^{-}}^{2}/s, m_{\pi^{0}}^{2}/s)$'
      quote_lambda: '$\lambda(x,y,z)=[x -(\sqrt{y} + \sqrt{z})^{2}] [x -(\sqrt{y} - \sqrt{z})^{2}]$.'
    f_of_s:
      where: "eq.(14), :1998-2005"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'f(s) & = & \Gamma^{}_i\,\frac{M^2_i}{k^3(M^2_i)} \left[\, k^2(s) \left( h(s) -h(M_{i}^2) \right) + (M_{i}^2 - s) k^2(M_{i}^2) \left.\frac{dh}{ds}\right|_{s=M^2_{i}} \,\right]'
    h_of_s:
      where: "eq.(15), :2007-2008"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'h(s) & = & \frac{2}{\pi} \frac{k(s)}{\sqrt{s}} \ln \left( \frac{\sqrt{s} + 2k(s)}{2m_{\pi}}\right) \,,'
    dh_ds:
      where: ":2011-2017"
      provenance: printed-eq
      fidelity: verbatim
      quote: '$ \left. dh/ds\right|_{M_{i}^{2}} = h(M_{i}^{2})  \left [ \left( 8k^2(M_{i}^{2}) \right)^{-1} - (2 M_{i}^{2})^{-1}    \right ] + (2 \pi M_{i}^{2})^{-1} $'
    d_constant:
      where: "eq.(16), :2022-2028"
      provenance: printed-eq
      fidelity: verbatim
      quote: 'd = \frac{3}{\pi} \frac{m_{\pi}^2} {k^2(M_{i}^2)} \ln\left( \frac{M_{i} + 2 k(M_{i}^2)} {2 m_{\pi}} \right) + \frac{M^{}_i} {2 \pi k(M^2_{i})} - \frac{m_{\pi}^2 M^{}_i} {\pi k^3(M^2_{i})}\,.'
      note: >
        d is per-resonance (it depends on M_i).  The paper states its purpose at
        :2030-2031 - "Note that the function $d$ is chosen so that the $BW^{GS}$
        function is unity at $s=0$~\cite{GS}."  See
        `model.normalisation_at_zero` for the caveat that this is exact only in
        the equal-mass form of k(s).

  width_convention:
    denominator:
      where: "eq.(12), :1984"
      provenance: printed-eq
      fidelity: verbatim
      quote: '{(M_{i}^{2} - s) + f(s) - i \sqrt{s} \Gamma_{i}(s)}\,,'
      note: >
        The imaginary part is sqrt(s)*Gamma_i(s), NOT M_i*Gamma_i(s).  A set
        carrying these Gamma values is invalid under an m0*Gamma denominator.
    running:
      where: "eq.(13), :1988-1990"
      provenance: printed-eq
      fidelity: verbatim
      quote: '\Gamma_{i}(s) = \Gamma_{i}  \left( \frac{M_{i}^{2}}{s}\right) \left( \frac{k(s)}{k(M_{i}^2)}\right)^{3}\,.'
      note: >
        The prefactor is (M_i^2/s), not (M_i/sqrt(s)).  Together with the
        sqrt(s) in the denominator this makes the imaginary part
        M_i^2 Gamma_i (k(s)/k(M_i^2))^3 / sqrt(s).  Both halves are recorded
        because either alone settles nothing.

  numerator_width:
    value: "constant Gamma_i (NOT the running Gamma_i(s) printed in Eq.(12))"
    provenance: resolved
    where: "eq.(12) as printed, :1983; resolved against Table VI (:1859-1928)"
    note: >
      Eq.(12) prints `M_{i}^2  + d \cdot M_{i}\Gamma_{i}(s)` in the numerator.
      Taken literally with the paper's own k(s) that is inconsistent with the
      paper's own statement at :2030-2031 that d makes BW^GS unity at s = 0:
      Gamma_i(s) = Gamma_i (M_i^2/s)(k(s)/k(M_i^2))^3 diverges as s -> 0, so no
      choice of d can normalise it.  The standard Gounaris-Sakurai numerator
      carries the constant width.  Settled by closure, not by taste: rebuilding
      this set with the constant Gamma_i gives chi2_diag = 90.7 over the 62 bins
      of Table VI and 1.005 at the rho peak, while the literal running-width
      numerator gives chi2_diag = 248.7 (same parameters, same everything else).
      That is a factor 2.7 in chi2 and it is the strongest discrete statement in
      the closure scan.

  phase_convention:
    value: "beta = |beta| * exp(+i * phi_beta), gamma = |gamma| * exp(+i * phi_gamma), phases in degrees"
    provenance: resolved
    where: "commented out in the source at :1979; resolved against Table VI (:1859-1928)"
    note: >
      The source contains the line `% $\beta=|\beta|e^{i\phi}$.` at :1979 - it is
      COMMENTED OUT and therefore does not appear in the published paper, which
      gives only |beta|, phi_beta, |gamma|, phi_gamma without defining how they
      combine.  Resolved by closure: exp(+i phi) gives chi2_diag = 90.7 against
      Table VI, exp(-i phi) gives chi2_diag = 23012.  Likewise the prefactor
      1/(1 + beta + gamma) uses the complex beta and gamma (chi2_diag = 90.7)
      and not their moduli (chi2_diag = 30757, and 0.57 at the rho peak).

  daughter_masses:
    in_k_of_s:
      value: "unequal m_pi- and m_pi0, via beta_-(s) = lambda^{1/2}(1, m_pi-^2/s, m_pi0^2/s)"
      provenance: printed-eq
      where: ":1993-1994 and :657-664"
      note: >
        Corroborated by the appendix, which counts the unequal-mass beta^3 in
        the width as a deliberate isospin-violating effect (:3129-3133):
        "The $\pi^-$ and $\pi^{0}$ mass difference also affects the $\beta^{3}$
        factor in the energy-dependent decay width (Eq.~\ref{eq:width}), which
        provides a positive shift".  So k(s) is genuinely the unequal-mass
        momentum, not a transcription slip.
    in_h_and_d:
      value: "a single m_pi, taken as m_pi- = 0.13957018 GeV"
      provenance: assumed
      where: "eq.(15), :2008 (`2m_{\\pi}`); eq.(16), :2023-2027 (`m_{\\pi}^2`)"
      note: >
        h(s) and d are printed with a single symbol m_pi, which the paper never
        assigns a numerical value.  Charged-pion mass assumed, because the
        logarithm 2k + sqrt(s) over 2 m_pi is the Gounaris-Sakurai elastic
        pi pi threshold.  The ambiguity is small and is quantified rather than
        hidden: m_pi0 in place of m_pi- moves |F|^2 by -0.15% at the rho peak
        and changes chi2_diag against Table VI from 90.7 to 96.6; the average of
        the two gives 93.6.  All three are far inside the residual explained in
        `closure`, so this choice is not load-bearing.
    numerical_values:
      value: "m_pi- = 0.13957018 GeV, m_pi0 = 0.1349766 GeV"
      provenance: assumed
      note: >
        The paper never prints pion masses.  PDG values used for the closure
        test.  Substituting the consuming code's own database values is safe
        here: |F|^2 at the rho peak moves by less than 0.05% for any pion-mass
        choice within 0.1 MeV of these.

  normalisation_at_zero:
    value: "F(0) = 1 exactly in the equal-mass GS construction; with the paper's unequal-mass k(s) the s -> 0 limit is singular, but s = 0 is below the physical threshold s > (m_pi- + m_pi0)^2 = 0.0754 GeV^2 and is never evaluated"
    provenance: inferred
    note: >
      Derivation: BW^GS_i(0) = 1 requires k^2(0) finite, which holds only for
      k(s)^2 = s/4 - m_pi^2.  With k(s) = (1/2) sqrt(s) beta_-(s) and unequal
      masses, k^2(s) -> +(m_pi-^2 - m_pi0^2)^2/(4s) -> +infinity as s -> 0, and
      both the numerator and f(s) diverge.  Checked numerically: with equal
      masses BW^GS_rho(0+) = 1.0000000002; with the paper's unequal masses
      |F(s)|^2 = 1.0063 at s = 1e-4, 1.0000 at 1e-8 in the equal-mass form but
      collapsing to 2e-6 in the unequal-mass form.  This is a statement about a
      point outside the physical region only.  The first data bin of Table VI is
      centred at s = 0.088 GeV^2 and the threshold is 0.0754 GeV^2, so nothing
      in the fit or in event generation samples the pathological region.  A
      consumer that needs a literal F(0) = 1 should use the equal-mass k in the
      GS auxiliary functions h, d and f only; that is what `in_h_and_d` already
      does for the logarithms.

