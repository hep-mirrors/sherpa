closure:
  status: ACCEPTED
  against: >
    The paper's own printed numerical output: the Q^2 zero-crossing of the
    6(-) distribution, Q^2 = 1.85609 GeV^2 (:1546), computed by the authors
    from this model to six significant figures.  Rebuilt FROM THIS FILE ALONE
    in numpy (~90 lines, no Sherpa, no scipy).
    Why this observable, and why only its Q^2 projection: Tab. tabla3 (:432)
    gives dGamma^-_6/dQ^2 ds_1 ds_2 = A(Q^2) (2/3) <K_2bar> Re(B_1* B_4^(-)),
    and under the paper's own assumptions (F_4 = 0, f_H real and flat with
    phi_H = pi/2, :452-464) Eq.(36) (:1477) reduces it to
    +(2/3) A(Q^2) <K_2bar> (sqrt(Q^2)/m_tau) Im(B_1) f^R_H eta^I_P.
    At fixed Q^2 every factor except Im(B_1) is CONSTANT over the Dalitz
    plot, so the projection onto Q^2 is
      [A(Q^2) <K_2bar>(Q^2) sqrt(Q^2) (2/3) f^R_H eta^I_P / m_tau]
      x  Integral ds_1 ds_2 Im(B_1),
    and its zero is the zero of Integral ds_1 ds_2 Im(B_1) alone.  The
    unavailable angular kernel <K_2bar>, the unavailable branching ratio, the
    unprinted m_tau, G_F, sin(theta_c) and the entire new-physics factor all
    drop out.  So does N, because B_1 = F_1 (p_1-p_3)^x + F_2 (p_2-p_3)^x and
    F_1, F_2 share the same N/F_pi.  The s_1 and s_2 projections are NOT
    usable: they integrate over Q^2 and so require <K_2bar>(Q^2).
    What is therefore tested: A, B, C, D, the two K_1 masses and widths and
    their CONSTANT-width line shape, the K*(892) mass, width, running-width
    convention and its placement on s_2, the rho/rho' tower with beta and its
    placement on s_1, the relative -2/(3 F_pi) vs -1/(sqrt3 F_pi) weights of
    F_1 and F_2, the s_1/s_2 ordering, and the coordinate frame.
    What is NOT tested: N, N_3, alpha, F_pi, the 5%/95% split, F_3 as a whole,
    and the absolute rate.  Those cannot be tested from this paper - the
    branching ratio and the angular kernels are not in it.  This is a weaker
    test than a spectrum: it is one number, and it is blind to every overall
    normalisation.  It is nevertheless sharp (six figures) and it is the only
    model output the paper prints in closed numerical form.
  result: |
    Integral ds_1 ds_2 Im(B_1) = 0  at  Q^2 = 1.85553 GeV^2
    paper                                    1.85609 GeV^2
    deviation                                -0.030 %  (-5.6e-4 GeV^2)
    Unique root over the whole physical range 0.597 < Q^2 < m_tau^2.
    Integration: Gauss-Legendre on the exact Dalitz boundary; the root is
    identical to five decimals at n = 80, 160, 240, 320 nodes, so the
    numerics are converged and contribute nothing to the residual.
    Integration region validated before use (Step 3b rule): the Gauss area at
    Q^2 = 2 GeV^2 is 0.670125 GeV^4 against 0.670518 GeV^4 from an
    independent Monte Carlo over the bounding box using p_1y^2 > 0, agreeing
    to the 0.06% MC error; and p_1^x + p_2^x + p_3^x = 0 to machine precision
    at interior points.
  discrimination: |
    The same root under deliberately wrong conventions, to show the test bites
    (all deviations from 1.85609):
      as published, this file                1.85553   -0.03 %
      K_1 given a running width              1.83746   -1.00 %
      m_R Gamma(s) instead of sqrt(s) Gamma(s)  1.83980   -0.88 %
      beta -> +0.145                         1.87982   +1.28 %
      D = 0 (K_1(1400) dropped from F_1)     1.80726   -2.63 %
      K* put on s_1, rho on s_2       1.61476 / 1.97408 / 2.24610 (three roots)
    Every wrong reading is 30-90x further out than the accepted one.
  residual_explained: >
    The meson masses.  m_K and m_pi are never printed in this paper (see
    not_in_this_paper.meson_masses) yet they enter p(s), p_R and the Dalitz
    boundary.  The residual is inside the spread they generate: with PDG
    values (m_K = 0.493677, m_pi = 0.13957) the root is 1.85553 (-0.030%);
    with the rounded m_K = 0.495, m_pi = 0.140 that a 2014 phenomenology code
    might equally carry, it is 1.85639 (+0.016%).  The published number lies
    between the two.  Nothing was tuned: PDG values were chosen first and kept.
    Two further contributions, both smaller and neither adjusted: the paper
    writes 'yields the values $Q^2\sim 1.85609$' with a tilde, i.e. its own
    numerical root-finding precision is not claimed to be exact; and its own
    simulated cross-check of the same quantity is 1.86 +- 0.04 GeV^2
    (Eq.(41)), so the residual is 1/70 of the paper's own resolution on it.
  not_closed: >
    Honest gap: the absolute normalisation N = 1.4088, N_3 = 1.4696 and the
    5%/95% split are NOT verified, and cannot be from this source.  Doing so
    needs the angular kernels <K_1>, <K_2> (only in Ref. [KA]) and the BaBar
    branching ratio (only in Ref. [Babar]), neither of which is printed here.
    The two numbers are transcribed, their convention is established from the
    paper's own equation chain (model.normalisation_convention), and their
    magnitude is unchecked.

