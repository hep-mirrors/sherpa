# One file is one fit is one citation.  Apply this set whole or not at all.
#
# Standard-Model hadronic model for tau- -> K- pi- pi+ nu_tau: the axial form
# factors F1, F2 and the anomalous (Wess-Zumino) F3 of Eqs.(21)-(29), with the
# inputs of Table tabla4.  The paper is a charged-scalar sensitivity study; its
# new-physics content (the pseudoscalar form factor f_H, the couplings eta_S,
# eta_P, the shift F4 -> F4 + f_H eta_P/m_tau, the CP-odd observables and the
# A2HDM section) is deliberately and completely EXCLUDED here - see
# `variant.rejected`.  Nothing in this file depends on it.
#
# READ `model.normalisation_convention` BEFORE USING N OR N_3.  The short
# answer: this paper's sin(theta_c) is EXPLICIT in the rate (Eqs.(1),(6)) and
# is NOT absorbed into N or N_3, so a current that carries its own Cabibbo
# factor uses N = 1.4088 and N_3 = 1.4696 exactly as printed, applying the
# Cabibbo factor once, alongside them.

source:
  paper: >
    N. Mileo, K. Kiers, A. Szynkman - Probing sensitivity to charged scalars
    through partial differential widths: tau -> K pi pi nu_tau decays.
    Title as printed at :89, where the final state is the macro
    \tauprocess; no journal reference appears in the source.
  arxiv:    "1410.1909"
  main_tex: "Paper.tex"
  note: >
    Extracted from the arXiv LaTeX source only (Paper.tex, 1718 lines, the
    v2/April-2015 source).  Line numbers below are ":<line>" into that file.
    NO other paper was consulted.  The paper leans heavily on four of them and
    every quantity that exists only by reference is marked `unresolved` and
    listed in `not_in_this_paper`.  Those references, resolved from Paper.bbl
    for the reader's benefit only:
      [CLEO]        D. M. Asner et al. (CLEO), Phys. Rev. D 62, 072006 (2000)
      [KA]          K. Kiers, K. Little, A. Datta, D. London, M. Nagashima,
                    A. Szynkman, Phys. Rev. D 78, 113008 (2008)
      [Kuhn]        J. H. Kuhn, E. Mirkes, Z. Phys. C 56, 661 (1992)
      [Decker]      R. Decker, M. Finkemeier, E. Mirkes, Phys. Rev. D 50, 6863 (1994)
      [Decker2]     R. Decker, E. Mirkes, R. Sauer, Z. Was, Z. Phys. C 58, 445 (1993)
      [Finkemeier]  M. Finkemeier, E. Mirkes, Z. Phys. C 69, 243 (1996)
      [Santamarina] J. H. Kuhn, A. Santamaria, Z. Phys. C 48, 445 (1990)
      [Babar]       B. Aubert et al. (BABAR), Phys. Rev. Lett. 100, 011801 (2008)

variant:
  taken: >
    The paper's single Standard-Model parameterisation of the form factors,
    Sec. "Parameterization of form factors" (:531-621): Eqs.(21)-(23) for
    F1, F2, F3, Eq.(24) for the K_1 propagators, Eqs.(25)-(28) for the K* and
    rho propagators, Eq.(29) for the rho tower, and ALL of Table tabla4
    (:586-615).  Together with F4 = 0 (:452-456) this is the complete SM
    hadronic model used to generate every event in the paper.
  rejected:
    - "Everything new-physics.  H^NP_eff with eta_S, eta_P (Eq.(2), :221); the shift F4 -> F4 + f_H eta_P/m_tau (:234); f_H (Eq.(4), :238); B_4 and B_4bar (Eqs.(11)-(12), :279, :288); the reference inputs |f_H eta_P| = 17.9 and 1.79 e^{i pi/4} (:472, :526); the CP-odd observables 5(-), 6(-), 7(-) (Tab. tabla3, :431-433); the whole A2HDM section (:1340-1456).  NONE of this enters any number in this file."
    - "The fitted parameters of Sec. V.D.  The paper re-extracts A and N_3 from its own simulated events (A = 0.91-0.95 in Tab. tabla8, :1195-1205; N_3 = 1.3-1.5 in Tab. tabla9, :1300-1302).  Those are outputs of a closure exercise on Monte Carlo data, with the input values of Table tabla4 as truth; they are NOT an improved determination and must not be substituted for the table."
  purpose: >
    A closed-form Standard-Model hadronic current for tau- -> K- pi- pi+
    nu_tau.  Every component of this variant is a function; nothing is binned
    or tabulated.  The purpose was stated in the task: supply the two
    normalisations N and N_3 that Ref. [CLEO] leaves arbitrary.
  why: >
    The paper presents ONE parameterisation of F1-F3 - there is no second fit
    to choose between, and no parameter of the SM model is varied anywhere in
    the paper.  The only choice to make is SM vs SM+NP, and the task asks for
    SM.

applies_to:
  - { channel: "-321,211,-211,16", model: 102 }

applies_to_note: >
  The paper fits/models exactly one final state, tau- -> K- pi- pi+ nu_tau
  (:207, :224), with p_1 = K-, p_2 = pi-, p_3 = pi+.  Nothing else is claimed.
  In particular the isospin-related modes K- pi0 pi0 and K0bar pi- pi0 are NOT
  covered: the paper never writes their currents, and the Clebsch factors and
  the rho/K* sub-chain content differ.  Extending this set to them is a
  physics decision for a human, not an extraction.

model:
  form: kaon_axial_K1_tower_plus_wess_zumino
  channel_ordering:
    where: ":224 and :234"
    provenance: printed-eq
    fidelity: verbatim
    quote_labels: |-
      The hadronic matrix element $J^{\mu}\equiv \langle K^-(p_1)\pi^{-}(p_2)\pi^+(p_3)|\bar{s}\gamma^{\mu}(1-\gamma_5)u|0\rangle$ can be conveniently parameterized in terms of four form factors as follows,
    quote_invariants: |-
      where $Q^{\mu}=(p_1+p_2+p_3)^{\mu}$, $T^{\mu\nu}=g^{\mu\nu}-Q^{\mu}Q^{\nu}/Q^2$, $s_1=(p_2+p_3)^2$ and $s_2=(p_1+p_3)^2$ and where we adopt the convention $\epsilon_{0123}=+1$, as in Refs.
    note: >
      p_1 = K-, p_2 = pi-, p_3 = pi+.  Hence s_1 = m^2(pi- pi+) is the RHO
      channel and s_2 = m^2(K- pi+) is the K* channel, and the third
      invariant s_3 = (p_1+p_2)^2 = m^2(K- pi-) never appears: the model has
      no K- pi- (exotic) sub-chain at all.  The epsilon convention
      eps_{0123} = +1 fixes the sign of the Wess-Zumino term.  Getting s_1
      and s_2 the wrong way round is not a small error: see `closure`, where
      putting the K* on s_1 moves the paper's printed zero-crossing by 13%
      and turns one root into three.
  equations:
    current:
      where: "eq.(3), :226-233"
      provenance: printed-eq
      fidelity: verbatim
      quote: |-
        J^{\mu} = \left[F_1(Q^2,s_1,s_2)(p_1-p_3)_{\nu}+F_2(Q^2,s_1,s_2)(p_2-p_3)_{\nu}\right]\!T^{\mu\nu}
      quote_cont: |-
        +iF_3(Q^2,s_1,s_2)\epsilon^{\mu\nu\rho\sigma}p_{1\nu}p_{2\rho}p_{3\sigma}+F_4(Q^2,s_1,s_2)Q^{\mu},
      note: >
        Four form factors.  F_4 is set to zero in this work (see
        model.F4_is_zero); F_1, F_2, F_3 are given in Eqs.(21)-(23).  NOTE the
        index placement as printed: (p_1-p_3)_nu contracted with T^{mu nu}, so
        the transverse projector acts on the momentum difference.
    F1:
      where: "eq.(21), :541"
      provenance: printed-eq
      fidelity: verbatim
      quote: |-
        F_1(Q^2,s_1,s_2)&=&-\frac{2N}{3F_{\pi}}[C\cdot BW_{1270}(Q^2)+D\cdot BW_{1400}(Q^2)]\,BW_{K^*}(s_2)
      note: "Axial, K* sub-chain (K- pi+).  Weights C, D on the two K_1 poles."
    F2:
      where: "eq.(22), :543"
      provenance: printed-eq
      fidelity: verbatim
      quote: |-
        F_2(Q^2,s_1,s_2)&=&-\frac{N}{\sqrt{3}F_{\pi}}[A\cdot BW_{1270}(Q^2)+B\cdot BW_{1400}(Q^2)]\,T^{(1)}_{\rho}(s_1)
      note: >
        Axial, rho sub-chain (pi- pi+).  Weights A, B on the two K_1 poles.
        The SAME N appears in F_1 and F_2, with FIXED relative coefficients
        -2/(3 F_pi) and -1/(sqrt3 F_pi): N is one number for the whole axial
        part and cannot be split between the two form factors.
    F3:
      where: "eq.(23), :545"
      provenance: printed-eq
      fidelity: verbatim
      quote: |-
        F_3(Q^2,s_1,s_2)&=&\frac{N_3}{2\sqrt{2}\pi^2 F^3_{\pi}}BW_{K^*}(Q^2)\left[\frac{T^{(1)}_{\rho}(s_1)+\alpha\,BW_{K^*}(s_2)}{1+\alpha}\right].
      note: >
        The anomalous Wess-Zumino term.  Overall sign is PLUS, unlike F_1 and
        F_2.  Note the K* propagator evaluated at the three-body mass Q^2 -
        that is the Q^2 dependence of the whole WZ term - and a second K*
        propagator at s_2 inside the bracket, weighted by alpha.  Three
        powers of F_pi here against one in F_1, F_2, so N_3 and N are NOT
        commensurable: they are normalisations of differently-dimensioned
        objects (F_3 carries two more inverse powers of mass than F_1, F_2, as
        Eq.(3) requires).
    K1_propagator:
      where: "eq.(24), :547-550"
      provenance: printed-eq
      fidelity: verbatim
      quote_intro: |-
        The normalized Breit-Wigner propagators for the $K_1(1270)$ and the $K_1(1400)$ appearing in the axial vector form factors $F_1$ and $F_2$ are assumed to be
      quote: |-
        BW_{K_1}(Q^2)=\frac{-m^2_{K_1}+im_{K_1}\Gamma_{K_1}}{Q^2-m^2_{K_1}+im_{K_1}\Gamma_{K_1}},
      note: >
        CONSTANT width.  "Normalized" means BW_{K_1}(0) = 1, which is what the
        numerator -m^2 + i m Gamma achieves; it is not a unit-residue
        convention.  There is NO running width for either K_1 anywhere in this
        paper - contrast the K* and rho, Eq.(26).  Substituting a running
        width here is a real error: it moves the paper's printed zero-crossing
        by -1.0% (see closure.discrimination), 30x the closure residual.
    KstarRho_propagator:
      where: "eqs.(25)-(28), :552-568"
      provenance: printed-eq
      fidelity: verbatim
      quote_intro: |-
        The Breit-Wigner propagators for the $K^*$ and $\rho$ are taken to have energy-dependent widths (see Refs.
      quote: |-
        BW_R(s)=\frac{-m^ 2_R}{s-m^ 2_R+i\sqrt{s}\Gamma_R(s)},
      quote_p: |-
        p&=&\frac{1}{2\sqrt{s}}\sqrt{[s-(m_1+m_2)^ 2][s-(m_1-m_2)^ 2]}
      quote_pR: |-
        p_R&=&\frac{1}{2m_R}\sqrt{[m^ 2_R-(m_1+m_2)^ 2][m^ 2_R-(m_1-m_2)^ 2]}
      note: >
        Also normalised to BW_R(0) = 1 by the -m_R^2 numerator.  p and p_R are
        the two-body momenta of Eqs.(27)-(28); ":569" states 'In the above
        expressions the decay of the resonance $R$ to two particles with
        masses $m_1$ and $m_2$ is assumed.'
    rho_tower:
      where: "eq.(29), :569-572"
      provenance: printed-eq
      fidelity: verbatim
      quote_intro: |-
        For the $K^*$, a single resonance with an energy-dependent width is assumed while the expression for the $\rho$ includes two different resonances:
      quote: |-
        T^{(1)}_{\rho}(s_1)=\frac{BW_{\rho}(s_1)+\beta BW_{\rho\prime}(s_1)}{1+\beta}.
      note: >
        Two poles only - no rho''.  The 1/(1+beta) prefactor keeps
        T^(1)_rho(0) = 1, so beta = -0.145 ENHANCES the tower by 1/0.855 =
        1.169 relative to a bare rho while subtracting the rho' with a
        relative minus sign.  beta is locked to N: changing its sign alone
        moves the printed zero-crossing by +1.3%.
  width_convention:
    K1_1270_and_K1_1400:
      denominator:
        where: "eq.(24), :550"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          Q^2-m^2_{K_1}+im_{K_1}\Gamma_{K_1}
      running:
        value: "none - the width is constant, Gamma_{K_1}(Q^2) = Gamma_{K_1}"
        provenance: printed-eq
        where: "eq.(24), :550; the paper contrasts it at :552 by saying the K* and rho widths are the energy-dependent ones"
      note: >
        Both halves: m_0 * Gamma with a CONSTANT Gamma, i.e.
        Im(denominator) = m_{K_1} Gamma_{K_1}, independent of Q^2.  Any
        Gamma(s) substituted here is a different model.
    Kstar_892_and_rho_and_rhoprime:
      denominator:
        where: "eq.(25), :555"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          s-m^ 2_R+i\sqrt{s}\Gamma_R(s)
      running:
        where: "eq.(26), :560"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          \Gamma_R(s)=\Gamma_R\frac{m^2_R}{s}\left(\frac{p}{p_R}\right)^3,
      note: >
        Both halves: sqrt(s) * Gamma(s) with Gamma(s) = Gamma (m_R^2/s)(p/p_R)^3,
        so Im(denominator) = Gamma_R (m_R^2/sqrt(s))(p/p_R)^3.  This is the
        Kuehn-Santamaria form.  It is NOT the same as m_R Gamma(s) with the
        same Gamma(s), and the two were evaluated rather than assumed to
        differ: with the rho parameters of Table tabla4 (m = 0.773,
        Gamma = 0.145, pi pi daughters), Im(denominator) at
        s = 0.5, 0.5975 (= m_rho^2), 1.0, 1.5 GeV^2 is
          sqrt(s) Gamma(s) : 0.08971, 0.11208, 0.20482, 0.32030 GeV^2
          m_R     Gamma(s) : 0.09806, 0.11208, 0.15832, 0.20216 GeV^2
        - identical on the pole by construction, 58% apart at 1.5 GeV^2.
        Using this set's Gamma values under the m*Gamma(s) reading moves the
        paper's printed zero-crossing by -0.88%, 29x the closure residual.
    daughter_masses:
      value: "rho, rho' -> pi pi (m_1 = m_2 = m_pi); K* -> K pi (m_1 = m_K, m_2 = m_pi), in ALL THREE places a K* propagator appears: F_1(s_2), F_3(Q^2), F_3(s_2)"
      provenance: inferred
      where: ":569 ('the decay of the resonance $R$ to two particles with masses $m_1$ and $m_2$ is assumed')"
      note: >
        The paper never names the daughters of each R explicitly.  The only
        reading consistent with :569 and with the sub-chains of Eqs.(21)-(23)
        is rho -> pi pi and K* -> K pi.  Confirmed by closure: with these
        masses the printed zero-crossing comes out to 0.03%.  The K*
        propagator evaluated at Q^2 in F_3 is a two-body K pi width
        extrapolated far above threshold, up to Q^2 = m_tau^2; that is
        Ref. [Decker]'s form and the paper adopts it unchanged (:574).
  F4_is_zero:
    where: ":452-456"
    provenance: printed-eq
    fidelity: verbatim
    quote: |-
      First of all, note that the SM scalar form factor $F_4$ is generally assumed to be small for $\tau\rightarrow K\pi\pi\nu_{\tau}$, since there are no pseudoscalar resonances that mediate this decay. Therefore, we will neglect this contribution by setting $F_4=0$.
    note: >
      This is a Standard-Model statement, not a new-physics one, and it is
      part of the model: the SM current here has NO scalar (Q^mu) component.
      The paper's own reason, from :234, is that 'there is no pseudoscalar
      resonance through which the decay can proceed'.
  normalisation_convention:
    cabibbo_factor:
      value: "EXPLICIT.  sin(theta_c) appears in the Hamiltonian and sin^2(theta_c) in the rate; it is NOT absorbed into N or N_3."
      provenance: resolved
      where: "eq.(1), :212-216 and eq.(6), :259-262; the chain that closes it is eq.(3) :226-233 -> eqs.(8)-(11) :273-279 -> eq.(5) :247-256"
      fidelity: verbatim
      quote_hamiltonian: |-
        \mathcal{H}^{\mathrm{SM}}_{\mathrm{eff}}=\frac{G_F}{\sqrt{2}}\sin\theta_c\,[\bar{\nu}_{\tau}\gamma_{\mu}(1-\gamma_5)\tau]\,[\bar{s}\gamma^{\mu}(1-\gamma_5)u]+\mathrm{h.c.},
      quote_rate_prefactor: |-
        A(Q^2)=\frac{G^2_F\sin^2\theta_c}{128(2\pi)^5}\frac{(m^2_{\tau}-Q^2)^2}{m^3_{\tau}Q^2},
      evidence: >
        The convention is closed, with nowhere else for a CKM factor to hide.
        The rate, Eq.(5), is A(Q^2)/(4 pi) times a bracket built ONLY from
        B_1..B_4; Eqs.(8)-(11) build B_1..B_4 ONLY from F_1..F_4, f_H, momenta
        and sqrt(Q^2); Eqs.(21)-(23) build F_1..F_3 ONLY from N, N_3, F_pi,
        A-D, alpha, beta and Breit-Wigners.  The single Cabibbo factor in the
        whole chain is the sin^2(theta_c) of A(Q^2), inherited from the
        Hamiltonian Eq.(1).  Therefore N and N_3 were fixed (by matching the
        branching ratio, see below) in a convention in which the Cabibbo
        factor is carried separately.
      consumer_instruction: >
        A current that already carries its own Cabibbo / V_us factor must use
        N = 1.4088 and N_3 = 1.4696 EXACTLY AS PRINTED and apply the Cabibbo
        factor once, alongside them.  Do not divide N by sin(theta_c), do not
        multiply it in, and do not apply it twice.  This differs from
        Ref. [KA] (Kiers et al. 2008), whose N/N_3 pair was quoted in a
        convention with no explicit CKM factor; the two are numerically
        different objects even though the criterion used to fix them (5%/95%)
        is the same.  The paper recomputed them here (:574) against a
        different, BaBar, branching ratio.
      cabibbo_value: "NOT PRINTED.  No numerical value of theta_c, sin(theta_c) or V_us appears anywhere in Paper.tex.  The consumer supplies it; see not_in_this_paper."
    what_N_multiplies:
      value: "N multiplies the FORM FACTORS F_1 and F_2 (one power of 1/F_pi each); N_3 multiplies the form factor F_3 (one power of 1/F_pi^3).  Neither multiplies the amplitude or the width."
      provenance: printed-eq
      where: "eqs.(21)-(23), :541-545"
      note: >
        Explicitly: F_1 = -(2N/(3 F_pi)) [...], F_2 = -(N/(sqrt3 F_pi)) [...],
        F_3 = (N_3/(2 sqrt2 pi^2 F_pi^3)) [...].  Since the width is quadratic
        in the form factors (Eq.(5) uses |B_i|^2), N enters the axial part of
        the rate as N^2 and N_3 the anomalous part as N_3^2.  F_pi = 93.3 MeV
        (Table tabla4) - the F_pi ~ 93 MeV normalisation, NOT f_pi ~ 130 MeV.
        Inserting 130 MeV would change the axial rate by (93.3/130)^2 = 0.51
        and the anomalous one by (93.3/130)^6 = 0.13.
    how_N_was_fixed:
      value: "5% of the tau -> K pi pi nu width ascribed to F_3, 95% to F_1 and F_2, against the BaBar branching ratio of Ref. [Babar]"
      provenance: printed-num
      where: ":574"
      fidelity: verbatim
      quote: |-
        Regarding the parameters $N$ and $N_3$ that regulate the contributions coming from the axial and anomalous form factors, respectively, we apply the criteria proposed in Ref.~\cite{KA}, in which $5\%$ of the $\tau\rightarrow K\pi\pi\nu_{\tau}$ width is ascribed to the $F_3$ term and the remaining $95\%$ to the $F_1$ and $F_2$ terms. For this computation, we have used the value of the branching ratio $\mathcal{B}(\tau\rightarrow K\pi\pi\nu_{\tau})$ obtained in \cite{Babar}, which is the most precise one at present (see Refs.
      note: >
        So YES, N and N_3 are tied to a particular measured rate: the BaBar
        branching fraction of B. Aubert et al., PRL 100, 011801 (2008).  Its
        numerical VALUE is not printed in this paper (see
        not_in_this_paper.branching_ratio), so the normalisation cannot be
        re-derived from this source; it can only be taken as given.
        Consequences for use:
        (a) N and N_3 are a PAIR fixed by one condition each on the same
            total.  Rescaling one without the other changes the 5%/95% split.
        (b) They are fixed jointly with A, B, C, D, alpha, beta and every
            mass and width in Table tabla4, because those determine the two
            partial widths being normalised.  Changing any of them (for
            instance substituting PDG K_1 parameters) invalidates N and N_3.
        (c) The 95% is the AXIAL total, F_1 plus F_2 including their
            interference, not F_1 alone.
        (d) The split is a modelling criterion imported from Ref. [KA], not a
            measurement: the paper offers no uncertainty on the 5%.
    normalisation_of_the_plots:
      value: "the paper's distributions are normalised to the total tau width, via the measured branching ratio"
      provenance: printed-eq
      where: "fig. caption :1136 and eq.(Apeq1), :1667-1679"
      fidelity: verbatim
      quote: |-
        We note that the presence of the branching ratio ($\mathcal{B}_{\tau\rightarrow K\pi\pi\nu_{\tau}}$) arises from the fact that we have normalized the observables to the total decay width ($\Gamma_{\mathrm{tot}}$).
      note: >
        Relevant only to reading the paper's figures; no effect on the form
        factors themselves.
  coordinate_frame:
    value: >
      B_1, B_2, B_3 are the x, y, z components of the hadronic current in the
      hadronic (Q) rest frame, with the three mesons in the x-y plane, the
      x axis along p_3 (the pi+), and z normal to the decay plane.
    provenance: resolved
    where: "eqs.(8)-(10), :273-277; the frame itself is defined only in Refs. [KA],[Kuhn] (:270)"
    fidelity: verbatim
    quote_B1: |-
      B_1&=&[F_1(p_1-p_3)^x+F_2(p_2-p_3)^x]
    quote_B2: |-
      B_2&=&(F_1-F_2)p^y_1
    quote_B3: |-
      B_3&=&F_3\sqrt{Q^2}\,p^y_1p^x_3
    evidence: >
      Two independent derivations from the paper's OWN equations, neither
      needing the cited papers.
      (1) Eq.(3) gives the transverse part of J as the 3-vector
      F_1(p_1-p_3) + F_2(p_2-p_3) in the Q rest frame.  Its y component is
      F_1(p_1^y - p_3^y) + F_2(p_2^y - p_3^y); with p_1 + p_2 + p_3 = 0 this
      equals (F_1 - F_2) p_1^y, as Eq.(9) states, if and ONLY IF p_3^y = 0
      and p_2^y = -p_1^y.  So the x axis lies along p_3.
      (2) With that frame, a direct numerical evaluation of
      eps^{mu nu rho sig} p_{1 nu} p_{2 rho} p_{3 sig} with eps_{0123} = +1
      (as :234 specifies) gives (0, 0, 0, sqrt(Q^2) p_1^y p_3^x) exactly -
      ratio 1.000000 over random configurations - which is Eq.(10).
      The overall orientation (x along +p_3 or -p_3, and the sign of the y
      axis) is not fixed by this and flips the sign of B_1, B_2, B_3
      together; it cancels in every observable in the paper and in the
      closure test below.
    note: >
      Needed to evaluate B_1 and hence to reproduce the paper's printed
      zero-crossing.  Without it nothing in Eqs.(8)-(10) is computable, since
      Refs.[KA],[Kuhn] were not consulted.

parameters:
  # Table tabla4 (:576-621).  Caption (:576-577) read first: "The left table
  # (a) lists the dimensionless parameters while the right table (b) shows the
  # masses and widths of the various resonances, along with the pion decay
  # constant ($F_{\pi}$)."  It carries no normalisation instruction and no
  # per-mode or doubling caveat.  NO uncertainties are printed on ANY of these
  # numbers, anywhere in the paper.
  alpha:
    value: -0.2
    sigfigs: 1
    provenance: printed-num
    where: "Tab. tabla4(a), :586"
    origin: taken_from_elsewhere
    enters: "eq.(23) ONLY - the Wess-Zumino form factor F_3"
    note: >
      alpha weights the K*(s_2) sub-chain of the WZ term against the rho(s_1)
      sub-chain, inside [T^(1)_rho(s_1) + alpha BW_{K*}(s_2)]/(1+alpha).
      So: the rho chain has weight 1, the K* chain weight alpha = -0.2.  It
      therefore SUPPRESSES the K* sub-chain to 20% of the rho sub-chain AND
      flips its relative sign.  The 1/(1+alpha) = 1.25 prefactor then scales
      the whole WZ term up by 25% relative to alpha = 0, so alpha is locked to
      N_3: the pair was fixed together by the 5% criterion.  alpha does NOT
      appear in F_1 or F_2, so it has no effect on the axial part and is NOT
      tested by the closure below.  Attribution: F_3 follows Ref. [Decker]
      (:574).  One significant figure.
  beta:
