attribution:
  where: ":574"
  fidelity: verbatim
  quote: |-
    All the reference values related to the form factors $F_1-F_3$ used in our analysis are listed in Table \ref{tabla4}. Among them, those corresponding to the form factors $F_1$ and $F_2$ are based  on Ref.~\cite{CLEO}.
  quote_F3_and_rho: |-
    For the form factor $F_3$ we follow Ref.~\cite{Decker}, whereas for the $\rho$ and $\rho'$ resonances the input values are guided by Refs.~\cite{Finkemeier,Santamarina}.
  resolved: >
    Per the paper's own attribution: A, B, C, D and the two K_1 masses and
    widths are 'based on' Ref. [CLEO] = Asner et al. (CLEO), PRD 62, 072006;
    alpha and the functional form of F_3 'follow' Ref. [Decker] = Decker,
    Finkemeier, Mirkes, PRD 50, 6863; the rho and rho' masses, widths and
    beta are 'guided by' Ref. [Finkemeier] = Finkemeier & Mirkes, ZPC 69, 243
    and Ref. [Santamarina] = Kuhn & Santamaria, ZPC 48, 445; N and N_3 are
    this paper's own, computed by the criterion of Ref. [KA].
  unresolved_Kstar: >
    The K*(892) mass and width are NOT attributed.  They belong to no clause
    of the sentence at :574: the K* appears in both F_1 (a [CLEO] quantity)
    and F_3 (a [Decker] quantity), and the rho/rho' clause does not cover it.
    The values are printed, so nothing is missing for use; only their
    provenance is unstated.  Note in passing that this paper PRINTS the rho,
    rho' and K* inputs, which is why it is worth having: :574 says the F_1/F_2
    values are 'based on' [CLEO], but [CLEO] was not consulted here and this
    file makes no claim about what is or is not in it.

effective_poles:
  which: ["rhoprime_1370.m", "rhoprime_1370.Gamma"]
  why: >
    The rho(1450)/rho' of a Kuehn-Santamaria tower is a fitted effective pole
    absorbing the continuum above the rho, not a state: 1.370 GeV with a
    510 MeV width and a weight beta = -0.145 whose sign is a fit artefact.  A
    database rho(1450) must NOT be substituted for it - beta was fixed with
    this pole in place, and beta in turn ties into N.
  physical_but_not_substitutable: >
    The K_1(1270), K_1(1400), K*(892) and rho(770) entries ARE physical
    states, but they too must not be replaced by database values: A, B, C, D,
    N and N_3 were all fixed with exactly these numbers, and the paper reports
    (:852-859) that moving the K_1 parameters within their quoted
    uncertainties worsens its description.  Substitute nothing; take the set
    whole.
  no_uncertainties: >
    The paper prints NO uncertainty on any entry of Table tabla4, so the usual
    tell (a width with a 60 MeV systematic) is unavailable.  The
    classification above rests on the role each pole plays in the tower.

correlations:
  printed: false
  note: >
    No correlation matrix anywhere.  Table tabla4 is a set of reference INPUTS
    collected from other papers plus two numbers derived here, not the output
    of a fit in this paper, so there is no covariance to print.  The paper
    does compute correlations among its own re-fitted parameters (:1168-1170,
    :1246-1249) but prints no matrix, and those fits are rejected above.
    What matters for reuse is a hard functional dependence rather than a
    statistical one: N and N_3 are functions of everything else in the table
    (see model.normalisation_convention.how_N_was_fixed).

