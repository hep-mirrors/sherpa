# One file is one fit is one citation.  Apply this set whole or not at all.
#
# STATUS: NOT ACCEPTED.  Closure against the paper's own widths misses by
# -0.30% (FSI off) and -0.58% (FSI on), uniformly in both K pi submodes, with
# the submode ratio right to 0.03%.  The paper quotes its numerics to 0.005%.
# The residual is localised (see `closure`) but NOT explained.  Do not wire
# this set into a generator until a human has reviewed `closure`.

source:
  paper:    "O. Shekhovtsova, T. Przedzinski, P. Roig, Z. Was, Resonance chiral Lagrangian currents and tau decay Monte Carlo, Phys. Rev. D 86 (2012) 113008"
  arxiv:    "1203.3955"
  main_tex: "tau3scal_update_checked.tex"
  note: >
    Extracted from the arXiv LaTeX source only.  Line numbers refer to
    tau3scal_update_checked.tex (3130 lines).  The paper implements, without
    refitting, the K pi vector form factor of an earlier paper (Ref.
    Jamin:2008qg, 'Eq.(5)', :809) and prints the numerical defaults of its
    FORTRAN in App. C.  That earlier paper was NOT consulted: everything here
    is what 1203.3955 itself prints.

variant:
  taken: >
    The default K pi current, FFKPIVEC = 1 (:2692), i.e. Eq.(VFFKpi)
    (:815-824) with FSI on (FFVEC = 1), widths Eq.(kstarwidth_nosu3)
    (:881-888) and the K*' width (:898-904), and the rows of Table
    Variation_of_Parameters1 WITHOUT a dagger whose channel column contains
    2,3: M_K* = 0.8953 (`mkst`, :2879), Gamma_K* = 0.0475 (:2882),
    Gamma_K*' = 0.206 (:2884), M_K*' = 1.307 (:2886), gamma_Kpi = -0.043
    (:2895), plus F (:2889) and m_eta (:2771).
  rejected:
    - "FFKPIVEC = 0, the dispersive form of Ref. Boito:2008fq Eqs.(17)-(18) with the dagger-marked parameters (:2881, :2883, :2885, :2887, :2896). Its functional form is NOT printed in this paper (only cited, :812, :1575-1578) and it needs a subtraction constant H_t0 and F_K (:2744-2751): not extractable from this source."
    - "FFVEC = 0 (FSI off). Used below as a closure point only."
    - "M_K*+- = 0.89166 and M_K*0 = 0.8961 (:2877-2878), which the table also marks as used in channels 2,3. Eq.(VFFKpi) contains a single M_K*, and the separate row `mkst` = 0.8953 is labelled for channels 2,3; inserting 0.89166 instead moves the FSI-off width by -2.7%, far outside the closure."
  purpose: "closed-form tau- -> K pi nu_tau vector form factor for Sherpa METOOLS/HadronCurrents, model 201."
  why: >
    FFKPIVEC = 1 is the paper's default (:2692, :1576) and the only K pi form
    it prints in full.  The FFKPIVEC = 0 alternative is delegated to another
    paper and cannot be reconstructed from this one.

applies_to:
  - { channel: "-321,111,16", model: 201 }

applies_to_note: >
  The paper gives this set for BOTH pi0 K- and pi- K0bar (channels 2 and 3,
  N^{pi0 K-} = 1/2 and N^{pi- K0bar} = 1/sqrt2, :285).  Only K- pi0 is
  claimed.  The pi- K0bar amplitude is fully specified here, but Sherpa's keys
  are "310,-211,16" (K_S pi-) and "-211,130,16" (pi- K_L), and the paper
  never states how its K0bar amplitude is projected onto K_S / K_L - it only
  labels histogram axes 'pi- K_S^0 invariant mass' (:1636) - and nothing in
  its definitions forces a projection.  Mapping K0bar onto K_S/K_L (amplitude
  1/sqrt2 each, neglecting CP violation) is a physics decision for a human.
  If taken, it is a claim about the generator, not about this paper, and the
  pi- K0bar closure numbers below apply to the K0bar state.

model:
  form: rcht_kstar_kstarprime_common_omnes
  n_poles: 2
  normalisation: >
    F(0) != 1: the paper says so (:825, 'Note that due to the FSI effects,
    the form factor F^V_{K pi}(0) != 1'), because A_{K pi}(s) diverges like
    1/s for unequal masses so that s*Re A tends to a constant.  With FSI off
    F(0) = 1 exactly.  NOTE: the printed Jbar is numerically unstable for
    s -> 0 at unequal masses (catastrophic cancellation of O(Delta/s) terms);
    evaluate below s ~ 1e-3 GeV^2 with care.  s = 0 is outside the physical
    region (s >= (m_K + m_pi)^2 = 0.40 GeV^2) and is never sampled.
  current:
    where: "tau3scal_update_checked.tex:268 and :285"
    provenance: printed-eq
    fidelity: verbatim
    quote: |-
      J^\mu  = N \left[ \left(p_1 - p_2-\frac{\Delta_{12}}{s}(p_1+p_2)\right)^\mu F^{V}(s) + \frac{\Delta_{12}}{s}(p_1 + p_2)^\mu F^{P}(s) \right],
    quote_N: |-
      N^{\pi^-\pi^0} = 1 , \, \, N^{K^-K^0} = \frac{1}{\sqrt{2}} ,\, \, N^{\pi^- \bar K^0} = \frac{1}{\sqrt{2}}, \, \, N^{\pi^0 K^-} = \frac{1}{2}\,.
    note: >
      F^P = 0: 'Also for the K pi mode we restrict ourselves at first to the
      vector form factor only' (:734-735).  With physical masses Delta_12 != 0,
      so the (p1-p2) - (Delta/s) q structure matters: only the transverse
      vector part is present.  Overall rate normalisation as resolved in the
      pi pi file: |C|^2 = 2 N^2 (= 1/2 for K- pi0, 1 for pi- K0bar).
  cabibbo:
    value: "sin(theta_C) = sqrt(1 - 0.975^2) = 0.22220"
    provenance: inferred
    where: "tau3scal_update_checked.tex:313-315 (odd number of kaons -> sin theta_Cabibbo, stated for three mesons) and Tab. Constants :2766 (only cos theta_C = 0.975 printed)"
    note: "Not printed for two mesons and no value of sin(theta_C) is printed anywhere.  This is the single most likely home of the unexplained uniform residual; see closure."
  vector_form_factor:
    where: "eq.(VFFKpi), tau3scal_update_checked.tex:815-824"
    provenance: printed-eq
    fidelity: verbatim
    quote: |-
      \left(\frac{M^2_{K^*}+s\gamma_{K\pi}}{M^2_{K^*}-s-iM_{K^*} \Gamma_{K^*} (s)} -  \frac{s\gamma_{K\pi}}{M^2_{K^{*\prime}}-s-iM_{K^{*\prime}} \Gamma_{K^{*\prime}} (s)} \right) \\
    quote_exponent: |-
      \frac{-s}{128\pi^2 F^2} \biggl[Re A_{K\pi}(s) + Re A_{K\eta}(s)  \biggr] \Biggr\} . \nn
    note: >
      One COMMON Omnes exponent multiplies both resonances (contrast the pi pi
      form; :3069 says 'the exponential is a common factor in Eq. (VFFKpi)').
      1/128 = (3/4)(1/96), i.e. N_loop^{K pi} = N_loop^{K eta} = 3/4 (:749).
      A_PQ, Jbar, mu as printed in App. A (:2216-2244) - quoted in full in
      Shekhovtsova2012_pipi.yaml, identical here, with (m_P, m_Q) = (m_K, m_pi)
      and (m_K, m_eta).
  form_factor_masses:
    value: "isospin-averaged m_pi = (m_pi0 + 2 m_pi+)/3 = 0.13804, m_K = (m_K0 + m_K+)/2 = 0.495663 GeV in the form factor (widths AND loops), for both submodes; physical masses only in phase space"
    provenance: printed-eq
    where: "tau3scal_update_checked.tex:350-354"
    fidelity: verbatim
    quote: |-
      In the model the results for all hadronic currents, with the exception of  two-pion and two-kaon modes, are calculated in the isospin limit, therefore the corresponding hadronic form factors depend only  on the average pion
    note: >
      K pi is not among the exceptions.  Confirmed by closure: with averaged
      form-factor masses the ratio Gamma(pi- K0bar)/Gamma(K- pi0) is 1.92366
      (FSI on) vs the paper's 1.92425 and 1.92162 (FSI off) vs 1.92205;
      with physical masses inside A_{K pi} it is 1.9075, 0.9% off.
  mu_renormalisation_scale:
    value: "mu = 0.775 GeV"
    provenance: assumed
    where: "tau3scal_update_checked.tex:2231 ('we take mu = M_rho for all 2 pseudo-scalars modes')"
    note: >
      The paper sets mu = M_rho but the K pi channels (2,3) appear in neither
      M_rho row (:2864 is channel 1, :2865 channels 4-9).  0.775 assumed (the
      generic PDG default).  mu = 0.77554 moves the FSI factor by +0.04%; the
      footnote alternative mu = M_K* (:2232-2233, 'Alternatively ...') is a
      future option, not the default, and would move the width by +9.6%.

  width_convention:
    Kstar_892:
      denominator:
        where: "eq.(VFFKpi), tau3scal_update_checked.tex:817"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          \left(\frac{M^2_{K^*}+s\gamma_{K\pi}}{M^2_{K^*}-s-iM_{K^*} \Gamma_{K^*} (s)}
      running:
        where: "eq.(eq:kstarwidth_nosu3), tau3scal_update_checked.tex:881-888"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          \Gamma_{K^*}(q^2) = \Gamma_{K^*} \frac{q^2}{M_{K^*}^2} \frac{ \lambda^{3/2}\left(1,\frac{m_K^2}{q^2}, \frac{m_\pi^2}{q^2}\right)\theta(q^2 -thr_{K\pi}) + \lambda^{3/2}\left(1,\frac{m_K^2}{q^2},\frac{m_\eta^2}{q^2}\right)\theta(q^2 -thr_{K\eta})}
      denominator_theta:
        value: "the K eta term of the NORMALISING denominator lambda^{3/2}(1, m_K^2/M^2, m_eta^2/M^2) is set to zero because M_K* < m_K + m_eta"
        provenance: inferred
        where: "tau3scal_update_checked.tex:885-886 (printed without a theta function)"
        note: >
          Taken literally, lambda(1, m_K^2/M_K*^2, m_eta^2/M_K*^2) = -0.355 < 0
          and its 3/2 power is complex: the width becomes complex and the
          FSI-off width comes out +65% high.  The numerator carries
          theta(q^2 - thr_K eta) for the same term; the only real reading is
          the thresholded one, which is also what the definition
          Gamma_K* = Gamma_K*(M_K*^2) (:891) requires.
      note: >
        m0*Gamma(s) denominator with Gamma(s) = Gamma (s/M^2) lambda^{3/2}(s)/lambda^{3/2}(M^2).
        Since lambda^{1/2}(1,m1^2/s,m2^2/s) = 2k/sqrt(s), this is
        Gamma (M/sqrt(s)) (k/k0)^3, so M*Gamma(s) = sqrt(s) Gamma (M^2/s)(k/k0)^3
        identically (same algebra as the rho' in the pi pi file).  Plus the
        K eta channel above 1.091 GeV^2.
    Kstar_1410:
      denominator:
        where: "eq.(VFFKpi), tau3scal_update_checked.tex:818"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          -  \frac{s\gamma_{K\pi}}{M^2_{K^{*\prime}}-s-iM_{K^{*\prime}} \Gamma_{K^{*\prime}} (s)}
      running:
        where: "tau3scal_update_checked.tex:898-904"
        provenance: printed-eq
        fidelity: verbatim
        quote: |-
          \Gamma_{K^{*\prime}}\frac{q^2}{M_{K^{*\prime}}^2} \frac{\lambda^{3/2}\left(1,\frac{m_K^2}{q^2},\frac{m_\pi^2}{q^2}\right)}
      note: "K pi only, same (s/M^2) lambda^{3/2} ratio form."

