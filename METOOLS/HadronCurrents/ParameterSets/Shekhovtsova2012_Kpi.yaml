effective_poles:
  which: ["Kstar_1410.*", "gamma_Kpi"]
  why: >
    No errors are printed.  The K*' is labelled K*(1410) but sits at 1.307
    GeV with a +-25% suggested width band, and its coupling gamma_Kpi is
    printed to two figures: an effective pole.  The K*(892) mass and width
    are close to physical values but are the parameters of another paper's
    fit (this paper also carries PDG-like K* masses 0.89166 / 0.8961 in the
    same table and does NOT use them here), so they are not substitutable
    either.

