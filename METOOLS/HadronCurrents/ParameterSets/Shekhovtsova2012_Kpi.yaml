closure:
  status: NOT_ACCEPTED
  against: >
    The paper's partial widths (no spectrum is printed): analytic SU(2) sum
    2.5193e-14 (:1562), MC with physical phase-space masses per submode
    (:1309-1310), and MC with FSI off per submode (:1598-1599).  Rebuilt from
    this file alone in numpy: standard two-body rate, |C|^2 = 2 N^2,
    |V_us| = sin(theta_C) = 0.22220, averaged masses in the form factor,
    physical masses in phase space.
  result: |
    FSI off, K- pi0      : 7.40532e-15 vs 7.4275e-15 MC   (-0.299%)
    FSI off, pi- K0bar   : 1.42302e-14 vs 1.4276e-14 MC   (-0.321%)
    FSI on,  K- pi0      : 8.53155e-15 vs 8.5810e-15 MC   (-0.576%)
    FSI on,  pi- K0bar   : 1.64118e-14 vs 1.6512e-14 MC   (-0.607%)
    FSI on,  SU(2) sum   : 2.50464e-14 vs 2.5193e-14 analytic (-0.582%)
    submode ratio FSI on : 1.92366 vs 1.92425 ; FSI off : 1.92162 vs 1.92205
    FSI factor (on/off), K- pi0 : 1.15208 vs 1.15530 (-0.28%)
    Rejected readings, for the record: literal complex K eta term in the
    Gamma_K* normaliser: +65% (FSI off); physical masses inside the loops:
    submode ratio 1.9075 (0.9% off); M_K* = 0.89166: -2.7% (FSI off).
  residual_explained: >
    PARTLY.  Step 3b split: the two submodes are low by the same amount
    (-0.30% and -0.32% FSI off) while their ratio is right to 0.03%, so every
    component that differs between them (masses, N, phase space) is right and
    the fault is common to both.  It has two separable pieces.
    (a) -0.30% with FSI off, where F(0) = 1 exactly: a uniform normalisation
    or a K*-shape effect.  Candidates, none adjusted: |V_us| - the paper
    prints only cos theta_C = 0.975 and we infer sin theta_C = 0.22220; a
    value 0.2225 would close (a) to -0.03%, but no such number is in the
    paper, so this remains a hypothesis; or unprinted extra digits in
    Gamma_K* (0.0475) and gamma_Kpi (-0.043), each worth +-0.11% per
    half-unit of the last printed digit.
    (b) a further -0.28% in the Omnes factor.  Not explained: mu = 0.77554
    instead of 0.775 gives +0.04%, the K eta loop and the J-tilde
    subtraction each move it by 5-6% (not candidates for a 0.3% effect).
    Both pieces are 60-120 times the paper's quoted numerical precision, so
    by the acceptance rule this set is not accepted.  Physically the miss is
    irrelevant (the paper's own K pi width is 12% below PDG and it estimates
    its precision at 'a few percent', :1987-1991); the point is that
    something in this file may differ from what the paper ran, and that is
    exactly what closure exists to catch.
