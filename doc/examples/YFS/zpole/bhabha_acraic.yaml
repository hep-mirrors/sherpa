    OUTLIER_THRESHOLDS: [1,3,5]
    ANALYSES:
        - bhabhaNW 

# Small-angle Bhabha at the Z pole. The t-channel photon pole diverges as
# theta -> 0, so |t| has to be regulated at generator level.
#
# The generator cut must sit BELOW the analysis acceptance, not inside it:
# bhabhaNW vetoes unless BOTH leptons are at 24-58 mrad from their OWN beam,
# which at sqrt(s) = 91.1876 is |t| ~ 1.2 to 7.0 GeV^2. Cutting at 0.3 GeV^2
# leaves a factor ~4 of margin below the acceptance so the low edge is fed by
# direct production rather than only by radiative migration.
#
# Q2 is an INITIAL-FINAL selector (Standard_Selector.C, IQ2_Selector): it sets
# cuts->scut[i][j] between an incoming and an outgoing leg, i.e. exactly the
# t-channel invariant. Syntax: [Q2, kf1, kf2, min, max].
SELECTORS:
  - [Q2, 11, 11, 0.3, 1.0e6]

RESULT_DIRECTORY: Results_bhabha


