# tau- -> nu_tau K- pi- pi+
#
# One tau channel, forced. The HADRON_DECAYS block below overrides this
# channel's entry in HADRONS++/Decaydata.yaml: Status: [2] forces it and
# switches every other tau channel off, and the hadronic current and its
# form factor are stated here rather than taken from the table.
#
# BR: [1, 0] only gives the forced channel a non-zero weight (the table
# currently sets most tau channels to 0 for testing). It does not affect
# the events. The partial width Sherpa actually uses is integrated from
# the matrix element and printed at start-up as
#   "Calculating width (PR2) for tau- --> ...   yields: <GeV>"
# Compare it with Gamma_tau * BR(PDG), Gamma_tau = 2.267e-12 GeV.
# AlwaysIntegrate: 1 makes that integration rerun whenever the model here
# is changed, instead of reusing the table's cached result.
#
# Currents:     J1 = VA_F_F (tau- -> nu_tau), J2 = VA_0_KPiPi
# Form factor:  FF_0_PPP, mode KM_piM_piP
# Selected:     FORM_FACTOR: 15 (KS_flatte), the model the decay table uses:
#               genuine: Flatte K1(1270), Gounaris-Sakurai rho.
#               The J2 block below carries the 2026-11 tune, identical to the
#               one in this channel's Decaydata.yaml entry: fitted to Belle
#               2010 m(K- pi- pi+) (0.95-1.75 GeV), BaBar 2007 m(K- pi+) and
#               m(pi- pi+), and the PDG branching ratio.  The K1(1400) values
#               (MK1_1400_106/GK1_1400_106) are effective parameters of this
#               current, fitted under a PDG prior.  A card that restates
#               Currents replaces the table's, so keep these keys with it;
#               removing them gives the code defaults (xiK1Mag 0.70, no
#               direct couplings, no S wave, K1(1400) 1.463/0.300, Flatte
#               1.254/0.114114/0.136937).
#               Optional direct W* -> K* pi / K rho couplings with no K1 in
#               Q^2: add directMag_K1a (F1, K* pi) and directMag_K1b (F2,
#               K rho), with directPhase_K1a/_K1b in rad, to the J2 block.
#               Each K1 envelope becomes (T_K1 + c)/(1 + c), so the chiral
#               limit is kept. Default 0 (pure FM95 structure).
#               Optional K1(1270) -> (K pi)_S pi (the K pi S wave:
#               kappa = K0*(700), K0*(1430)): kappaMag_Kpipi /
#               kappaPhase_Kpipi, default 0. kappaLineShape_Kpipi picks
#               its line shape: 0 = Breit-Wigner kappa (comparison only),
#               1-4 = von Detten et al. (arXiv:2103.01966) Fit 1-4, the
#               dispersive scalar K pi form factor; 3 is the reference.
#
# Other FORM_FACTOR models for this channel:
#   0  None        identically zero (also what an omitted FORM_FACTOR gives)
#   1  Point       F = 1: no dynamics and no CKM/isospin normalisation
#   10 KS          genuine: KS
#   12 KS_CLEO     genuine: CLEO
#   13 KS_f0       genuine: KS + f0(500)
#   14 CLEO_f0     genuine: CLEO + f0(500)
#   16 CLEO_flatte genuine: CLEO + Flatte
#   20 RChiPT      not implemented, do not use
#   21 RChL2012    not implemented, do not use
#
# Leaving FORM_FACTOR out does not give a default: the current reads a
# missing key as 0 (None), so the channel would run with zero or nearly
# zero rate and no error. Always state it.
#
# Model parameters can be overridden alongside FORM_FACTOR. Their names are
# listed in this channel's entry in HADRONS++/Decaydata.yaml, whose comments
# use the current model numbers. The names themselves keep the earlier
# numbering as a suffix, because the code reads them under exactly those
# names: _100 -> 10, _101 -> 11, _102 -> 12, _103 -> 13, _104 -> 14,
# _106 -> 15, _200 -> 20, _201 -> 21. Writing e.g. _20 would be ignored.
#
# Run:  Sherpa -f Sherpa.K_pi_pi.yaml

BEAMS: [11, -11]
BEAM_ENERGIES: [7., 4.]   # irrelevant for a decayer run, but required

EVENT_TYPE: HadronDecay
DECAYER: 15
EVENTS: 10000

HADRON_DECAYS:
  Spin_Correlations: 1
  Channels:
    15:
      "-321,211,-211,16":
        BR: [1., 0.]
        Status: [2]
        AlwaysIntegrate: 1
        Currents:
          Exchange:
          - J1: {Type: VA_F_F, Indices: [4, 0], v: 1.0, a: -1.0}
            J2:
              Type: VA_0_KPiPi
              Indices: [1, 3, 2]
              FORM_FACTOR: 15
              kappaLineShape_Kpipi: 3
              xiK1Mag: 2.01526
              xiK1Phase: 2.72508
              directMag_K1a: 0.227579
              directPhase_K1a: -3.01507
              directMag_K1b: 1.02574
              directPhase_K1b: -2.47613
              kappaMag_Kpipi: 0.549187
              kappaPhase_Kpipi: -1.3771
              MK1_1400_106: 1.36516
              GK1_1400_106: 0.201513
              MK1_1270_Flatte: 1.29377
              gKstarPi_K1_1270: 0.674663
              gKrho_K1_1270: 0.284576

# Rivet comparison. --ignore-beams: the analyses look for tau decays and
# do not care that there is no collider event around them.
ANALYSIS: Rivet
ANALYSIS_OUTPUT: tau_K_pi_pi
RIVET:
  --ignore-beams: 1
  --analyses:
  - BELLE_2010_I841618    # K- pi- pi+ masses
  - BABAR_2007_I756323    # K- pi- pi+ masses
  - CLEO_2000_I525698     # K- pi- pi+ masses

# Sherpa needs a hard process to initialise, even for a decayer run.
SCALES: VAR{sqr(91.2)}
PROCESSES:
- 11 -11 -> 13 -13:
    Order: {QCD: 0, EW: 2}
