# tau- -> nu_tau K-
#
# One tau channel, forced. The HADRON_DECAYS block below overrides this
# channel's entry in HADRONS++/Decaydata.yaml: Status: [2] forces it and
# switches every other tau channel off, and the hadronic current is
# stated here rather than taken from the table.
#
# BR: [1, 0] only gives the forced channel a non-zero weight (the table
# currently sets most tau channels to 0 for testing). It does not affect
# the events. The partial width Sherpa actually uses is integrated from
# the matrix element and printed at start-up as
#   "Calculating width (PR2) for tau- --> ...   yields: <GeV>"
# Compare it with Gamma_tau * BR(PDG), Gamma_tau = 2.267e-12 GeV.
# AlwaysIntegrate: 1 makes that integration rerun whenever the model here
# is changed, instead of reusing the table's cached result.
#
# Currents:     J1 = VA_F_F (tau- -> nu_tau), J2 = VA_0_P (the created K-)
# Form factor:  none. The current is -i f_P V p^mu, so the rate is fixed by
#               the decay constant and the CKM element alone:
#               Gamma = G_F^2 V^2 f_P^2 m_tau^3 (1 - m_P^2/m_tau^2)^2 / (16 pi).
#               Defaults f_K = 0.1561 GeV, V_us = 0.2257; override with fP [GeV] and Vxx.
#
# Run:  Sherpa -f Sherpa.K.yaml

BEAMS: [11, -11]
BEAM_ENERGIES: [7., 4.]   # irrelevant for a decayer run, but required

EVENT_TYPE: HadronDecay
DECAYER: 15
EVENTS: 10000

HADRON_DECAYS:
  Spin_Correlations: 1
  Channels:
    15:
      "-321,16":
        BR: [1., 0.]
        Status: [2]
        AlwaysIntegrate: 1
        Currents:
          Exchange:
          - J1: {Type: VA_F_F, Indices: [2, 0], v: 1.0, a: -1.0}
            J2: {Type: VA_0_P, Indices: [1]}

# No Rivet analysis: in the tau rest frame the K- is monochromatic, so the
# rate is the whole test.

# Sherpa needs a hard process to initialise, even for a decayer run.
SCALES: VAR{sqr(91.2)}
PROCESSES:
- 11 -11 -> 13 -13:
    Order: {QCD: 0, EW: 2}
