# tau- -> nu_tau pi- pi- pi+ pi0
#
# One tau channel, forced. The HADRON_DECAYS block below overrides this
# channel's entry in HADRONS++/Decaydata.yaml: Status: [2] forces it and
# switches every other tau channel off, and the hadronic current and its
# form factor are stated here rather than taken from the table.
#
# BR: [1, 0] only gives the forced channel a non-zero weight (the table
# currently sets most tau channels to 0 for testing). It does not affect
# the events. The partial width Sherpa actually uses is integrated from
# the matrix element and printed at start-up as
#   "Calculating width (PR2) for tau- --> ...   yields: <GeV>"
# Compare it with Gamma_tau * BR(PDG), Gamma_tau = 2.267e-12 GeV.
# AlwaysIntegrate: 1 makes that integration rerun whenever the model here
# is changed, instead of reusing the table's cached result.
#
# Currents:     J1 = VA_F_F (tau- -> nu_tau), J2 = VA_0_Novosibirsk4Pi
#               (Bondar et al., with TAUOLA's normalisation).
# Form factor:  built into the current; there is no FORM_FACTOR key.
#               Novo4Pi_Component: 0, stated explicitly: the coherent
#               a1 pi + omega pi sum, which is the default.
#
# Other available models (Novo4Pi_Component):
#   1  a1 pi only
#   2  omega pi only
#   any other value is treated as 0.
#
# Parameter overrides: z_sigmapi_4piMag/Phase, Vud, Novo4Pi_ScaleA (default 1.2).
#
# Run:  Sherpa -f Sherpa.3pi_pi0.yaml

BEAMS: [11, -11]
BEAM_ENERGIES: [7., 4.]   # irrelevant for a decayer run, but required

EVENT_TYPE: HadronDecay
DECAYER: 15
EVENTS: 10000

HADRON_DECAYS:
  Spin_Correlations: 1
  Channels:
    15:
      "-211,-211,211,111,16":
        BR: [1., 0.]
        Status: [2]
        AlwaysIntegrate: 1
        Currents:
          Exchange:
          - J1: {Type: VA_F_F, Indices: [5, 0], v: 1.0, a: -1.0}
            J2: {Type: VA_0_Novosibirsk4Pi, Indices: [1, 2, 3, 4], Novo4Pi_Component: 0}

# Rivet comparison. --ignore-beams: the analyses look for tau decays and
# do not care that there is no collider event around them.
ANALYSIS: Rivet
ANALYSIS_OUTPUT: tau_3pi_pi0
RIVET:
  --ignore-beams: 1
  --analyses:
  - ARGUS_1987_I237930    # 4pi and omega pi spectral functions
  - CLEOII_1995_I400623   # 4pi and omega pi spectral functions
  - CLEOII_1999_I501487   # 4pi mass distributions
  - CLEOII_2000_I505170   # 4pi, omega pi and non-omega spectral functions
  - ALEPH_1996_I421984    # omega pi mass

# Sherpa needs a hard process to initialise, even for a decayer run.
SCALES: VAR{sqr(91.2)}
PROCESSES:
- 11 -11 -> 13 -13:
    Order: {QCD: 0, EW: 2}
