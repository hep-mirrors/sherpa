# tau- -> nu_tau pi- pi- pi+
#
# One tau channel, forced. The HADRON_DECAYS block below overrides this
# channel's entry in HADRONS++/Decaydata.yaml: Status: [2] forces it and
# switches every other tau channel off, and the hadronic current and its
# form factor are stated here rather than taken from the table.
#
# BR: [1, 0] only gives the forced channel a non-zero weight (the table
# currently sets most tau channels to 0 for testing). It does not affect
# the events. The partial width Sherpa actually uses is integrated from
# the matrix element and printed at start-up as
#   "Calculating width (PR2) for tau- --> ...   yields: <GeV>"
# Compare it with Gamma_tau * BR(PDG), Gamma_tau = 2.267e-12 GeV.
# AlwaysIntegrate: 1 makes that integration rerun whenever the model here
# is changed, instead of reusing the table's cached result.
#
# Currents:     J1 = VA_F_F (tau- -> nu_tau), J2 = VA_0_PPP
# Form factor:  FF_0_PPP
# Selected:     FORM_FACTOR: 12 (KS_CLEO), the model the decay table uses:
#               genuine: CLEO isobar model, hep-ex/9902022.
#               The J2 block below carries the 2026-11 tune, identical to
#               the one in this channel's Decaydata.yaml entry: database
#               resonances, CLEO's own a1 m0/Gamma0 (1.331/0.814), and the
#               couplings beta2..7, gamma_K*K and the a1' coupling fitted to
#               Belle 2010 and BaBar 2007 m(3pi), BaBar 2007 m(pi+pi-) and
#               ALEPH 2014.  A card that restates Currents replaces the
#               table's, so keep these keys with it; removing them gives
#               the code defaults (CLEO's couplings with the database a1).
#               FORM_FACTOR: 21 (RChL2012) is an equally good alternative,
#               tuned to the same data; its keys are listed in the 3pi
#               options of Decaydata.yaml and must be set in both 3pi
#               channels.
#
# Other FORM_FACTOR models for this channel:
#   0  None        identically zero (also what an omitted FORM_FACTOR gives)
#   1  Point       F = 1: no dynamics and no CKM/isospin normalisation
#   10 KS          genuine: KS a1 -> rho pi
#   13 KS_f0       not implemented, do not use
#   14 CLEO_f0     not implemented, do not use
#   15 KS_flatte   not implemented, do not use
#   16 CLEO_flatte not implemented, do not use
#   20 RChiPT      constant, no dynamics
#   21 RChL2012    genuine: RChL2012 + sigma, an equally good alternative
#
# Leaving FORM_FACTOR out does not give a default: the current reads a
# missing key as 0 (None), so the channel would run with zero or nearly
# zero rate and no error. Always state it.
#
# Model parameters can be overridden alongside FORM_FACTOR. Their names are
# listed in this channel's entry in HADRONS++/Decaydata.yaml, whose comments
# use the current model numbers. The names themselves keep the earlier
# numbering as a suffix, because the code reads them under exactly those
# names: _100 -> 10, _101 -> 11, _102 -> 12, _103 -> 13, _104 -> 14,
# _106 -> 15, _200 -> 20, _201 -> 21. Writing e.g. _20 would be ignored.
#
# Run:  Sherpa -f Sherpa.3pi.yaml

BEAMS: [11, -11]
BEAM_ENERGIES: [7., 4.]   # irrelevant for a decayer run, but required

EVENT_TYPE: HadronDecay
DECAYER: 15
EVENTS: 10000

HADRON_DECAYS:
  Spin_Correlations: 1
  Channels:
    15:
      "211,-211,-211,16":
        BR: [1., 0.]
        Status: [2]
        AlwaysIntegrate: 1
        Currents:
          Exchange:
          - J1: {Type: VA_F_F, Indices: [4, 0], v: 1.0, a: -1.0}
            J2:
              Type: VA_0_PPP
              Indices: [2, 3, 1]
              FORM_FACTOR: 12
              beta2Mag_3pi_CLEO: 0.48284181
              beta2Phase_3pi_CLEO: -0.80031417
              beta3Mag_3pi_CLEO: 0.81704555
              beta3Phase_3pi_CLEO: -2.0880906
              beta4Mag_3pi_CLEO: 3.1941607
              beta4Phase_3pi_CLEO: 1.7517693
              beta5Mag_3pi_CLEO: 1.5253345
              beta5Phase_3pi_CLEO: 0.86957672
              beta6Mag_3pi_CLEO: 0.15071942
              beta6Phase_3pi_CLEO: 0.68727521
              beta7Mag_3pi_CLEO: 1.2139898
              beta7Phase_3pi_CLEO: -2.9520108
              gammaKstarK_3pi_CLEO: 2.1101398
              MCLEOa1: 1.331
              GCLEOa1: 0.814
              betaMag_3pi_CLEOa1prime: 0.027310912
              betaPhase_3pi_CLEOa1prime: -0.42663494

# Rivet comparison. --ignore-beams: the analyses look for tau decays and
# do not care that there is no collider event around them.
ANALYSIS: Rivet
ANALYSIS_OUTPUT: tau_3pi
RIVET:
  --ignore-beams: 1
  --analyses:
  - BELLE_2010_I841618    # pi- pi- pi+ masses
  - BABAR_2007_I756323    # pi- pi- pi+ masses
  - ARGUS_1992_I339268    # 3pi mass

# Sherpa needs a hard process to initialise, even for a decayer run.
SCALES: VAR{sqr(91.2)}
PROCESSES:
- 11 -11 -> 13 -13:
    Order: {QCD: 0, EW: 2}
