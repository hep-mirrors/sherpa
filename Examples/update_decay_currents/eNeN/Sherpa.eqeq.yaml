# e- q -> e- q, deep inelastic scattering off a quark from the proton.
#
# The t-channel partner of eemumu/Sherpa.yaml, with the muon line replaced
# by a quark line. Each current takes one incoming and one outgoing leg of
# a single fermion line, rather than both legs of an incoming or an
# outgoing pair:
#
#   eemumu/Sherpa.yaml   J1 = [1, 0]  (e+, e-)        -> q = -(p0+p1), s
#   here                 J1 = [2, 0]  (e- out, e- in) -> q =  p2-p0,   t
#
# There is no s-channel/t-channel switch in the code: the invariant the
# exchange carries follows from the index assignment alone.
#
# Sort_Flavors: 0 keeps the legs in the order written above. Without it
# Sherpa sorts both the initial and the final state by mass, and the
# Indices: below would then point at different legs -- silently, because
# the indices are the only statement of which legs form a fermion line.
#
# The t-channel pole needs a cut, hence the Q2 selector. [Q2, 11, 11, ...]
# cuts on -(p_in - p_out)^2 between the incoming and outgoing electron,
# which is exactly the invariant the exchange carries, so it bounds the
# propagator denominator directly.
#
# VALIDATION: cross-checked against Comix running the same process, beams,
# PDF and cut with no Currents: block at all --
#     currents  144299 +- 634 pb
#     Comix     144525 +- 185 pb      (0.16% apart, 0.34 sigma)
# This is the first check of a coloured line: the colour factor and the
# quark's 2/3 charge are both DERIVED rather than declared, and neither is
# reachable by the XS_CURRENTS_ANALYTIC scaffold, which assumes unit
# charges and no colour.

BEAMS: [11, 2212]
BEAM_ENERGIES: 50.0

# WHY FIVE LINES FOR A PDF
#
# These are a workaround for THIS MACHINE, not physics: no LHAPDF sets are
# installed here, and Sherpa's default for a proton bunch is LHAPDF's
# PDF4LHC21_40_pdfas. NNPDF31_nnlo_as_0118_mc ships inside Sherpa itself
# (share/SHERPA-MC/) and needs nothing installed. Delete all five once
# LHAPDF has sets available.
#
# All five are load-bearing, in this order of discovery:
#   PDF_LIBRARY      naming the set is not enough; without the library its
#                    getter is never registered and the set is "not found"
#   MPI_PDF_*        a SEPARATE key that keeps its LHAPDF default even
#                    after PDF_SET is set -- and MI_HANDLER: None does NOT
#                    skip MPI PDF initialisation
#   ALPHAS USE_PDF   the internal NNPDF interface has no alpha_s, so asking
#                    for it throws "PDF doesn't implement alpha_s running"
PDF_LIBRARY:     [None, NNPDFSherpa]
PDF_SET:         [None, NNPDF31_nnlo_as_0118_mc]
MPI_PDF_LIBRARY: [None, NNPDFSherpa]
MPI_PDF_SET:     [None, NNPDF31_nnlo_as_0118_mc]
ALPHAS: {USE_PDF: 0}

# PARTICLE_DATA:
#   11: {Massive: true}
#   1: {Massive: true}

ME_GENERATORS: [Internal]

SELECTORS:
# - [PT, 11, 10.0, E_CMS]
# - [PT, 13, 10.0, E_CMS]
- [Q2, 11, 11, 1, 1e12] #[observable, flavor1, flavor2, min, max]

PROCESSES:
- 11 2 -> 11 2:        # e-(0) q(1) -> e-(2) q(3)
    Sort_Flavors: 0
    Order: {QCD: 0, EW: 2}
    Currents:
      Exchange:
      - Boson: 22
        J1: {Type: VA_F_F, Indices: [2, 0]}    # [out in]
        J2: {Type: VA_F_F, Indices: [3, 1]}
      - Boson: 23
        J1: {Type: VA_F_F, Indices: [2, 0]}
        J2: {Type: VA_F_F, Indices: [3, 1]}
