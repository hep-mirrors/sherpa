# e- mu- -> e- mu-, the t-channel partner of Sherpa.yaml.
#
# This is the same declaration with one change: each current now takes one
# incoming and one outgoing leg of a single fermion line, rather than both
# legs of an incoming or an outgoing pair.
#
#   Sherpa.yaml   J1 = [1, 0]  (e+, e-)        -> q = -(p0+p1), q^2 = s
#   here          J1 = [2, 0]  (e- out, e- in) -> q =  p2-p0,   q^2 = t
#
# Nothing else differs, and there is no s-channel/t-channel switch in the
# code: the invariant follows from the index assignment alone.
#
# The t-channel pole needs a cut, hence the selectors.
#
# Left massless on purpose, unlike the other cards. Giving these leptons
# their masses makes Sherpa demand the initial state be reordered to
# "13 11 -> 11 13", and with that ordering the electron line is {2,1}, so
# the exchanged momentum p2-p1 equals p0-p3 -- the exchange carries u, not
# t. XS_Currents classifies the invariant by whether J1 holds index 2 or 3,
# which is only right when J1 also holds index 0. Fix that before making
# this card massive; see the note in the project doc.


#  now doing e p -> e p 
# default pdf splits the proton up
# sherpa will set any energy below rest mass to the rest mass.

# Form factor models of VA_N_N / FF_N_N:
#   VFF (vector, F1/F2): 0 off, 1 pointlike Dirac, 10 Kelly (default)
#   AFF (axial, F_A):    0 off, 1 constant g_A, 20 Meyer deuterium (default),
#                        21 lattice-QCD z-expansion
#  numbers 10 and 20 come from FF base class
#   AFF is ignored for the photon (no axial coupling); it acts on Z and W.
TAGS: {VFF: 1, AFF: 20, nucleon: 2112}

EVENTS: 10k

BEAMS: [11, $(nucleon)]
BEAM_ENERGIES: [3.6, 0.0] # sherpa will set any energy below rest mass to the rest mass.
PDF_SET: [None, Intact] 

PARTICLE_DATA:
  11: {Massive: true}
  2212: {Massive: true}
  2112: {Massive: true}

ME_GENERATORS: [Internal]

SELECTORS:
# - [PT, 11, 10.0, E_CMS]
# - [PT, 13, 10.0, E_CMS]
- [Q2, 11, 11, 0.001, 1e12] #[observable, flavor1, flavor2, min, max]
# note that for proton minQ2=0.001 => XS ~ 2.5e8 pb
# for minQ2=0.01 => XS ~ 2.5e7 pb
# for minQ2=1 => XS ~ 5e3 pb, NOTE how its not linear in min Q2 due to FF

PROCESSES:
- 11 $(nucleon) -> 11 $(nucleon):        
    Sort_Flavors: 0
    Order: {QCD: 0, EW: 2}
    Currents:
      Exchange:
      - Boson: 22
        J1: {Type: VA_F_F, Indices: [2, 0]}    # electron [out in]
        J2: {Type: VA_N_N, Indices: [3, 1],    # nucleon [out in]
              BOSON: 22, VECTOR_FF: $(VFF), AXIAL_FF: $(AFF)}
      # - Boson: 23
      #   J1: {Type: VA_F_F, Indices: [2, 0]}
      #   J2: {Type: VA_N_N, Indices: [3, 1], 
      #         BOSON: 23, VECTOR_FF: $(VFF), AXIAL_FF: $(AFF)}

# settings for now for low energies

SHOWER_GENERATOR: None
SCALES: VAR{-Abs2(p[0]-p[2])}  # need if turning off shower

FRAGMENTATION: None
BEAM_REMNANTS: false
MI_HANDLER: None
HADRON_DECAYS:
  Model: None
YFS: {MODE: None}

ANALYSIS: Rivet
ANALYSIS_OUTPUT: Analysis_V$(VFF)_A$(AFF)_N$(nucleon)

RIVET:
  --analyses: [my_MC_FSPARTICLES, MC_XS]
  --pwd: /Users/tvcr49@durham.ac.uk/code_analysis/MyRivetAnalyses
  --ignore_beams: 1

