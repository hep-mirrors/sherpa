# Original author: Valentin Boettcher <hiro@protagon.space> (Gitlab: vale9811)
# Rewritten by: Andrii Verbytskyi andrii.verbytskyi@mpp.mpg.de
# Rewritten by: Frank Siegert frank.siegert@tu-dresden.de
# Rewritten by: Malte Müller malte.mueller@mailbox.tu-dresden.de

stages:
  - build_docker_image
  - build
  - deploy

variables:
  DOXYGEN_CMAKE_FLAGS: -DSHERPA_ENABLE_DOXYGEN=ON -DDOXYGEN_WARN_AS_ERROR=YES
  CATCH2_CMAKE_FLAGS: -DSHERPA_ENABLE_CATCH2:BOOL=ON -DSHERPA_ENABLE_COVERAGE:BOOL=ON
  COMMON_EXTRA_CMAKE_FLAGS: -DSHERPA_ENABLE_EWSUD:BOOL=ON -DSHERPA_ENABLE_TESTING:BOOL=ON
  EXTENDED_EXTRA_CMAKE_FLAGS: -DSHERPA_ENABLE_ANALYSIS:BOOL=ON -DSHERPA_ENABLE_BINRELOC:BOOL=ON -DSHERPA_ENABLE_BLACKHAT:BOOL=ON -DSHERPA_ENABLE_DIHIGGS:BOOL=OFF -DSHERPA_ENABLE_EXAMPLES:BOOL=ON -DSHERPA_ENABLE_GOSAM:BOOL=ON -DSHERPA_ENABLE_GZIP:BOOL=ON -DSHERPA_ENABLE_HEPMC3:BOOL=ON -DSHERPA_ENABLE_HEPMC3_ROOT:BOOL=OFF -DSHERPA_ENABLE_INTERNAL_PDFS:BOOL=ON -DSHERPA_ENABLE_INSTALL_LIBZIP:BOOL=OFF -DSHERPA_ENABLE_INSTALL_LHAPDF:BOOL=OFF -DSHERPA_ENABLE_LHOLE:BOOL=ON -DSHERPA_ENABLE_MADLOOP:BOOL=ON -DSHERPA_ENABLE_MANUAL:BOOL=OFF -DSHERPA_ENABLE_MCFM:BOOL=OFF -DSHERPA_ENABLE_MPI:BOOL=OFF -DSHERPA_ENABLE_OPENLOOPS:BOOL=ON -DSHERPA_ENABLE_PYTHIA8:BOOL=ON -DSHERPA_ENABLE_PYTHON:BOOL=ON -DSHERPA_ENABLE_RECOLA:BOOL=ON -DSHERPA_ENABLE_RIVET:BOOL=ON -DSHERPA_ENABLE_ROOT:BOOL=ON -DSHERPA_ENABLE_THREADING:BOOL=ON -DSHERPA_ENABLE_UFO:BOOL=ON -DSHERPA_ENABLE_HDF5:BOOL=ON
  NCOMPILATION_JOBS: 1
  # Cache optimization settings
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 1
  CCACHE_COMPILERCHECK: content
  # Suffix of the CI image tag; set to -mr<IID> in MR pipelines that change a CI Dockerfile
  IMAGE_SUFFIX: ""
  # Tells apart compiler caches of jobs sharing OS, FREL and TOOLSET (e.g. make vs. ninja)
  CACHE_VARIANT: ""
  # Flag to block Dockerfiles from building in MR pipelines
  ALLOW_DOCKERBUILDS_IN_MR: true


############################################################################
# Workflow
############################################################################

# restricts which pipelines are allowed to run
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

    # Draft OR Ready MR:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

    # not needed bc feature branch pipelines are not allowed
    # # If this branch already has an MR, suppress the ordinary push pipeline.
    # - if:  $CI_COMMIT_BRANCH &&  $CI_OPEN_MERGE_REQUESTS
    #   when: never

    # only run branch pipelines on master
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    # release tags: rebuild the website and deploy the tagged manual
    - if: $CI_COMMIT_TAG

    # Everything else is disabled
    - when: never

############################################################################
# Rule sets:
############################################################################
# Jobs using this template exist only on the default/master branch.
.master-build-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
      allow_failure: false
    - when: never

# Jobs using this template exist only in merge request pipelines.
.feature-build-rules:
  rules:
    # MR changing a CI Dockerfile: build against the images built from it (see .build_docker_image)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - CI/*/Dockerfile*
      variables:
        IMAGE_SUFFIX: -mr$CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: false

    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: false

    - when: never

############################################################################
# build_docker_image
############################################################################

# base class
.build_docker_image:
  stage: build_docker_image
  # Kaniko is archived upstream, so pin its last release rather than the moving :debug tag
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]

  # Rebuilds all images for the weekly schedule, or when a CI Dockerfile changes.
  # Master (and manually run master pipelines, where `changes` is always true) publish
  # the ${OS}_${FREL} tags used by everyone; an MR publishes ${OS}_${FREL}-mr<IID> tags
  # that only its own build jobs use (see .feature-build-rules).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - CI/*/Dockerfile*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $ALLOW_DOCKERBUILDS_IN_MR
      changes:
        - CI/*/Dockerfile*
      variables:
        IMAGE_SUFFIX: -mr$CI_MERGE_REQUEST_IID
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile CI/$OS/Dockerfile$FREL --destination $CI_REGISTRY_IMAGE:${OS}_${FREL}${IMAGE_SUFFIX}
  variables:
    GIT_DEPTH: "1"
  retry: 2


# jobs for different OS, one Dockerfile per version: CI/$OS/Dockerfile$FREL

build_image_Fedora44:
  variables:
    OS: Fedora
    FREL: 44
  extends: .build_docker_image

build_image_Fedora43:
  variables:
    OS: Fedora
    FREL: 43
  extends: .build_docker_image

build_image_CentOS9:
  variables:
    OS: CentOS
    FREL: 9
  extends: .build_docker_image

build_image_Archlinux0:
  variables:
    OS: Archlinux
    FREL: 0
  extends: .build_docker_image


############################################################################
# build stage
############################################################################

.any:
  image: $CI_REGISTRY_IMAGE:${OS}_${FREL}${IMAGE_SUFFIX}
  stage: build
  coverage: '/^\s*lines\.+: (\d+\.\d+)%/'
  # always: the coverage report only exists when the tests have passed
  artifacts:
    expire_in: 2 days
    paths:
      - BUILD/Tests/*/*.pdf
      - BUILD/Tests/*/rivet-plots
      - BUILD/Tests/coverage.info
      - BUILD/Tests/html
    when: always

.cmake: &cmake
    # All images ship a recent CMake as plain cmake/ctest; the cmake3/ctest3 names were
    # only needed on CentOS 7, and newer packages (e.g. Fedora 44) no longer provide them.
    - export CMAKE=cmake
    - export CTEST=ctest
    - export COMPILATIONSTART=$(date +%s)
    - $CMAKE --version
    - $CMAKE -S . -B BUILD -DCMAKE_INSTALL_PREFIX=$(pwd)/CM  $EXTRACMAKEFLAGS $CACHINGFLAGS
    - $CMAKE --build BUILD -j $NCOMPILATION_JOBS
    # this job's compiler-cache hit rate (counters reset in .any-cmake-ccache)
    - if [ -n "$CCACHE_DIR" ]; then ccache -s || true; fi
    - export COMPILATIONEND=$(date +%s)
    - $CMAKE --install BUILD
    - echo $COMPILATIONSTART $COMPILATIONEND $(echo $COMPILATIONEND-$COMPILATIONSTART | bc -l)
    - $CTEST --test-dir BUILD --output-on-failure
    - if [[ $EXTRACMAKEFLAGS == *"ENABLE_COVERAGE"* ]]; then $CMAKE --build BUILD --target coverage; fi
    - if [[ $EXTRACMAKEFLAGS == *"ENABLE_COVERAGE"* ]]; then lcov --summary BUILD/Tests/coverage.info; fi
    - if [ "$BUILDDOCS" ]; then $CMAKE --build BUILD --target docs; fi

.ex:  &ex
    - if [ "${TOOLSET}" == "LLVM" ]; then export CXX=clang++; export CC=clang; export FC=gfortran; fi
    - if [ "${TOOLSET}" == "GNU" ]; then export CXX=g++; export CC=gcc; export FC=gfortran; fi
    - if [ "${TOOLSET}" == "GNUMPI" ]; then source /etc/profile.d/modules.sh || true; module load openmpi || module load mpi/openmpi-x86_64 || true; export CXX=mpic++; export CC=mpicc; export FC=gfortran; fi

.any-cmake-ccache:
  extends: .any
  timeout: 120m
  before_script:
    - *ex
    # must match the cache paths below
    - export CACHE_ROOT=$CI_PROJECT_DIR/cmake-$TOOLSET$CACHE_VARIANT-cache-$OS$FREL
    # Start the weekly scheduled build from an empty cache (to clear it by hand, use
    # "Clear runner caches" on the pipelines page)
    - if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then rm -rf $CACHE_ROOT; fi
    - df -h ./
    - df -h /tmp
    # Rewrite absolute paths below the checkout to relative ones (and do not hash the cwd),
    # so that cache hits survive the checkout landing in a different runner/build directory
    - export CCACHE_BASEDIR=$CI_PROJECT_DIR
    - export CCACHE_NOHASHDIR=1
    # size limit, compression and compiler check come from the global CCACHE_* variables
    - export CCACHE_DIR=$CACHE_ROOT/ccache
    - mkdir -p ${CCACHE_DIR}
    # f90cache setup with size limits
    - export F90CACHE_DIR=$CACHE_ROOT/f90cache
    - export F90CACHE_TMPDIR=`pwd`/tmpf90cache
    - export F90CACHE_MAXSIZE=300M
    - mkdir -p ${F90CACHE_DIR}
    - mkdir -p ${F90CACHE_TMPDIR}
    - export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_Fortran_COMPILER_LAUNCHER=f90cache"
    - 'if [ "${FREL}" == "0" ]; then export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache "; fi'
    - 'if [ "${TOOLSET}" == "GNUMPI" ]; then export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache "; fi'
    # Show the restored cache, then reset the counters so that the stats printed
    # after the build (see .cmake) are this job's own
    - ccache -s || true
    - ccache -z || true
  script:
    - *cmake
  # MR (unprotected) pipelines only pull the cache that master (protected) pushes. With
  # GitLab's default "separate caches for protected branches", the two would use different
  # keys and MR builds would always start cold; `unprotect` makes them share one key.
  cache:
    - key: cmake-$TOOLSET$CACHE_VARIANT-cache-$OS$FREL
      paths:
        - cmake-$TOOLSET$CACHE_VARIANT-cache-$OS$FREL/
      unprotect: true
      policy: pull
      when: on_success

# Override for main branch to enable push
.any-cmake-ccache-main:
  extends: .any-cmake-ccache
  cache:
    - key: cmake-$TOOLSET$CACHE_VARIANT-cache-$OS$FREL
      paths:
        - cmake-$TOOLSET$CACHE_VARIANT-cache-$OS$FREL/
      unprotect: true
      policy: pull-push
      when: on_success

# Main branch jobs use pull-push policy
Fedora43-make-ccache-GNU:
  variables:
    OS: Fedora
    FREL: 43
    TOOLSET: GNU
    EXTRACMAKEFLAGS: $COMMON_EXTRA_CMAKE_FLAGS $EXTENDED_EXTRA_CMAKE_FLAGS $DOXYGEN_CMAKE_FLAGS
    BUILDDOCS: 1
  extends:
    - .any-cmake-ccache-main
    - .master-build-rules
  needs:
    - job: build_image_Fedora43
      optional: true

