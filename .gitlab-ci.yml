############################################################################
# Deploy
############################################################################

# Rebuild the Website to include this tag in the changelogs.
trigger_pages:
  stage: deploy
  variables:
    GIT_STRATEGY: none  # only calls the API, no checkout needed
  rules:
    - if: '$CI_COMMIT_TAG && $CI_SERVER_HOST=="gitlab.com"'
      when: always
    - when: never
  script:
    - "curl --fail -X POST -F token=$PAGES_TRIGGER_TOKEN -F ref=master https://gitlab.com/api/v4/projects/8892644/trigger/pipeline"
  needs: []

# base snippet to build manual into its own path_prefix using the gitlab pages "parallel deployment" feature
.manual-base:
  stage: deploy
  image: $CI_REGISTRY_IMAGE:Fedora_44
  script:
    - cmake -S . -B build  -DSHERPA_ENABLE_MANUAL=ON -DLibZip_DIR=/usr -DSHERPA_ENABLE_INSTALL_LHAPDF:BOOL=ON
    - cd build/doc; make; cd ../..;
    - mkdir public;
    - mv build/doc/sherpamanual_html/* public/;
    - mv build/doc/sherpamanual_singlehtml/index.html public/index_single.html
    - mv build/doc/sherpamanual.pdf public/
  artifacts:
    paths:
      - public
  pages:
    path_prefix: "$CI_COMMIT_REF_NAME"

# build manual for release tags or master
manual-release:
  extends: .manual-base
  pages:
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG || ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: always
    - when: never
  # start right away instead of after the build stage, but wait for a Fedora44 image
  # rebuild when the pipeline has one
  needs:
    - job: build_image_Fedora44
      optional: true

# build manual index page for all versions
# also get older versions manuals from eos if available and add them
manual-index:
  stage: deploy
  image: $CI_REGISTRY_IMAGE:Fedora_44
  script:
    - rm -rf public
    - mkdir public
    - cd public
    - if wget https://sherpa.web.cern.ch/doc/old-manuals.tar.gz; then tar xzf old-manuals.tar.gz; rm old-manuals.tar.gz; fi
    - cd ..
    # use the index script from master; a tag pipeline's clone only contains the tag ref
    - git fetch --depth=1 origin master
    - git show FETCH_HEAD:doc/make-index.sh > make-index.sh
    - bash make-index.sh > public/index.html

  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: $CI_COMMIT_TAG || ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: always
    - when: never
  needs: [ "manual-release" ]
