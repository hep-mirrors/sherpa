# Rewritten by: Andrii Verbytskyi andrii.verbytskyi@mpp.mpg.de
# Rewritten by: Frank Siegert frank.siegert@tu-dresden.de
# Rewritten by: Malte Müller malte.mueller@mailbox.tu-dresden.de

stages:
  - build_docker_image
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOXYGEN_CMAKE_FLAGS: -DSHERPA_ENABLE_DOXYGEN=ON -DDOXYGEN_WARN_AS_ERROR=YES
  CATCH2_CMAKE_FLAGS: -DSHERPA_ENABLE_CATCH2:BOOL=ON -DSHERPA_ENABLE_COVERAGE:BOOL=ON
  COMMON_EXTRA_CMAKE_FLAGS: -DSHERPA_ENABLE_EWSUD:BOOL=ON -DSHERPA_ENABLE_TESTING:BOOL=ON
  EXTENDED_EXTRA_CMAKE_FLAGS: -DSHERPA_ENABLE_ANALYSIS:BOOL=ON -DSHERPA_ENABLE_BINRELOC:BOOL=ON -DSHERPA_ENABLE_BLACKHAT:BOOL=ON -DSHERPA_ENABLE_DIHIGGS:BOOL=OFF -DSHERPA_ENABLE_EXAMPLES:BOOL=ON -DSHERPA_ENABLE_GOSAM:BOOL=ON -DSHERPA_ENABLE_GZIP:BOOL=ON -DSHERPA_ENABLE_HEPMC3:BOOL=ON -DSHERPA_ENABLE_HEPMC3_ROOT:BOOL=OFF -DSHERPA_ENABLE_INTERNAL_PDFS:BOOL=ON -DSHERPA_ENABLE_INSTALL_LIBZIP:BOOL=OFF -DSHERPA_ENABLE_INSTALL_LHAPDF:BOOL=OFF -DSHERPA_ENABLE_LHOLE:BOOL=ON -DSHERPA_ENABLE_MADLOOP:BOOL=ON -DSHERPA_ENABLE_MANUAL:BOOL=OFF -DSHERPA_ENABLE_MCFM:BOOL=OFF -DSHERPA_ENABLE_MPI:BOOL=OFF -DSHERPA_ENABLE_OPENLOOPS:BOOL=ON -DSHERPA_ENABLE_PYTHIA8:BOOL=ON -DSHERPA_ENABLE_PYTHON:BOOL=ON -DSHERPA_ENABLE_RECOLA:BOOL=ON -DSHERPA_ENABLE_RIVET:BOOL=ON -DSHERPA_ENABLE_ROOT:BOOL=ON -DSHERPA_ENABLE_THREADING:BOOL=ON -DSHERPA_ENABLE_UFO:BOOL=ON -DSHERPA_ENABLE_HDF5:BOOL=ON
  NCOMPILATION_JOBS: 1
  MAKE_FLAGS: -j4
  # Cache optimization settings
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: 1
  CCACHE_COMPILERCHECK: content


############################################################################
# Workflow
############################################################################

# restricts which pipelines are allowed to run
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      
    # Draft OR Ready MR:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

    # not needed bc feature branch pipelines are not allowed
    # # If this branch already has an MR, suppress the ordinary push pipeline.
    # - if:  $CI_COMMIT_BRANCH &&  $CI_OPEN_MERGE_REQUESTS 
    #   when: never

    # only run branch pipelines on master
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    # Everything else is disabled 
    - when: never

############################################################################
# Rule sets:
############################################################################
# Jobs using this template exist only on the default/master branch.
.master-build-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
      allow_failure: false
    - when: never

.feature-build-rules:
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

    - when: never

############################################################################
# build_docker_image
############################################################################

# base class
.build_docker_image:
  stage: build_docker_image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

  # runs automatically for weekly updates or if the dockerfiles are changed in a branch pipeline
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile CI/$OS/Dockerfile$FREL --destination $CI_REGISTRY_IMAGE:${OS}_$FREL 
  variables:
    GIT_DEPTH: "1"
  retry: 2

  
# jobs for different OS:
# PROBLEM: fedora always builds version 42 in current setup
# FIX: 1 Dockerfile for each version to unify the procedure across different OS

build_image_Fedora44:
  rules: 
    - if: $CI_COMMIT_MESSAGE =~ /fedora43/i
    - !reference [.build_docker_image, rules]
  variables:
    OS: Fedora
    FREL: 44
  extends: .build_docker_image

build_image_Fedora43:
  rules: 
    - if: $CI_COMMIT_MESSAGE =~ /fedora44/i
    - !reference [.build_docker_image, rules]
  variables:
    OS: Fedora
    FREL: 43
  extends: .build_docker_image

build_image_CentOS9:
  rules: 
    - if: $CI_COMMIT_MESSAGE =~ /centos/i
    - !reference [.build_docker_image, rules]
  variables:
    OS: CentOS
    FREL: 9
  extends: .build_docker_image

build_image_Archlinux0:
  rules: 
    - if: $CI_COMMIT_MESSAGE =~ /archlinux/i
    - !reference [.build_docker_image, rules]
  variables:
    OS: Archlinux
    FREL: 0
  extends: .build_docker_image


############################################################################
# build stage
############################################################################

.any:
  image: $CI_REGISTRY_IMAGE:${OS}_${FREL}
  stage: build
  before_script:
    - set -x
    - uname -a
    - cat /etc/issue
    - export GIT_DEPTH=1
  coverage: '/^\s*lines\.+: (\d+\.\d+)%/'
  artifacts:
    expire_in: 2 days
    paths:
      - BUILD/Tests/*/*.pdf
      - BUILD/Tests/*/rivet-plots
      - BUILD/Tests/coverage.info
      - BUILD/Tests/html
    when: on_failure

.cmake: &cmake
    - export CMAKE=cmake3
    - export CTEST=ctest3
    - if [ "${FREL}" == "7" ]; then export CMAKE=cmake3; CTEST=ctest3; fi
    - if [ "${FREL}" == "0" ]; then export CMAKE=cmake; CTEST=ctest; fi
    - export COMPILATIONSTART=$(date +%s)
    - $CMAKE --version
    - $CMAKE -S . -B BUILD -DCMAKE_INSTALL_PREFIX=$(pwd)/CM  $EXTRACMAKEFLAGS $CACHINGFLAGS
    - $CMAKE --build BUILD -j $NCOMPILATION_JOBS
    - export COMPILATIONEND=$(date +%s)
    - $CMAKE --install BUILD
    - echo $COMPILATIONSTART $COMPILATIONEND $(echo $COMPILATIONEND-$COMPILATIONSTART | bc -l)
    - $CTEST --test-dir BUILD --output-on-failure
    - if [[ $EXTRACMAKEFLAGS == *"ENABLE_COVERAGE"* ]]; then $CMAKE --build BUILD --target coverage; fi
    - if [[ $EXTRACMAKEFLAGS == *"ENABLE_COVERAGE"* ]]; then lcov --summary BUILD/Tests/coverage.info; fi
    - if [ "$BUILDDOCS" ]; then $CMAKE --build BUILD --target docs; fi

.ex:  &ex
    - if [ "${TOOLSET}" == "LLVM" ]; then export CXX=clang++; export CC=clang; export FC=gfortran; fi
    - if [ "${TOOLSET}" == "GNU" ]; then export CXX=g++; export CC=gcc; export FC=gfortran; fi
    - if [ "${TOOLSET}" == "GNUMPI" ]; then source /etc/profile.d/modules.sh || true; module load openmpi || module load mpi/openmpi-x86_64 || true; export CXX=mpic++; export CC=mpicc; export FC=gfortran; fi

.any-cmake:
  extends: .any
  script:
      - *ex
      - *cmake

.any-cmake-ccache:
  extends: .any
  timeout: 120m
  before_script:
    - *ex
    # Cache cleanup logic
    - if [ "$CI_COMMIT_MESSAGE" = "cleancache" ]; then rm -rf cmake-$TOOLSET-cache-$FREL; fi
    - if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then rm -rf cmake-$TOOLSET-cache-$FREL; fi
    - df -h ./
    - df -h /tmp
    # Set ccache limits to prevent unbounded growth
    - export CCACHE_BASEDIR=`pwd`/cmake-$TOOLSET-cache-$FREL
    - export CCACHE_DIR=`pwd`/cmake-$TOOLSET-cache-$FREL/ccache
    - export CCACHE_MAXSIZE=${CCACHE_MAXSIZE:-500M}
    - export CCACHE_COMPRESS=${CCACHE_COMPRESS:-1}
    - export CCACHE_COMPILERCHECK=${CCACHE_COMPILERCHECK:-content}
    - mkdir -p ${CCACHE_DIR}
    - mkdir -p ${CCACHE_BASEDIR}
    # f90cache setup with size limits
    - export F90CACHE_DIR=`pwd`/cmake-$TOOLSET-cache-$FREL/f90cache
    - export F90CACHE_TMPDIR=`pwd`/tmpf90cache
    - export F90CACHE_MAXSIZE=300M
    - mkdir -p ${F90CACHE_DIR}
    - mkdir -p ${F90CACHE_TMPDIR}
    - export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_Fortran_COMPILER_LAUNCHER=f90cache"
    - 'if [ "${FREL}" == "7" ]; then export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache "; fi'
    - 'if [ "${FREL}" == "0" ]; then export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache "; fi'
    - 'if [ "${TOOLSET}" == "GNUMPI" ]; then export CACHINGFLAGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache "; fi'
    # Display cache stats
    - ccache -s || true
  script:
    - *cmake
  cache:
    - key: cmake-$TOOLSET-cache-$FREL
      paths:
        - cmake-$TOOLSET-cache-$FREL/
      # Use variable to control policy based on branch
      policy: pull
      when: on_success

# Override for main branch to enable push
.any-cmake-ccache-main:
  timeout: 120m
  extends: .any-cmake-ccache
  cache:
    - key: cmake-$TOOLSET-cache-$FREL
      paths:
        - cmake-$TOOLSET-cache-$FREL/
      policy: pull-push
      when: on_success
    
# Main branch jobs use pull-push policy
